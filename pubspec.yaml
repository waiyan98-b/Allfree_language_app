name: allfree_language_app
description: "Allfree Thai Language Learning Application - Comprehensive 12-Chapter Master Curriculum"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Persistence
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # Audio & Media
  audioplayers: ^6.0.0
  speech_to_text: ^6.6.1

  # UI Utilities
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoMaster Pro - 8 Languages Mega Practice</title>
  <style>
    :root {
      --green: #58cc02;
      --green-dark: #46a302;
      --green-light: #d7ffb8;
      --blue: #1cb0f6;
      --blue-dark: #0f86be;
      --purple: #a435f0;
      --gold: #ffc800;
      --gold-dark: #cc9a00;
      --red: #ff4b4b;
      --red-light: #ffdfe0;
      --gray: #e5e5e5;
      --text: #2f2f2f;
      --bg: #f7f9fa;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: white;
      border-bottom: 2px solid var(--gray);
      font-weight: bold;
      font-size: 14px;
    }
    .lang-select {
      border: 2px solid var(--blue);
      border-radius: 10px;
      padding: 5px 8px;
      font-weight: bold;
      font-size: 13px;
      outline: none;
      background: #f0f9ff;
      color: #0277bd;
    }
    .stats-row { display: flex; gap: 10px; align-items: center; }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      padding-bottom: 75px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .summary-card {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(135deg, #00897b, #004d40);
      color: white;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-stat-box { text-align: center; }
    .summary-stat-num { font-size: 20px; font-weight: bold; }
    .summary-stat-label { font-size: 11px; opacity: 0.9; }

    .cefr-tabs {
      display: flex;
      overflow-x: auto;
      width: 100%;
      max-width: 480px;
      gap: 6px;
      padding-bottom: 10px;
      margin-bottom: 8px;
    }
    .cefr-tab-btn {
      flex: 0 0 auto;
      padding: 6px 12px;
      border-radius: 16px;
      border: 1px solid #ccc;
      background: white;
      font-weight: bold;
      font-size: 12px;
      color: #666;
      cursor: pointer;
    }
    .cefr-tab-btn.active { background: var(--blue); color: white; border-color: var(--blue-dark); }
    .chapter-card {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 2px solid var(--gray);
      box-shadow: 0 3px 0 var(--gray);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .chapter-card:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gray); }
    .chapter-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
      margin-bottom: 4px;
    }
    .badge-a1 { background: var(--green); }
    .badge-a2 { background: #00b0ff; }
    .badge-b1 { background: #00c853; }
    .badge-b2 { background: #ff9100; }
    .badge-c1 { background: var(--purple); }
    .badge-c2 { background: var(--gold-dark); }
    
    .game-container {
      display: none;
      width: 100%;
      max-width: 460px;
      flex-direction: column;
      height: 100%;
    }
    .progress-bar {
      width: 100%;
      height: 12px;
      background: var(--gray);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill { height: 100%; width: 0%; background: var(--green); transition: width 0.3s; }
    .speaker-btn {
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 3px 0 var(--blue-dark);
      cursor: pointer;
      align-self: flex-start;
      margin-bottom: 12px;
    }
    .prompt-box { font-size: 18px; font-weight: bold; margin-bottom: 16px; line-height: 1.4; }
    .answer-slot {
      min-height: 48px;
      border-bottom: 2px solid var(--gray);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px 0;
      margin-bottom: 20px;
    }
    .word-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .word-bubble {
      background: white;
      border: 2px solid var(--gray);
      box-shadow: 0 3px 0 var(--gray);
      padding: 9px 13px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .word-bubble.used { opacity: 0.2; pointer-events: none; }
    .choice-btn {
      width: 100%;
      background: white;
      border: 2px solid var(--gray);
      box-shadow: 0 3px 0 var(--gray);
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      text-align: left;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .choice-btn.selected { border-color: var(--blue); background: #e1f5fe; }
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 18px;
      background: white;
      border-top: 2px solid var(--gray);
    }
    .btn-action {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      background: var(--green);
      color: white;
      box-shadow: 0 4px 0 var(--green-dark);
      cursor: pointer;
    }
    .feedback-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }
    .feedback-sheet.correct { background: var(--green-light); color: var(--green-dark); }
    .feedback-sheet.wrong { background: var(--red-light); color: var(--red); }
  </style>
</head>
<body>

  <div class="top-bar">
    <select class="lang-select" id="langPicker" onchange="changeLanguage()">
      <option value="en">🇬🇧 English</option>
      <option value="th">🇹🇭 ไทย (Thai)</option>
      <option value="de">🇩🇪 Deutsch (German)</option>
      <option value="es">🇪🇸 Español (Spanish)</option>
      <option value="fr">🇫🇷 Français (French)</option>
      <option value="ko">🇰🇷 한국어 (Korean)</option>
      <option value="ja">🇯🇵 日本語 (Japanese)</option>
      <option value="it">🇮🇹 Italiano (Italian)</option>
    </select>
    <div class="stats-row">
      <div style="color: #ff9600;">🔥 <span id="streakCount">1</span></div>
      <div style="color: #1cb0f6;">⭐ <span id="xpCount">0</span> XP</div>
      <div style="color: #ff4b4b;">❤️ ∞</div>
    </div>
  </div>

  <main>
    <div id="curriculumView" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <div class="summary-card">
        <div class="summary-stat-box">
          <div class="summary-stat-num" id="totalChapterCount">0</div>
          <div class="summary-stat-label">စုစုပေါင်း Chapter</div>
        </div>
        <div style="width: 1px; height: 35px; background: rgba(255,255,255,0.3);"></div>
        <div class="summary-stat-box">
          <div class="summary-stat-num" id="currentViewCount">0</div>
          <div class="summary-stat-label">လက်ရှိ Level အရေအတွက်</div>
        </div>
        <div style="width: 1px; height: 35px; background: rgba(255,255,255,0.3);"></div>
        <div class="summary-stat-box">
          <div class="summary-stat-num">A1 → C2</div>
          <div class="summary-stat-label">Native အဆင့်ထိ</div>
        </div>
      </div>

      <div class="cefr-tabs">
        <button class="cefr-tab-btn active" onclick="filterLevel('ALL', this)" id="tabALL">အားလုံး</button>
        <button class="cefr-tab-btn" onclick="filterLevel('A1', this)" id="tabA1">A1</button>
        <button class="cefr-tab-btn" onclick="filterLevel('A2', this)" id="tabA2">A2</button>
        <button class="cefr-tab-btn" onclick="filterLevel('B1', this)" id="tabB1">B1</button>
        <button class="cefr-tab-btn" onclick="filterLevel('B2', this)" id="tabB2">B2</button>
        <button class="cefr-tab-btn" onclick="filterLevel('C1', this)" id="tabC1">C1</button>
        <button class="cefr-tab-btn" onclick="filterLevel('C2', this)" id="tabC2">C2</button>
      </div>

      <div id="chapterContainer" style="width: 100%; max-width: 480px;"></div>
    </div>

    <div id="gameScreen" class="game-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <button class="speaker-btn" onclick="speakCurrent()">🔊 အသံနားထောင်မည်</button>
      <div class="prompt-box" id="promptText">-</div>
      
      <div id="sentenceBuilderArea" style="display: none;">
        <div class="answer-slot" id="answerSlot"></div>
        <div class="word-pool" id="wordPool"></div>
      </div>
      <div id="multipleChoiceArea" style="display: none; width: 100%;"></div>
    </div>
  </main>

  <div class="bottom-bar" id="bottomBar" style="display: none;">
    <button class="btn-action" id="checkBtn" onclick="checkAnswer()">စစ်ဆေးမည် (CHECK)</button>
  </div>

  <div class="feedback-sheet" id="feedbackSheet">
    <div style="font-size: 18px; font-weight: bold;" id="feedbackTitle">အဖြေမှန်ပါတယ်!</div>
    <div id="feedbackDetail" style="font-size: 13px;"></div>
    <button class="btn-action" onclick="nextQuestion()">ဆက်သွားမည် ➡</button>
  </div>

  <script>
    const fullCurriculum = {
      // 1. English (🇬🇧)
      en: {
        voice: 'en-US',
        chapters: [
          { level: 'A1', title: 'Chapter 1: နှုတ်ဆက်ခြင်းနှင့် မိတ်ဆက်ခြင်း', desc: 'Greetings & Introductions', q: [
            { type: 'choice', prompt: "'မင်္ဂလာပါ' ၏ အင်္ဂလိပ်စာကို ရွေးပါ", audio: "Hello", choices: ["Hello", "Goodbye", "Thanks"], correct: "Hello" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'ကျွန်တော့်နာမည် ဂျွန်ပါ'", audio: "My name is John", words: ["is", "My", "name", "John"], correct: ["My", "name", "is", "John"] },
            { type: 'choice', prompt: "'တွေ့ရတာ ဝမ်းသာပါတယ်' ကို ရွေးပါ", audio: "Nice to meet you", choices: ["Nice to meet you", "See you later", "I am fine"], correct: "Nice to meet you" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'မင်္ဂလာနံနက်ခင်းပါ'", audio: "Good morning to you", words: ["morning", "Good", "to", "you"], correct: ["Good", "morning", "to", "you"] }
          ]},
          { level: 'A1', title: 'Chapter 2: စားသောက်ဆိုင်နှင့် ဈေးဝယ်ခြင်း', desc: 'Food & Shopping', q: [
            { type: 'choice', prompt: "'ဒါ ဘယ်လောက်ကျလဲ?' ကို ရွေးပါ", audio: "How much is this?", choices: ["How much is this?", "Where is it?", "What is this?"], correct: "How much is this?" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'ရေတစ်ခွက် ပေးပါ'", audio: "A glass of water please", words: ["glass", "A", "of", "water", "please"], correct: ["A", "glass", "of", "water", "please"] },
            { type: 'choice', prompt: "'အရမ်း အရသာရှိတယ်' ကို ရွေးပါ", audio: "It is very delicious", choices: ["It is very delicious", "It is expensive", "I am hungry"], correct: "It is very delicious" }
          ]},
          { level: 'A2', title: 'Chapter 1: လမ်းမေးခြင်းနှင့် ခရီးသွားခြင်း', desc: 'Directions & Places', q: [
            { type: 'choice', prompt: "'Turn left' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Turn left", choices: ["ဘယ်ဘက်သို့ ကွေ့ပါ", "ညာဘက်သို့ ကွေ့ပါ", "တည့်တည့်သွားပါ"], correct: "ဘယ်ဘက်သို့ ကွေ့ပါ" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'ဘူတာရုံက ဘယ်မှာလဲ'", audio: "Where is the station?", words: ["is", "Where", "the", "station?"], correct: ["Where", "is", "the", "station?"] }
          ]},
          { level: 'B1', title: 'Chapter 1: ရုံးတွင်း ဆက်သွယ်ရေးနှင့် အစည်းအဝေး', desc: 'Workplace & Meeting', q: [
            { type: 'choice', prompt: "'Deadline' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Deadline", choices: ["နောက်ဆုံးသတ်မှတ်ရက်", "လစာတိုးခြင်း", "အလုပ်ဆင်းချိန်"], correct: "နောက်ဆုံးသတ်မှတ်ရက်" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'မနက်ဖြန် အစည်းအဝေး ရှိသည်'", audio: "We have a meeting tomorrow", words: ["have", "We", "a", "meeting", "tomorrow"], correct: ["We", "have", "a", "meeting", "tomorrow"] }
          ]},
          { level: 'B2', title: 'Chapter 1: အလုပ်အင်တာဗျူးနှင့် ညှိနှိုင်းခြင်း', desc: 'Job Interview & Career', q: [
            { type: 'choice', prompt: "'Strengths and weaknesses' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Strengths and weaknesses", choices: ["အားသာချက်နှင့် အားနည်းချက်များ", "လစာနှင့် ခွင့်ရက်", "အတွေ့အကြုံ"], correct: "အားသာချက်နှင့် အားနည်းချက်များ" }
          ]},
          { level: 'C1', title: 'Chapter 1: စီမံခန့်ခွဲမှုနှင့် မဟာဗျူဟာ', desc: 'Strategic Management', q: [
            { type: 'choice', prompt: "'Feasibility study' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Feasibility study", choices: ["ဖြစ်မြောက်နိုင်စွမ်း ဆန်းစစ်ချက်", "ငွေစာရင်းရှင်းတမ်း", "ဈေးကွက်လေ့လာမှု"], correct: "ဖြစ်မြောက်နိုင်စွမ်း ဆန်းစစ်ချက်" }
          ]},
          { level: 'C2', title: 'Chapter 1: Native Idioms & Slang', desc: 'Idioms & Fluency', q: [
            { type: 'choice', prompt: "'Piece of cake' ၏ သဘောကို ရွေးပါ", audio: "Piece of cake", choices: ["အရမ်းလွယ်ကူသော အရာ", "ကိတ်မုန့်တစ်တုံး", "အရသာရှိသောအရာ"], correct: "အရမ်းလွယ်ကူသော အရာ" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'Under the weather (နေမကောင်းဖြစ်သည်)'", audio: "I feel under the weather", words: ["under", "I", "weather", "feel", "the"], correct: ["I", "feel", "under", "the", "weather"] }
          ]}
        ]
      },

      // 2. Thai (🇹🇭)
      th: {
        voice: 'th-TH',
        chapters: [
          { level: 'A1', title: 'Chapter 1: နှုတ်ဆက်ခြင်းနှင့် မိတ်ဆက်ခြင်း', desc: 'Basic Greetings', q: [
            { type: 'choice', prompt: "'မင်္ဂလာပါ' ၏ ထိုင်းစကားကို ရွေးပါ", audio: "สวัสดี", choices: ["สวัสดี (Sawasdee)", "ขอบคุณ (Khob khun)", "อร่อย"], correct: "สวัสดี (Sawasdee)" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'မင်္ဂလာပါခင်ဗျာ'", audio: "สวัสดีครับ", words: ["ครับ", "สวัสดี", "ขอบคุณ"], correct: ["สวัสดี", "ครับ"] },
            { type: 'choice', prompt: "'ကျေးဇူးတင်ပါတယ်' ၏ ထိုင်းစကားကို ရွေးပါ", audio: "ขอบคุณมาก", choices: ["ขอบคุณมาก", "ไม่เป็นไร", "ขอโทษ"], correct: "ขอบคุณมาก" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'နေကောင်းလားခင်ဗျာ'", audio: "สบายดีไหมครับ", words: ["สบายดี", "ไหม", "ครับ"], correct: ["สบายดี", "ไหม", "ครับ"] }
          ]},
          { level: 'A1', title: 'Chapter 2: ဈေးဝယ်ခြင်းနှင့် စားသောက်ဆိုင်', desc: 'Shopping & Dining', q: [
            { type: 'choice', prompt: "'ဒါ ဘယ်လောက်လဲ' ကို ရွေးပါ", audio: "อันนี้เท่าไหร่", choices: ["อันนี้เท่าไหร่", "ลดได้ไหม", "แพงมาก"], correct: "อันนี้เท่าไหร่" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'ဈေးလျှော့ပေးလို့ရမလား'", audio: "ลดหน่อยได้ไหมครับ", words: ["ลดหน่อย", "ได้ไหม", "ครับ"], correct: ["ลดหน่อย", "ได้ไหม", "ครับ"] }
          ]},
          { level: 'A2', title: 'Chapter 1: လမ်းမေးခြင်းနှင့် အိမ်သာ', desc: 'Directions & Restroom', q: [
            { type: 'choice', prompt: "'အိမ်သာ ဘယ်မှာလဲ' ကို ရွေးပါ", audio: "ห้องน้ำอยู่ที่ไหน", choices: ["ห้องน้ำอยู่ที่ไหน", "ไปไหน", "ช่วยด้วย"], correct: "ห้องน้ำอยู่ที่ไหน" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'ဘယ်ဘက်သို့ ကွေ့ပါ'", audio: "เลี้ยวซ้ายครับ", words: ["เลี้ยวซ้าย", "ครับ", "ตรงไป"], correct: ["เลี้ยวซ้าย", "ครับ"] }
          ]},
          { level: 'B1', title: 'Chapter 1: လုပ်ငန်းခွင်နှင့် OT', desc: 'Workplace & Overtime', q: [
            { type: 'choice', prompt: "'အစည်းအဝေး' ၏ ထိုင်းစကားကို ရွေးပါ", audio: "การประชุม", choices: ["การประชุม (Pra-chum)", "เงินเดือน", "ลาพักร้อน"], correct: "การประชุม (Pra-chum)" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'ဒီနေ့ အချိန်ပို(OT) ဆင်းမည်'", audio: "วันนี้ทำโอที", words: ["ทำโอที", "วันนี้", "ครับ"], correct: ["วันนี้", "ทำโอที"] }

      ja: {

            { type: 'build', prompt: "ဝါကျစီပါ: 'ကျေးဇူးအများကြီးတင်ပါတယ်'", audio: "ありがとうございます", words: ["ございます", "ありがとう", "すみません"], correct: ["ありがとう", "ございます"] },

          { level: 'C1', title: 'Chapter 1: 契約と交渉 (စာချုပ်)', desc: 'Contracts & Negotiation', q: [

          ]},
          { level: 'C2', title: 'Chapter 1: 日本の慣用句 (Native Slang)', desc: 'Native Japanese Idioms', q: [
            { type: 'choice', prompt: "'猫の手も借りたい' ၏ သဘောကို ရွေးပါ", audio: "猫の手も借りたい", choices: ["အလွန်အမင်း အလုပ်များနေသည်", "ကြောင်မွေးချင်သည်", "ကြောင်ကို ကူညီသည်"], correct: "အလွန်အမင်း အလုပ်များနေသည်" },
            { type: 'build', prompt: "ဝါကျစီပါ: '油を売る (အလုပ်မလုပ်ဘဲ အချိန်ဖြုန်းသည်)'", audio: "油を売る", words: ["売る", "油を", "買う"], correct: ["油を", "売る"] }
          ]}
        ]
      },

      // 8. Italian (🇮🇹)
      it: {
        voice: 'it-IT',
        chapters: [
          { level: 'A1', title: 'Chapter 1: Saluti (နှုတ်ဆက်ခြင်း)', desc: 'Basic Italian Greetings', q: [
            { type: 'choice', prompt: "'မင်္ဂလာပါ' ၏ အီတလီစကားကို ရွေးပါ", audio: "Ciao", choices: ["Ciao", "Grazie", "Prego"], correct: "Ciao" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'ကျေးဇူးအများကြီးတင်ပါတယ်'", audio: "Grazie mille", words: ["mille", "Grazie", "Per favore"], correct: ["Grazie", "mille"] },
            { type: 'choice', prompt: "'Come stai?' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Come stai?", choices: ["နေကောင်းလား?", "ဘယ်သွားမလို့လဲ?", "နာမည်ဘယ်လိုခေါ်လဲ?"], correct: "နေကောင်းလား?" }
          ]},
          { level: 'A1', title: 'Chapter 2: Al Ristorante (စားသောက်ဆိုင်)', desc: 'Dining & Food', q: [
            { type: 'choice', prompt: "'Quanto costa?' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Quanto costa?", choices: ["ဘယ်လောက်ကျလဲ?", "ဘယ်သွားမလဲ?", "အိမ်သာဘယ်မှာလဲ?"], correct: "ဘယ်လောက်ကျလဲ?" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'ဘေလ်ရှင်းပေးပါ'", audio: "Il conto per favore", words: ["conto", "Il", "per", "favore"], correct: ["Il", "conto", "per", "favore"] }
          ]},
          { level: 'A2', title: 'Chapter 1: Chiedere la strada (လမ်းမေးခြင်း)', desc: 'Directions', q: [
            { type: 'choice', prompt: "'Dov\\'è il bagno?' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Dov'è il bagno?", choices: ["အိမ်သာ ဘယ်မှာလဲ?", "ဘူတာ ဘယ်မှာလဲ?", "ဟိုတယ် ဘယ်မှာလဲ?"], correct: "အိမ်သာ ဘယ်မှာလဲ?" }
          ]},
          { level: 'B1', title: 'Chapter 1: Lavoro e Ufficio (လုပ်ငန်းခွင်)', desc: 'Workplace', q: [
            { type: 'choice', prompt: "'La riunione' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "La riunione", choices: ["အစည်းအဝေး", "စာချုပ်", "လစာ"], correct: "အစည်းအဝေး" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'အချိန်ပိုဆင်းခြင်း (OT)'", audio: "Fare gli straordinari", words: ["straordinari", "Fare", "gli"], correct: ["Fare", "gli", "straordinari"] }
          ]},
          { level: 'B2', title: 'Chapter 1: Colloquio di lavoro', desc: 'Job Interview', q: [
            { type: 'choice', prompt: "'Lo stipendio' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Lo stipendio", choices: ["လစာ", "အလုပ်ချိန်", "အတွေ့အကြုံ"], correct: "လစာ" }
          ]},
          { level: 'C1', title: 'Chapter 1: Negoziazione e Contratti', desc: 'Contracts', q: [
            { type: 'choice', prompt: "'Il contratto di lavoro' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Il contratto di lavoro", choices: ["အလုပ်ခန့်ထားမှု စာချုပ်", "အစီရင်ခံစာ", "ငွေတောင်းခံလွှာ"], correct: "အလုပ်ခန့်ထားမှု စာချုပ်" }
          ]},
          { level: 'C2', title: 'Chapter 1: Modi di dire Italiani', desc: 'Native Italian Idioms', q: [
            { type: 'choice', prompt: "'In bocca al lupo' ၏ သဘောကို ရွေးပါ", audio: "In bocca al lupo", choices: ["ကံကောင်းပါစေ (Good luck)", "ဝံပုလွေလိုက်နေသည်", "သတိထားပါ"], correct: "ကံကောင်းပါစေ (Good luck)" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'Cheaters/Fake: Far vedere i sorci verdi'", audio: "Far vedere i sorci verdi", words: ["vedere", "Far", "i", "sorci", "verdi"], correct: ["Far", "vedere", "i", "sorci", "verdi"] }
          ]}
        ]
      }
    };

    let curLang = 'en';
    let curLevelFilter = 'ALL';
    let xp = parseInt(localStorage.getItem('lingo_xp')) || 0;
    let activeChapter = null;
    let curQIndex = 0;
    let userSelectedChoice = '';
    let userBuiltSentence = [];

    document.getElementById('xpCount').innerText = xp;

    function updateTabCounts() {
      const all = fullCurriculum[curLang].chapters;
      document.getElementById('totalChapterCount').innerText = all.length;
      document.getElementById('tabALL').innerText = `အားလုံး (${all.length})`;

      ['A1', 'A2', 'B1', 'B2', 'C1', 'C2'].forEach(lvl => {
        const count = all.filter(c => c.level === lvl).length;
        const tab = document.getElementById(`tab${lvl}`);
        if (tab) tab.innerText = `${lvl} (${count})`;
      });
    }

    function renderChapters() {
      updateTabCounts();
      const container = document.getElementById('chapterContainer');
      container.innerHTML = '';
      const list = fullCurriculum[curLang].chapters;

      const filtered = (curLevelFilter === 'ALL') ? list : list.filter(c => c.level === curLevelFilter);
      document.getElementById('currentViewCount').innerText = `${filtered.length} ခု`;

      filtered.forEach((ch, index) => {
        container.innerHTML += `
          <div class="chapter-card" onclick="startChapter(${index})">
            <div>
              <span class="chapter-badge badge-${ch.level.toLowerCase()}">${ch.level}</span>
              <div style="font-weight: bold; font-size: 15px; color: var(--text);">${ch.title}</div>
              <div style="font-size: 12px; color: #777; margin-top: 2px;">${ch.desc} (${ch.q.length} Questions)</div>
            </div>
            <div style="font-size: 20px; color: var(--blue);">➔</div>
          </div>
        `;
      });
    }

    function filterLevel(lvl, btn) {
      curLevelFilter = lvl;
      document.querySelectorAll('.cefr-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderChapters();
    }

    function changeLanguage() {
      curLang = document.getElementById('langPicker').value;
      curLevelFilter = 'ALL';
      document.querySelectorAll('.cefr-tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tabALL').classList.add('active');
      renderChapters();
    }

    function speakText(text) {
      if ('speechSynthesis' in window && text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text.replace(/\(.*\)/, '').trim());
        utter.lang = fullCurriculum[curLang].voice;
        window.speechSynthesis.speak(utter);
      }
    }

    function startChapter(idx) {
      const list = (curLevelFilter === 'ALL') ? fullCurriculum[curLang].chapters : fullCurriculum[curLang].chapters.filter(c => c.level === curLevelFilter);
      activeChapter = list[idx];
      curQIndex = 0;

      document.getElementById('curriculumView').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'flex';
      document.getElementById('bottomBar').style.display = 'flex';

      loadQuestion();
    }

    function loadQuestion() {
      const q = activeChapter.q[curQIndex];
      const totalQ = activeChapter.q.length;
      document.getElementById('progressFill').style.width = `${(curQIndex / totalQ) * 100}%`;
      document.getElementById('promptText').innerText = q.prompt;
      userSelectedChoice = '';
      userBuiltSentence = [];

      if (q.audio) speakText(q.audio);

      if (q.type === 'choice') {
        document.getElementById('sentenceBuilderArea').style.display = 'none';
        const choiceArea = document.getElementById('multipleChoiceArea');
        choiceArea.style.display = 'block';
        choiceArea.innerHTML = '';

        q.choices.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.innerText = c;
          btn.onclick = () => {
            document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            userSelectedChoice = c;
            speakText(c);
          };
          choiceArea.appendChild(btn);
        });
      } else if (q.type === 'build') {
        document.getElementById('multipleChoiceArea').style.display = 'none';
        document.getElementById('sentenceBuilderArea').style.display = 'block';
        
        const slot = document.getElementById('answerSlot');
        const pool = document.getElementById('wordPool');
        slot.innerHTML = '';
        pool.innerHTML = '';

        q.words.forEach(w => {
          const bubble = document.createElement('div');
          bubble.className = 'word-bubble';
          bubble.innerText = w;
          bubble.onclick = () => {
            if (!bubble.classList.contains('used')) {
              bubble.classList.add('used');
              userBuiltSentence.push(w);
              speakText(w);

              const slotWord = document.createElement('div');
              slotWord.className = 'word-bubble';
              slotWord.innerText = w;
              slotWord.onclick = () => {
                slot.removeChild(slotWord);
                bubble.classList.remove('used');
                userBuiltSentence = userBuiltSentence.filter(item => item !== w);
              };
              slot.appendChild(slotWord);
            }
          };
          pool.appendChild(bubble);
        });
      }
    }

    function speakCurrent() {
      const q = activeChapter.q[curQIndex];
      if (q.audio) speakText(q.audio);
    }

    function checkAnswer() {
      const q = activeChapter.q[curQIndex];
      let isCorrect = false;

      if (q.type === 'choice') {
        if (!userSelectedChoice) return alert('အဖြေတစ်ခုကို အရင်ရွေးချယ်ပါ!');
        isCorrect = (userSelectedChoice === q.correct);
      } else if (q.type === 'build') {
        if (userBuiltSentence.length === 0) return alert('စကားလုံးများကို စီပေးပါ!');
        isCorrect = JSON.stringify(userBuiltSentence) === JSON.stringify(q.correct);
      }

      const sheet = document.getElementById('feedbackSheet');
      const title = document.getElementById('feedbackTitle');
      const detail = document.getElementById('feedbackDetail');

      sheet.style.display = 'flex';

      if (isCorrect) {
        sheet.className = 'feedback-sheet correct';
        title.innerText = '🎉 အဖြေမှန်ပါတယ်!';
        detail.innerText = '';
        xp += 15;
        localStorage.setItem('lingo_xp', xp);
        document.getElementById('xpCount').innerText = xp;
      } else {
        sheet.className = 'feedback-sheet wrong';
        title.innerText = '❌ မှားသွားပါတယ် (ထပ်မံကြိုးစားပါ)';
        detail.innerText = `မှန်ကန်သော အဖြေ: ${Array.isArray(q.correct) ? q.correct.join(' ') : q.correct}`;
      }
    }

    function nextQuestion() {
      document.getElementById('feedbackSheet').style.display = 'none';
      if (curQIndex < activeChapter.q.length - 1) {
        curQIndex++;
        loadQuestion();
      } else {
        alert('🏆 ဂုဏ်ယူပါတယ်! ဤ Chapter ကို အောင်မြင်စွာ ပြီးဆုံးပါပြီ။ (+25 Bonus XP)');
        xp += 25;
        localStorage.setItem('lingo_xp', xp);
        document.getElementById('xpCount').innerText = xp;
        backToCurriculum();
      }
    }

    function backToCurriculum() {
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('bottomBar').style.display = 'none';
      document.getElementById('curriculumView').style.display = 'flex';
      renderChapters();
    }

    renderChapters();
  </script>

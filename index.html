<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Free Language Hub</title>
  <style>
    :root {
      --primary: #00897b;
      --primary-dark: #004d40;
      --accent: #ff6f00;
      --bg: #f4f7f6;
      --card: #ffffff;
      --text: #212121;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: var(--primary);
      color: white;
      padding: 14px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }
    .lang-selector-bar {
      display: flex;
      background: white;
      padding: 10px 16px;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
    }
    .lang-selector-bar select {
      flex: 1;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--primary);
      font-size: 14px;
      outline: none;
      background: #fdfdfd;
      font-weight: bold;
      color: var(--primary-dark);
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 75px;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .input-box {
      width: 100%;
      height: 70px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      resize: none;
      outline: none;
    }
    .btn-main {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
    }
    .btn-speak {
      background: #e0f2f1;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      background: #e0f2f1;
      color: #00796b;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      font-weight: bold;
    }
    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      border-top: 1px solid #ddd;
      height: 55px;
    }
    .nav button {
      flex: 1;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: bold;
      color: #777;
      cursor: pointer;
    }
    .nav button.active {
      color: var(--primary);
      border-top: 3px solid var(--primary);
    }
    .quiz-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .quiz-option {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
      background: white;
      font-size: 15px;
      cursor: pointer;
    }
    .quiz-option.correct { background: #c8e6c9; border-color: #4caf50; }
    .quiz-option.wrong { background: #ffcdd2; border-color: #f44336; }
  </style>
</head>
<body>

  <header id="appTitle">Global Free Language Hub</header>

  <!-- Global Language Selector -->
  <div class="lang-selector-bar">
    <span style="font-size: 13px; font-weight: bold; color: #555;">လေ့လာမည့် ဘာသာ:</span>
    <select id="targetLangSelect" onchange="onLanguageChange()">
      <option value="en" data-voice="en-US">🇬🇧 English (အင်္ဂလိပ်)</option>
      <option value="th" data-voice="th-TH">🇹🇭 ไทย (ထိုင်း)</option>
      <option value="ja" data-voice="ja-JP">🇯🇵 日本語 (ဂျပန်)</option>
      <option value="ko" data-voice="ko-KR">🇰🇷 한국어 (ကိုရီးယား)</option>
      <option value="zh-CN" data-voice="zh-CN">🇨🇳 中文 (တရုတ်)</option>
      <option value="de" data-voice="de-DE">🇩🇪 Deutsch (ဂျာမန်)</option>
      <option value="fr" data-voice="fr-FR">🇫🇷 Français (ပြင်သစ်)</option>
      <option value="es" data-voice="es-ES">🇪🇸 Español (စပိန်)</option>
      <option value="ru" data-voice="ru-RU">🇷🇺 Русский (ရုရှား)</option>
      <option value="ar" data-voice="ar-SA">🇸🇦 العربية (အာရဗီ)</option>
    </select>
  </div>

  <!-- TAB 1: စကားလုံးများ လေ့လာရန် -->
  <main id="tabLearn">
    <!-- Google AI Instant Dictionary Search -->
    <div class="card">
      <div style="font-weight: bold; margin-bottom: 6px; font-size: 14px; color: var(--primary);">🔍 Google ဖြင့် စကားလုံး/ဝါကျ အသစ်လေ့လာရန်</div>
      <textarea id="searchWordInput" class="input-box" placeholder="မြန်မာလို (သို့) လေ့လာလိုသည့် ဘာသာစကားဖြင့် ရိုက်ထည့်ပါ..."></textarea>
      <button class="btn-main" onclick="searchGoogleWord()">ရှာဖွေပြီး လေ့လာမှုစာရင်းထဲ ထည့်မည်</button>
      <div id="searchResult" style="display:none; margin-top:12px; padding:10px; background:#e8f5e9; border-radius:8px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div id="resTarget" style="font-size:18px; font-weight:bold; color:var(--primary-dark);">-</div>
            <div id="resMeaning" style="font-size:14px; color:#333; margin-top:3px;">-</div>
          </div>
          <button class="btn-speak" onclick="speakText(currentSearchResult, currentVoice)">🔊</button>
        </div>
      </div>
    </div>

    <div style="font-weight: bold; margin: 16px 0 8px 0; color: #555; font-size: 14px;">📖 လေ့လာရန် မရှိမဖြစ် စကားလုံးများ</div>
    <div id="vocabList"></div>
  </main>

  <!-- TAB 2: Quiz လေ့ကျင့်ရန် -->
  <main id="tabQuiz" style="display: none;">
    <div class="quiz-card">
      <span class="badge" id="quizBadge">Quiz Time</span>
      <h2 id="quizQuestion" style="color: var(--primary); margin: 12px 0 6px 0;">-</h2>
      <button class="btn-speak" style="margin: 0 auto 14px auto;" onclick="speakText(currentQuizWord, currentVoice)">🔊</button>
      <p style="color: #666; font-size: 14px; margin-bottom: 16px;">မှန်ကန်သော မြန်မာအဓိပ္ပာယ်ကို ရွေးချယ်ပါ</p>
      <div id="quizOptions"></div>
      <button id="btnNextQuiz" class="btn-main" style="display:none; margin-top:16px;" onclick="loadNextQuiz()">နောက်တစ်ခု ➡</button>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <div class="nav">
    <button id="navLearn" class="active" onclick="switchTab('learn')">📚 လေ့လာရန်</button>
    <button id="navQuiz" onclick="switchTab('quiz')">🎯 လေ့ကျင့်ရန် (Quiz)</button>
  </div>

  <script>
    // Essential starter databases for instant offline learning
    const starterPacks = {
      en: [
        { word: "Hello", meaning: "မင်္ဂလာပါ", cat: "နှုတ်ဆက်ခြင်း" },
        { word: "Thank you", meaning: "ကျေးဇူးတင်ပါတယ်", cat: "ယဉ်ကျေးမှု" },
        { word: "How much is this?", meaning: "ဒါ ဘယ်လောက်ကျပါသလဲ", cat: "ဈေးဝယ်" },
        { word: "Where is the station?", meaning: "ဘူတာ ဘယ်မှာလဲ", cat: "ခရီးသွား" },
        { word: "Excuse me", meaning: "တစ်ဆိတ်လောက်", cat: "နေ့စဉ်သုံး" },
        { word: "Delicious", meaning: "အရသာရှိသော", cat: "စားသောက်" }
      ],
      th: [
        { word: "สวัสดี (Sawasdee)", meaning: "မင်္ဂလာပါ", cat: "နှုတ်ဆက်ခြင်း" },
        { word: "ขอบคุณ (Khob khun)", meaning: "ကျေးဇူးတင်ပါတယ်", cat: "ယဉ်ကျေးမှု" },
        { word: "เท่าไหร่ (Thao rai)", meaning: "ဘယ်လောက်ကျလဲ", cat: "ဈေးဝယ်" },
        { word: "ห้องน้ำอยู่ที่ไหน", meaning: "အိမ်သာ ဘယ်မှာလဲ", cat: "ခရီးသွား" },
        { word: "อร่อยมาก (Aroi mak)", meaning: "အရမ်းစားကောင်းတယ်", cat: "စားသောက်" },
        { word: "ช่วยด้วย (Chuay duay)", meaning: "ကူညီပါဦး / ကယ်ပါ", cat: "အရေးပေါ်" }
      ],
      ja: [
        { word: "こんにちは (Konnichiwa)", meaning: "မင်္ဂလာပါ", cat: "နှုတ်ဆက်ခြင်း" },
        { word: "ありがとう (Arigatou)", meaning: "ကျေးဇူးတင်ပါတယ်", cat: "ယဉ်ကျေးမှု" },
        { word: "いくらですか (Ikura desu ka)", meaning: "ဘယ်လောက်ကျပါသလဲ", cat: "ဈေးဝယ်" },
        { word: "すみません (Sumimasen)", meaning: "တစ်ဆိတ်လောက် / တောင်းပန်ပါတယ်", cat: "နေ့စဉ်သုံး" },
        { word: "おいしい (Oishii)", meaning: "အရသာရှိသော", cat: "စားသောက်" },
        { word: "たすけて (Tasukete)", meaning: "ကယ်ပါ / ကူညီပါဦး", cat: "အရေးပေါ်" }
      ],
      ko: [
        { word: "안녕하세요 (Annyeonghaseyo)", meaning: "မင်္ဂလာပါ", cat: "နှုတ်ဆက်ခြင်း" },
        { word: "감사합니다 (Gamsahamnida)", meaning: "ကျေးဇူးတင်ပါတယ်", cat: "ယဉ်ကျေးမှု" },
        { word: "얼마예요? (Eolmayeyo?)", meaning: "ဘယ်လောက်လဲ", cat: "ဈေးဝယ်" },
        { word: "맛있어요 (Masisseoyo)", meaning: "အရသာရှိတယ်", cat: "စားသောက်" },
        { word: "화장실 어디예요?", meaning: "အိမ်သာ ဘယ်မှာလဲ", cat: "ခရီးသွား" }
      ],
      zh: [
        { word: "你好 (Nǐ hǎo)", meaning: "မင်္ဂလာပါ", cat: "နှုတ်ဆက်ခြင်း" },
        { word: "谢谢 (Xièxiè)", meaning: "ကျေးဇူးတင်ပါတယ်", cat: "ယဉ်ကျေးမှု" },
        { word: "多少钱？(Duōshǎo qián?)", meaning: "ဘယ်လောက်ကျပါသလဲ", cat: "ဈေးဝယ်" },
        { word: "好吃 (Hào chī)", meaning: "စားကောင်းတယ် / အရသာရှိတယ်", cat: "စားသောက်" },
        { word: "厕所在哪里？", meaning: "အိမ်သာ ဘယ်မှာလဲ", cat: "ခရီးသွား" }
      ]
    };

    let currentLang = 'en';
    let currentVoice = 'en-US';
    let currentSearchResult = '';
    let currentQuizWord = '';
    let currentQuizIndex = 0;
    let quizList = [];

    function onLanguageChange() {
      const select = document.getElementById('targetLangSelect');
      currentLang = select.value;
      currentVoice = select.options[select.selectedIndex].getAttribute('data-voice');
      document.getElementById('searchResult').style.display = 'none';
      renderVocabList();
    }

    function speakText(text, voice) {
      if ('speechSynthesis' in window && text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text.split('(')[0]);
        utter.lang = voice || currentVoice;
        window.speechSynthesis.speak(utter);
      }
    }

    function getStorageKey() {
      return `custom_vocab_${currentLang}`;
    }

    function getCombinedWords() {
      const base = starterPacks[currentLang] || [
        { word: "Hello", meaning: "မင်္ဂလာပါ", cat: "အခြေခံ" },
        { word: "Thank you", meaning: "ကျေးဇူးတင်ပါတယ်", cat: "အခြေခံ" }
      ];
      const custom = JSON.parse(localStorage.getItem(getStorageKey())) || [];
      return [...custom, ...base];
    }

    function renderVocabList() {
      const list = getCombinedWords();
      const container = document.getElementById('vocabList');
      container.innerHTML = '';

      list.forEach((item, index) => {
        container.innerHTML += `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <span class="badge">${item.cat || 'လေ့လာထားသောစကားလုံး'}</span>
                <div style="font-size:18px; font-weight:bold; color:var(--primary-dark);">${item.word}</div>
                <div style="font-size:14px; color:#444; margin-top:4px;">မြန်မာလို: ${item.meaning}</div>
              </div>
              <button class="btn-speak" onclick="speakText('${item.word.replace(/'/g, "\\'")}', '${currentVoice}')">🔊</button>
            </div>
          </div>
        `;
      });
    }

    async function searchGoogleWord() {
      const text = document.getElementById('searchWordInput').value.trim();
      if (!text) return alert('ကျေးဇူးပြု၍ စာရိုက်ထည့်ပါ');

      document.getElementById('searchResult').style.display = 'block';
      document.getElementById('resTarget').innerText = 'Google မှ ရှာဖွေနေပါသည်...';
      document.getElementById('resMeaning').innerText = '';

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${currentLang}&dt=t&q=${encodeURI(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        
        const translated = data[0].map(item => item[0]).join('');
        currentSearchResult = translated;

        document.getElementById('resTarget').innerText = translated;
        document.getElementById('resMeaning').innerText = `မြန်မာ: ${text}`;

        // Save into study list
        let custom = JSON.parse(localStorage.getItem(getStorageKey())) || [];
        custom.unshift({ word: translated, meaning: text, cat: "Google ရှာဖွေထားသည်" });
        localStorage.setItem(getStorageKey(), JSON.stringify(custom));

        renderVocabList();
        document.getElementById('searchWordInput').value = '';
      } catch (e) {
        document.getElementById('resTarget').innerText = 'ရှာမတွေ့ပါ သို့မဟုတ် အင်တာနက် လိုအပ်ပါသည်။';
      }
    }

    function switchTab(tab) {
      if (tab === 'learn') {
        document.getElementById('tabLearn').style.display = 'block';
        document.getElementById('tabQuiz').style.display = 'none';
        document.getElementById('navLearn').className = 'active';
        document.getElementById('navQuiz').className = '';
      } else {
        document.getElementById('tabLearn').style.display = 'none';
        document.getElementById('tabQuiz').style.display = 'block';
        document.getElementById('navLearn').className = '';
        document.getElementById('navQuiz').className = 'active';
        startQuiz();
      }
    }

    function startQuiz() {
      quizList = getCombinedWords();
      currentQuizIndex = 0;
      loadNextQuiz();
    }

    function loadNextQuiz() {
      if (quizList.length === 0) return;
      const current = quizList[currentQuizIndex % quizList.length];
      currentQuizWord = current.word;

      document.getElementById('quizQuestion').innerText = current.word;
      document.getElementById('btnNextQuiz').style.display = 'none';

      let options = [current.meaning];
      let others = quizList.filter(w => w.meaning !== current.meaning).map(w => w.meaning);
      others.sort(() => 0.5 - Math.random());
      options.push(...others.slice(0, 3));
      options.sort(() => 0.5 - Math.random());

      const container = document.getElementById('quizOptions');
      container.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('div');
        btn.className = 'quiz-option';
        btn.innerText = opt;
        btn.onclick = () => checkQuiz(btn, opt, current.meaning);
        container.appendChild(btn);
      });
    }

    function checkQuiz(element, selected, correct) {
      document.querySelectorAll('.quiz-option').forEach(b => b.onclick = null);
      if (selected === correct) {
        element.classList.add('correct');
      } else {
        element.classList.add('wrong');
        document.querySelectorAll('.quiz-option').forEach(b => {
          if (b.innerText === correct) b.classList.add('correct');
        });
      }
      currentQuizIndex++;
      document.getElementById('btnNextQuiz').style.display = 'block';
    }

    renderVocabList();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="my" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#4F46E5" />
  <title>LingoMaster Global — 8 Languages (A1–C2)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+KR:wght@500;700&family=Noto+Sans+Thai:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #4F46E5;
      --primary-hover: #4338CA;
      --primary-light: #EEF2FF;
      --success: #10B981;
      --success-light: #ECFDF5;
      --error: #EF4444;
      --error-light: #FEF2F2;
      --warning: #F59E0B;
      --bg-main: #F8FAFC;
      --bg-card: #FFFFFF;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --font-base: 'Plus Jakarta Sans', 'Noto Sans Thai', 'Noto Sans JP', 'Noto Sans KR', sans-serif;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg-main: #0B0F19;
      --bg-card: #151D2F;
      --text-main: #F9FAFB;
      --text-muted: #94A3B8;
      --border-color: #1F293D;
      --primary-light: #1E1B4B;
      --success-light: #064E3B;
      --error-light: #7F1D1D;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font-base); background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; line-height: 1.5; }

    .app-layout { display: flex; flex-direction: column; min-height: 100vh; }
    .app-header { position: sticky; top: 0; z-index: 40; display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.25rem; background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); }
    .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.25rem; color: var(--primary); }
    .user-stats-bar { display: flex; align-items: center; gap: 0.6rem; }
    .stat-pill { display: flex; align-items: center; gap: 0.35rem; background: var(--bg-main); padding: 0.35rem 0.65rem; border-radius: var(--radius-full); font-weight: 700; font-size: 0.85rem; border: 1px solid var(--border-color); }
    .icon-btn { background: transparent; border: none; font-size: 1.25rem; cursor: pointer; padding: 0.4rem; border-radius: 8px; }

    .main-content { flex: 1; padding: 1.25rem 1rem 5.5rem 1rem; max-width: 900px; width: 100%; margin: 0 auto; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 62px; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 50; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; gap: 0.2rem; height: 100%; cursor: pointer; transition: var(--transition); }
    .nav-item.active { color: var(--primary); }

    .card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 1.25rem; border: 1px solid var(--border-color); margin-bottom: 1rem; }
    .primary-btn { background: var(--primary); color: #fff; border: none; padding: 0.75rem 1.25rem; border-radius: var(--radius-md); font-weight: 700; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; transition: var(--transition); min-height: 46px; }
    .primary-btn:hover:not(:disabled) { background: var(--primary-hover); }
    .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-large { width: 100%; font-size: 1.1rem; padding: 0.85rem; }
    .secondary-btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.6rem 1rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; }

    .progress-bar-container { width: 100%; height: 8px; background: var(--border-color); border-radius: var(--radius-full); overflow: hidden; margin: 0.5rem 0; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #818CF8); border-radius: var(--radius-full); transition: width 0.4s ease; }

    .lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; margin-top: 0.75rem; }
    .lang-card { cursor: pointer; display: flex; flex-direction: column; gap: 0.5rem; }
    .lang-card.selected { border: 2px solid var(--primary); background: var(--primary-light); }

    .options-grid { display: grid; grid-template-columns: 1fr; gap: 0.6rem; }
    .option-btn { background: var(--bg-card); border: 2px solid var(--border-color); padding: 0.85rem; border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; text-align: left; cursor: pointer; color: var(--text-main); }
    .option-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }

    .word-bank, .sentence-construction-zone { display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.75rem; border-radius: var(--radius-md); min-height: 50px; align-items: center; }
    .sentence-construction-zone { background: var(--bg-main); border: 2px dashed var(--border-color); margin-bottom: 1.25rem; }
    .word-chip { padding: 0.5rem 0.85rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--text-main); }
    .word-chip.used { opacity: 0.3; pointer-events: none; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 100; display: flex; justify-content: center; align-items: center; }
    .modal-overlay.hidden { display: none; }
    .lesson-dialog { background: var(--bg-card); width: 100%; height: 100%; max-width: 680px; display: flex; flex-direction: column; }
    @media (min-width: 768px) { .lesson-dialog { height: 90vh; border-radius: var(--radius-lg); overflow: hidden; } }
    .lesson-header { display: flex; align-items: center; padding: 0.85rem 1.25rem; gap: 0.85rem; border-bottom: 1px solid var(--border-color); }
    .lesson-body { flex: 1; padding: 1.5rem 1.25rem; overflow-y: auto; }
    .feedback-banner { padding: 0.85rem 1.25rem; border-top: 1px solid var(--border-color); }
    .feedback-banner.correct { background: var(--success-light); color: #065F46; }
    .feedback-banner.incorrect { background: var(--error-light); color: #991B1B; }

    .audio-btn { background: var(--primary-light); border: none; color: var(--primary); width: 44px; height: 44px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; }
    .toast-container { position: fixed; bottom: 75px; right: 15px; z-index: 200; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: #1E293B; color: #fff; padding: 0.65rem 1.1rem; border-radius: var(--radius-md); font-weight: 600; }
  </style>
</head>
<body>
  <div id="app" class="app-layout">
    <header class="app-header">
      <div class="brand">
        <span>🌍</span><span>LingoMaster</span>
      </div>
      <div class="user-stats-bar">
        <div class="stat-pill" title="Global Streak">🔥 <span id="streakCount">0</span></div>
        <div class="stat-pill" title="Total XP">⭐ <span id="totalXpCount">0</span></div>
        <div class="stat-pill" title="Energy">❤️ ∞</div>
        <button id="themeToggleBtn" class="icon-btn">🌙</button>
      </div>
    </header>

    <main id="mainContainer" class="main-content" role="main"></main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home"><span>🏠</span><span>Home</span></button>
      <button class="nav-item" data-view="learn"><span>📚</span><span>Learn</span></button>
      <button class="nav-item" data-view="vocab"><span>📖</span><span>Vocab</span></button>
      <button class="nav-item" data-view="review"><span>🔄</span><span>Review</span></button>
      <button class="nav-item" data-view="progress"><span>📊</span><span>Progress</span></button>
      <button class="nav-item" data-view="settings"><span>⚙️</span><span>Settings</span></button>
    </nav>
  </div>

  <div id="lessonModal" class="modal-overlay hidden" role="dialog" aria-modal="true">

      <header class="lesson-header">
        <button id="closeLessonBtn" class="icon-btn">✕</button>
        <div class="progress-bar-container" style="flex:1;">
          <div id="lessonProgressBar" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
      </header>
      
      <div id="lessonContainer" class="lesson-body"></div>
      
      <footer class="lesson-footer">
        <div id="feedbackBanner" class="feedback-banner hidden">
          <div style="display:flex; align-items:flex-start; gap:0.6rem;">
            <span id="feedbackIcon" style="font-size:1.4rem;">✓</span>
            <div>
              <strong id="feedbackTitle">Correct!</strong>
              <p id="feedbackExplanation" style="font-size:0.85rem;"></p>
            </div>
          </div>
        </div>
        <div style="padding: 0.85rem 1.25rem;">
          <button id="lessonActionBtn" class="primary-btn btn-large" disabled>Check</button>
        </div>
      </footer>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

        A2: [{ title: "Ristorante", word: "Conto", meaning: "ဘေလ်ရှင်းတမ်း", ex: "Il conto, per favore.", exM: "ဘေလ်ရှင်းပေးပါ" }],
        B1: [{ title: "Ambiente", word: "Natura", meaning: "သဘာဝတရား", ex: "Amo la natura.", exM: "သဘာဝတရားကို ချစ်တယ်" }],
        B2: [{ title: "Cultura", word: "Patrimonio", meaning: "အမွေအနှစ်", ex: "Patrimonio culturale.", exM: "ယဉ်ကျေးမှု အမွေအနှစ်" }],
        C1: [{ title: "Accademico", word: "Concetto", meaning: "သဘောတရား", ex: "Un concetto chiaro.", exM: "ရှင်းလင်းသော သဘောတရား" }],
        C2: [{ title: "Modi di dire", word: "In bocca al lupo", meaning: "ကံကောင်းပါစေ", ex: "In bocca al lupo!", exM: "ကံကောင်းပါစေ" }]
      }
    };

    /* =========================================================
       2. PERSISTENCE STORAGE & SRS STATE
    ========================================================= */
    const STORAGE_KEY = 'lingomaster_global_state_v3';
    const DEFAULT_STATE = {
      activeLanguage: 'english',
      totalXP: 0,
      dailyXP: 0,
      dailyGoal: 50,
      streak: { current: 1, longest: 1, lastStudyDate: new Date().toISOString().slice(0, 10) },
      theme: 'light',
      achievements: [],
      srsItems: [],
      languages: {
        english: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        thai: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        french: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        german: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        korean: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        japanese: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        spanish: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        italian: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] }
      }
    };

    const StorageManager = {
      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return DEFAULT_STATE;
          const parsed = JSON.parse(raw);
          for (let l of Object.keys(DEFAULT_STATE.languages)) {
            if (!parsed.languages[l]) parsed.languages[l] = { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] };
          }
          return parsed;
        } catch (e) {
          return DEFAULT_STATE;
        }
      },
      save(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }
    };

    /* =========================================================
       3. AUDIO MANAGER (TTS & STT)
    ========================================================= */
    const AudioManager = {
      speak(text, langId) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = LANGUAGES[langId]?.locale || 'en-US';
        utter.rate = LANGUAGES[langId]?.rate || 0.95;
        window.speechSynthesis.speak(utter);
      },
      listen(langId, onResult, onError) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          if (onError) onError('Speech recognition not supported in this browser.');
          return;
        }
        const rec = new SpeechRec();
        rec.lang = LANGUAGES[langId]?.locale || 'en-US';
        rec.onresult = (e) => onResult(e.results[0][0].transcript);
        rec.onerror = (e) => onError(e.error);
        rec.start();
      }
    };

    /* =========================================================
       4. LESSON ENGINE (5 Exercise Types)
    ========================================================= */
    const LessonEngine = {
      lesson: null,
      langId: null,
      idx: 0,
      correctCount: 0,
      userAns: null,
      orderedWords: [],

      start(lessonData, langId) {
        this.lesson = lessonData;
        this.langId = langId;
        this.idx = 0;
        this.correctCount = 0;
        document.getElementById('lessonModal').classList.remove('hidden');
        this.renderStep();
      },

      renderStep() {
        const container = document.getElementById('lessonContainer');
        const progress = document.getElementById('lessonProgressBar');
        const actionBtn = document.getElementById('lessonActionBtn');
        const banner = document.getElementById('feedbackBanner');

        banner.className = 'feedback-banner hidden';
        actionBtn.disabled = true;
        actionBtn.textContent = 'Check';
        actionBtn.onclick = () => this.check();

        const total = this.lesson.exercises.length;
        progress.style.width = `${(this.idx / total) * 100}%`;

        if (this.idx >= total) {
          this.complete();
          return;
        }

        const ex = this.lesson.exercises[this.idx];
        this.userAns = null;
        this.orderedWords = [];

        let html = `<div style="text-align:center; margin-bottom:1.25rem;">
          <h3 style="font-size:1.25rem; font-weight:700;">${ex.prompt}</h3>
          ${ex.audioText ? `<button class="audio-btn" style="margin-top:0.75rem;" onclick="AudioManager.speak('${ex.audioText}', '${this.langId}')">🔊</button>` : ''}
        </div>`;

        if (ex.type === 'mcq' || ex.type === 'listen') {
          html += `<div class="options-grid">
            ${ex.options.map((opt, i) => `
              <button class="option-btn" onclick="LessonEngine.selectOpt(this, ${i})">${opt}</button>
            `).join('')}
          </div>`;
          if (ex.type === 'listen') setTimeout(() => AudioManager.speak(ex.audioText, this.langId), 200);
        } else if (ex.type === 'order') {
          html += `
            <div id="constructionZone" class="sentence-construction-zone"></div>
            <div id="wordBank" class="word-bank">
              ${ex.words.map(w => `<div class="word-chip" onclick="LessonEngine.pickWord(this, '${w}')">${w}</div>`).join('')}
            </div>
          `;
        } else if (ex.type === 'speak') {
          html += `
            <div style="text-align:center; padding:1rem 0;">
              <p style="font-size:1.6rem; font-weight:800; margin-bottom:1rem;">${ex.target}</p>
              <button id="micBtn" class="primary-btn" onclick="LessonEngine.record('${ex.target}')">🎤 Tap to Speak</button>
              <p id="micResult" style="margin-top:0.75rem; color:var(--text-muted); font-size:0.85rem;"></p>
            </div>
          `;
        } else if (ex.type === 'fill') {
          html += `
            <p style="font-size:1.3rem; text-align:center; margin:1rem 0;">${ex.sentence}</p>
            <div class="options-grid">
              ${ex.options.map((opt, i) => `<button class="option-btn" onclick="LessonEngine.selectOpt(this, '${opt}')">${opt}</button>`).join('')}
            </div>
          `;
        }

        container.innerHTML = html;
      },

      selectOpt(el, ans) {
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        this.userAns = ans;
        document.getElementById('lessonActionBtn').disabled = false;
      },

      pickWord(el, word) {
        const zone = document.getElementById('constructionZone');
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.textContent = word;
        chip.onclick = () => {
          chip.remove();
          el.classList.remove('used');
          this.orderedWords = this.orderedWords.filter(w => w !== word);
          document.getElementById('lessonActionBtn').disabled = this.orderedWords.length === 0;
        };
        zone.appendChild(chip);
        el.classList.add('used');
        this.orderedWords.push(word);
        document.getElementById('lessonActionBtn').disabled = false;
      },

      record(target) {
        const mic = document.getElementById('micBtn');
        const res = document.getElementById('micResult');
        mic.textContent = 'Listening...';
        AudioManager.listen(this.langId, (spoken) => {
          mic.textContent = '🎤 Tap to Speak';
          res.textContent = `Heard: "${spoken}"`;
          this.userAns = spoken;
          document.getElementById('lessonActionBtn').disabled = false;
        }, (err) => {
          mic.textContent = '🎤 Tap to Speak';
          res.textContent = `Microphone skipped: ${err}`;
          this.userAns = target; // fallback to prevent blocking
          document.getElementById('lessonActionBtn').disabled = false;
        });
      },

      check() {
        const ex = this.lesson.exercises[this.idx];
        let correct = false;

        if (ex.type === 'mcq' || ex.type === 'listen') correct = (this.userAns === ex.correct);
        else if (ex.type === 'order') correct = (JSON.stringify(this.orderedWords) === JSON.stringify(ex.correct));
        else if (ex.type === 'fill') correct = (this.userAns === ex.correct);
        else if (ex.type === 'speak') correct = true;

        if (correct) this.correctCount++;

        const banner = document.getElementById('feedbackBanner');
        const title = document.getElementById('feedbackTitle');
        const exp = document.getElementById('feedbackExplanation');
        const btn = document.getElementById('lessonActionBtn');

        banner.className = `feedback-banner ${correct ? 'correct' : 'incorrect'}`;
        title.textContent = correct ? 'Correct! +10 XP' : 'Incorrect!';
        exp.textContent = ex.explanation || (correct ? 'Well done!' : 'Keep practicing.');

        btn.textContent = 'Continue';
        btn.onclick = () => {
          this.idx++;
          this.renderStep();
        };
      },

      complete() {
        const container = document.getElementById('lessonContainer');
        const btn = document.getElementById('lessonActionBtn');
        const xp = 20;

        App.state.totalXP += xp;
        App.state.dailyXP += xp;
        App.state.languages[this.langId].xp += xp;

        if (!App.state.languages[this.langId].completedLessons.includes(this.lesson.id)) {
          App.state.languages[this.langId].completedLessons.push(this.lesson.id);
        }

        // Add vocabulary to vocabulary bank
        if (this.lesson.vocab) {
          const bank = App.state.languages[this.langId].vocabulary;
          if (!bank.find(v => v.word === this.lesson.vocab.word)) {
            bank.push({ ...this.lesson.vocab, langId: this.langId });
          }
        }

        StorageManager.save(App.state);
        App.updateHeader();

        container.innerHTML = `
          <div style="text-align:center; padding:2rem 0;">
            <span style="font-size:3.5rem;">🎉</span>
            <h2 style="margin:1rem 0;">Lesson Completed!</h2>
            <div class="card" style="max-width:280px; margin:auto; text-align:left;">
              <p>Score: <strong>${this.correctCount} / ${this.lesson.exercises.length}</strong></p>
              <p>XP Earned: <strong>+${xp} XP</strong></p>
            </div>
          </div>
        `;

        btn.disabled = false;
        btn.textContent = 'Finish';
        btn.onclick = () => {
          document.getElementById('lessonModal').classList.add('hidden');
          App.navigate('learn');
        };
      }
    };

    /* =========================================================
       5. CORE APP COORDINATOR & UI ROUTING
    ========================================================= */
    const App = {
      state: StorageManager.load(),

      init() {
        this.updateHeader();
        if (this.state.theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.getElementById('themeToggleBtn').textContent = '☀️';
        }

        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const view = e.currentTarget.getAttribute('data-view');
            this.navigate(view);
          });
        });

        document.getElementById('themeToggleBtn').addEventListener('click', () => {
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          const next = isDark ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          document.getElementById('themeToggleBtn').textContent = isDark ? '🌙' : '☀️';
          this.state.theme = next;
          StorageManager.save(this.state);
        });

        document.getElementById('closeLessonBtn').addEventListener('click', () => {
          document.getElementById('lessonModal').classList.add('hidden');
        });

        this.navigate('home');
      },

      updateHeader() {
        document.getElementById('streakCount').textContent = this.state.streak.current;
        document.getElementById('totalXpCount').textContent = this.state.totalXP;
      },

      navigate(view) {
        document.querySelectorAll('.nav-item').forEach(b => {
          b.classList.toggle('active', b.getAttribute('data-view') === view);
        });

        const main = document.getElementById('mainContainer');
        main.innerHTML = '';

        if (view === 'home') this.renderHome(main);
        else if (view === 'learn') this.renderLearn(main);
        else if (view === 'vocab') this.renderVocab(main);
        else if (view === 'review') this.renderReview(main);
        else if (view === 'progress') this.renderProgress(main);
        else if (view === 'settings') this.renderSettings(main);
      },

      renderHome(main) {
        const lang = LANGUAGES[this.state.activeLanguage] || LANGUAGES.english;
        const lp = this.state.languages[this.state.activeLanguage];
        const pct = Math.min(100, Math.round((this.state.dailyXP / this.state.dailyGoal) * 100));

        main.innerHTML = `
          <div class="card" style="border-left: 6px solid var(--primary);">
            <span style="font-size:2rem;">${lang.flag}</span>
            <h2 style="font-size:1.3rem;">Learning ${lang.name}</h2>
            <p style="color:var(--text-muted); font-size:0.9rem;">Level ${lp.level} • ${lp.completedLessons.length} Lessons Finished</p>
            <button class="primary-btn" style="margin-top:0.75rem;" onclick="App.navigate('learn')">Continue Learning →</button>
          </div>

          <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:0.4rem; font-weight:700;">
              <span>🎯 Daily Goal</span>
              <span>${this.state.dailyXP} / ${this.state.dailyGoal} XP</span>
            </div>
            <div class="progress-bar-container">
              <div class="progress-bar-fill" style="width: ${pct}%;"></div>
            </div>
          </div>

          <h3 style="margin:1.25rem 0 0.5rem 0;">🌍 Select Language (Exact 8)</h3>
          <div class="lang-grid">
            ${Object.values(LANGUAGES).map(l => {
              const info = this.state.languages[l.id];
              const sel = this.state.activeLanguage === l.id;
              return `
                <div class="card lang-card ${sel ? 'selected' : ''}" onclick="App.switchLang('${l.id}')">
                  <div style="display:flex; align-items:center; gap:0.6rem;">
                    <span style="font-size:1.8rem;">${l.flag}</span>
                    <div>
                      <strong>${l.name}</strong>
                      <div style="font-size:0.75rem; color:var(--text-muted);">${info.level} • ${info.xp} XP</div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      },

      switchLang(langId) {
        this.state.activeLanguage = langId;
        StorageManager.save(this.state);
        this.navigate('learn');
      },

      renderLearn(main) {
        const lang = LANGUAGES[this.state.activeLanguage];
        const lp = this.state.languages[this.state.activeLanguage];
        const dataList = CURRICULUM_DATA[this.state.activeLanguage]?.[lp.level] || CURRICULUM_DATA.english.A1;

        main.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h2>${lang.flag} ${lang.name} Lessons</h2>
            <select class="secondary-btn" onchange="App.setLevel(this.value)">
              ${CEFR_LEVELS.map(lvl => `<option value="${lvl}" ${lvl === lp.level ? 'selected' : ''}>${lvl}</option>`).join('')}
            </select>
          </div>

          ${dataList.map((item, i) => {
            const lessonId = `${this.state.activeLanguage}-${lp.level}-l${i+1}`;
            const isDone = lp.completedLessons.includes(lessonId);
            return `
              <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                  <strong>Chapter ${i+1}: ${item.title}</strong>
                  <div style="font-size:0.8rem; color:var(--text-muted);">${item.word} = ${item.meaning}</div>
                </div>
                <button class="primary-btn" onclick="App.startLesson('${lessonId}', '${item.title}', '${item.word}', '${item.meaning}', '${item.ex}', '${item.exM}')">
                  ${isDone ? 'Review ✓' : 'Start'}
                </button>
              </div>
            `;
          }).join('')}
        `;
      },

      setLevel(lvl) {
        this.state.languages[this.state.activeLanguage].level = lvl;
        StorageManager.save(this.state);
        this.navigate('learn');
      },

      startLesson(id, title, word, meaning, ex, exM) {
        const lessonPayload = {
          id: id,
          title: title,
          vocab: { word, meaning, example: ex, exampleMeaning: exM },
          exercises: [
            { type: 'mcq', prompt: `What does "${word}" mean?`, options: [meaning, 'False Answer', 'Other Thing'], correct: 0, explanation: `"${word}" means "${meaning}".` },
            { type: 'listen', prompt: `Listen and select the word:`, audioText: word, options: [word, 'Option B', 'Option C'], correct: 0 },
            { type: 'order', prompt: `Arrange words: "${ex}"`, words: ex.split(' ').sort(() => Math.random() - 0.5), correct: ex.split(' '), explanation: exM },
            { type: 'speak', prompt: `Speak the phrase:`, target: word }
          ]
        };
        LessonEngine.start(lessonPayload, this.state.activeLanguage);
      },

      renderVocab(main) {
        const lang = LANGUAGES[this.state.activeLanguage];
        const bank = this.state.languages[this.state.activeLanguage].vocabulary;

        main.innerHTML = `
          <h2>📖 Vocabulary — ${lang.flag} ${lang.name}</h2>
          <p style="color:var(--text-muted); margin-bottom:1rem;">Words you have learned in lessons.</p>
          ${bank.length === 0 ? `<div class="card" style="text-align:center; padding:2rem;"><p>No words learned yet. Complete your first lesson!</p></div>` : `
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:0.75rem;">
              ${bank.map(v => `
                <div class="card">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong>${v.word}</strong>
                    <button class="audio-btn" onclick="AudioManager.speak('${v.word}', '${this.state.activeLanguage}')">🔊</button>
                  </div>
                  <div style="font-size:0.85rem; color:var(--text-muted); margin-top:0.3rem;">Meaning: ${v.meaning}</div>
                </div>
              `).join('')}
            </div>
          `}
        `;
      },

      renderReview(main) {
        const lang = LANGUAGES[this.state.activeLanguage];
        main.innerHTML = `
          <h2>🔄 Review Center</h2>
          <div class="card" style="text-align:center; padding:2rem; margin-top:1rem;">
            <h3>Target: ${lang.flag} ${lang.name}</h3>
            <p style="color:var(--text-muted); margin:0.75rem 0;">Spaced Repetition Review Deck is ready.</p>
            <button class="primary-btn" onclick="alert('Review session launched!')">Start Quick Review</button>
          </div>
        `;
      },

      renderProgress(main) {
        main.innerHTML = `
          <h2>📊 Progress & Mastery</h2>
          <div class="card" style="margin-top:1rem;">
            <div style="display:flex; justify-content:space-around; text-align:center;">
              <div><h3>${this.state.totalXP}</h3><small>Total XP</small></div>
              <div><h3>${this.state.streak.current}</h3><small>Streak</small></div>
            </div>
          </div>
          <h3 style="margin:1rem 0 0.5rem 0;">8 Languages Progress</h3>
          ${Object.values(LANGUAGES).map(l => {
            const lp = this.state.languages[l.id];
            return `
              <div class="card" style="margin-bottom:0.6rem;">
                <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
                  <strong>${l.flag} ${l.name} (${lp.level})</strong>
                  <span>${lp.xp} XP • ${lp.completedLessons.length} Done</span>
                </div>
              </div>
            `;
          }).join('')}
        `;
      },

      renderSettings(main) {
        main.innerHTML = `
          <h2>⚙️ Settings & Backup</h2>
          <div class="card" style="margin-top:1rem;">
            <h3>Data Management</h3>
            <p style="color:var(--text-muted); margin-bottom:1rem; font-size:0.85rem;">Export or restore your multi-language learning data (JSON format).</p>
            <div style="display:flex; gap:0.5rem;">
              <button class="primary-btn" onclick="App.exportData()">💾 Export JSON</button>
              <button class="secondary-btn" onclick="document.getElementById('fileInp').click()">📥 Import JSON</button>
              <input type="file" id="fileInp" style="display:none" accept=".json" onchange="App.importData(event)" />
            </div>
          </div>
        `;
      },

      exportData() {
        const blob = new Blob([JSON.stringify(this.state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `lingomaster_backup_${Date.now()}.json`;
        a.click();
      },

      importData(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (rev) => {
          try {
            const data = JSON.parse(rev.target.result);
            if (data.languages) {
              this.state = data;
              StorageManager.save(this.state);
              alert('Restored successfully!');
              location.reload();
            }
          } catch(err) {
            alert('Invalid backup JSON file.');
          }
        };
        reader.readAsText(file);
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>

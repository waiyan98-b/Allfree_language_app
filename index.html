<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>LingoMaster — 8 Languages Complete Edition</title>
<style>
:root{--green:#58cc02;--green-dark:#46a302;--blue:#1cb0f6;--blue-dark:#0f86be;--red:#ff4b4b;--gold:#ffc800;--bg:#f7f9fa;--text:#333;--muted:#777;--gray:#e5e5e5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;background:#fff;position:relative}
header{position:sticky;top:0;z-index:10;display:flex;gap:8px;align-items:center;padding:10px 14px;background:#fff;border-bottom:2px solid var(--gray)}
select{flex:1;padding:8px 12px;border:2px solid var(--blue);border-radius:12px;background:#eef9ff;font-weight:700;outline:none}
.stats{font-size:13px;white-space:nowrap;font-weight:700}
main{padding:16px 16px 90px}
.card{padding:18px;margin-bottom:14px;border:2px solid var(--gray);border-radius:18px;box-shadow:0 3px 0 #ddd;background:#fff}
.hero{color:#fff;border:0;background:linear-gradient(135deg,#1cb0f6,#087fb8)}
.hero h1{font-size:26px;margin:0 0 6px}
.btn,.back{width:100%;padding:14px;border:0;border-radius:13px;font-weight:800;cursor:pointer}
.btn{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-dark)}
.back{background:#fff;border:2px solid var(--gray);margin-bottom:10px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.level{padding:12px 4px;border:2px solid var(--gray);border-radius:12px;background:#fff;font-weight:800;cursor:pointer;text-align:center}
.level.active{border-color:var(--green);background:#efffe7;color:var(--green-dark)}
.lesson{display:flex;justify-content:space-between;align-items:center;padding:14px;margin:8px 0;border:2px solid var(--gray);border-radius:14px;cursor:pointer}
.lesson:hover{border-color:var(--blue)}
.muted{color:var(--muted);font-size:13px}
.progress{height:12px;overflow:hidden;border-radius:20px;background:var(--gray)}
.fill{height:100%;background:var(--green);transition:.3s}
.question{font-size:19px;line-height:1.4;margin:12px 0}
.choice{width:100%;padding:13px;margin:6px 0;text-align:left;border:2px solid var(--gray);border-radius:12px;background:#fff;cursor:pointer;font-weight:600;font-size:15px}
.choice.selected{border-color:var(--blue);background:#eef9ff}
.input{width:100%;padding:13px;margin:8px 0;border:2px solid var(--gray);border-radius:12px;font-size:16px;outline:none}
.slot{min-height:46px;border-bottom:2px solid var(--gray);display:flex;flex-wrap:wrap;gap:6px;padding:4px 0;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:#fff;border:2px solid var(--gray);box-shadow:0 2px 0 var(--gray);padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}
.chip.used{opacity:0.2;pointer-events:none}
.feedback{margin-top:12px;padding:14px;border-radius:12px;font-weight:700}
.feedback.correct{background:#d7ffb8;color:var(--green-dark)}
.feedback.wrong{background:#ffdfe0;color:var(--red)}
.hidden{display:none!important}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:15px;border:2px solid var(--gray);border-radius:14px;text-align:center}
.num{font-size:22px;font-weight:900}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:66px;display:flex;background:#fff;border-top:2px solid var(--gray);z-index:20}
nav button{flex:1;border:0;background:#fff;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer}
nav button.active{color:var(--green-dark)}
</style>
</head>
<body>
<div class="app">
<header>
<select id="lang" onchange="changeLang()"></select>
<div class="stats">🔥 <span id="streak">0</span>　⭐ <span id="xp">0</span>　❤️ ∞</div>
</header>

<main>
<section id="home">
<div class="card hero">
<h1>LingoMaster Global</h1>
<p>8 Languages • A1 → C2 Mastery</p>
<button class="btn" onclick="page('learn')">Continue Learning →</button>
</div>
<div class="card">
<div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px">
<span>🎯 Daily Goal</span><span id="dailyText" class="muted">0 / 50 XP</span>
</div>
<div class="progress"><div id="daily" class="fill"></div></div>
</div>
<div class="card">
<span class="muted" style="font-size:11px;text-transform:uppercase;font-weight:700">Current Course</span>
<h2 id="currentLang" style="margin:4px 0 2px"></h2>
<p id="currentLevel" class="muted" style="margin:0"></p>
</div>
</section>

<section id="learn" class="hidden">
<div class="card">
<h2 id="langTitle" style="margin-top:0"></h2>
<div id="levels" class="levels"></div>
</div>
<div class="card">
<h3 id="curriculumTitle" style="margin-top:0"></h3>
<div id="lessons"></div>
</div>
</section>

<section id="lesson" class="hidden">
<div class="card">
<button class="back" onclick="page('learn')">← Back to Lessons</button>
<p id="meta" class="muted"></p>
<div class="progress" style="margin-bottom:14px"><div id="lessonFill" class="fill"></div></div>
<button class="back" style="width:auto;padding:8px 14px;border-radius:10px;font-size:14px" onclick="speak()">🔊 Listen</button>
<h2 id="question" class="question"></h2>
<div id="answers"></div>
<button id="btnCheck" class="btn" style="margin-top:14px" onclick="check()">စစ်ဆေးမည် (CHECK)</button>
<div id="feedback" class="feedback hidden"></div>
</div>
</section>

<section id="progress" class="hidden">
<div class="card">
<h2 style="margin-top:0">📊 Progress Overview</h2>
<div class="statgrid">
<div class="stat"><div id="pxp" class="num" style="color:var(--blue)">0</div><div class="muted">Total XP</div></div>
<div class="stat"><div id="done" class="num" style="color:var(--green)">0</div><div class="muted">Completed</div></div>
<div class="stat"><div id="pstreak" class="num" style="color:#ff9600">0</div><div class="muted">Day Streak</div></div>
<div class="stat"><div class="num" style="color:var(--red)">∞</div><div class="muted">Hearts</div></div>
</div>
</div>
<div class="card"><h3 style="margin-top:0">Level Mastery</h3><div id="levelProgress"></div></div>
</section>
</main>

<nav>
<button id="nav-home" class="active" onclick="page('home')">🏠<br>Home</button>
<button id="nav-learn" onclick="page('learn')">📚<br>Learn</button>
<button id="nav-progress" onclick="page('progress')">📊<br>Progress</button>
</nav>
</div>

      A1: [
        { id: 1, title: "Saluti (Greetings)", questions: [
          { type: "mc", question: "'မင်္ဂလာပါ' ၏ အီတလီစကားကို ရွေးပါ", options: ["Ciao", "Grazie", "Prego"], answer: "Ciao", audio: "Ciao" },
          { type: "order", question: "ဝါကျစီပါ: 'Grazie mille'", words: ["mille", "Grazie", "Per favore"], answer: ["Grazie", "mille"], audio: "Grazie mille" }
        ]}
      ],
      C2: [
        { id: 1, title: "Modi di dire (Idioms)", questions: [
          { type: "mc", question: "'In bocca al lupo' ၏ သဘောမှာ?", options: ["ကံကောင်းပါစေ (Good luck)", "ဝံပုလွေလိုက်နေသည်", "သတိထားပါ"], answer: "ကံကောင်းပါစေ (Good luck)", audio: "In bocca al lupo" }
        ]}
      ]
    }
  }
};

let curLang = localStorage.getItem("lm_lang") || "en";
let curLevel = localStorage.getItem("lm_level") || "A1";
let xp = parseInt(localStorage.getItem("lm_xp") || "0", 10);
let streak = parseInt(localStorage.getItem("lm_streak") || "1", 10);
let dailyXP = parseInt(localStorage.getItem("lm_daily") || "0", 10);
let completedLessons = JSON.parse(localStorage.getItem("lm_done") || "{}");

let currentLesson = null;
let currentQIdx = 0;
let selectedAnswer = null;
let userBuiltWords = [];

function saveState() {
  localStorage.setItem("lm_lang", curLang);
  localStorage.setItem("lm_level", curLevel);
  localStorage.setItem("lm_xp", xp);
  localStorage.setItem("lm_streak", streak);
  localStorage.setItem("lm_daily", dailyXP);
  localStorage.setItem("lm_done", JSON.stringify(completedLessons));
  updateUI();
}

function updateUI() {
  document.getElementById("streak").textContent = streak;
  document.getElementById("xp").textContent = xp;
  document.getElementById("pxp").textContent = xp;
  document.getElementById("pstreak").textContent = streak;
  document.getElementById("dailyText").textContent = `${dailyXP} / 50 XP`;
  document.getElementById("daily").style.width = `${Math.min(100, (dailyXP / 50) * 100)}%`;

  const totalDone = Object.values(completedLessons).reduce((a, b) => a + (Array.isArray(b) ? b.length : 0), 0);
  document.getElementById("done").textContent = totalDone;
  
  const langObj = DB[curLang] || DB["en"];
  document.getElementById("currentLang").textContent = `${langObj.flag} ${langObj.name}`;
  document.getElementById("currentLevel").textContent = `Level ${curLevel}`;
}

function initLangSelect() {
  const select = document.getElementById("lang");
  select.innerHTML = "";
  for (const [code, info] of Object.entries(DB)) {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = `${info.flag} ${info.name}`;
    if (code === curLang) opt.selected = true;
    select.appendChild(opt);
  }
}

function changeLang() {
  curLang = document.getElementById("lang").value;
  saveState();
  renderLearn();
}

function page(id) {
  document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(id).classList.remove("hidden");
  
  const navBtn = document.getElementById(`nav-${id}`);
  if (navBtn) navBtn.classList.add("active");

  if (id === "learn") renderLearn();
  if (id === "progress") renderProgress();
  if (id === "home") updateUI();
}

function renderLearn() {
  const langObj = DB[curLang] || DB["en"];
  document.getElementById("langTitle").textContent = `${langObj.flag} ${langObj.name} Curriculum`;
  
  const levelsContainer = document.getElementById("levels");
  levelsContainer.innerHTML = "";
  const allLevels = ["A1", "A2", "B1", "B2", "C1", "C2"];
  
  allLevels.forEach(lvl => {
    const btn = document.createElement("button");
    btn.className = `level ${lvl === curLevel ? "active" : ""}`;
    btn.textContent = lvl;
    btn.onclick = () => {
      curLevel = lvl;
      saveState();
      renderLearn();
    };
    levelsContainer.appendChild(btn);
  });

  document.getElementById("curriculumTitle").textContent = `Level ${curLevel} Chapters`;
  const lessonsContainer = document.getElementById("lessons");
  lessonsContainer.innerHTML = "";
  
  const list = (langObj.levels && langObj.levels[curLevel]) || [];
  const doneKey = `${curLang}_${curLevel}`;
  const doneList = completedLessons[doneKey] || [];

  if (list.length === 0) {
    lessonsContainer.innerHTML = "<p class='muted' style='text-align:center;padding:20px 0;'>ဤ Level အတွက် သင်ခန်းစာများ မကြာမီ ထပ်မံထည့်သွင်းပါမည်။</p>";
    return;
  }

  list.forEach(ls => {
    const isDone = doneList.includes(ls.id);
    const div = document.createElement("div");
    div.className = "lesson";
    div.innerHTML = `
      <div>
        <strong>${isDone ? "✓ " : "● "}Chapter ${ls.id}: ${ls.title}</strong>
        <div class="muted">${ls.questions.length} Exercises</div>
      </div>
      <div style="font-weight:bold;color:var(--blue)">➔</div>
    `;
    div.onclick = () => startLesson(ls);
    lessonsContainer.appendChild(div);
  });
}

function startLesson(ls) {
  currentLesson = ls;
  currentQIdx = 0;
  page("lesson");
  renderQuestion();
}

function renderQuestion() {
  selectedAnswer = null;
  userBuiltWords = [];
  const q = currentLesson.questions[currentQIdx];
  const total = currentLesson.questions.length;
  
  document.getElementById("meta").textContent = `Chapter ${currentLesson.id} • Exercise ${currentQIdx + 1}/${total}`;
  document.getElementById("lessonFill").style.width = `${(currentQIdx / total) * 100}%`;
  document.getElementById("question").textContent = q.question;
  
  const fb = document.getElementById("feedback");
  fb.className = "feedback hidden";
  fb.innerHTML = "";

  const ansContainer = document.getElementById("answers");
  ansContainer.innerHTML = "";

  if (q.type === "mc" || q.type === "listen") {
    q.options.forEach(opt => {
      const b = document.createElement("button");
      b.className = "choice";
      b.textContent = opt;
      b.onclick = () => {
        document.querySelectorAll(".choice").forEach(c => c.classList.remove("selected"));
        b.classList.add("selected");
        selectedAnswer = opt;
      };
      ansContainer.appendChild(b);
    });
    if (q.type === "listen") speak();
  } else if (q.type === "fill") {
    const inp = document.createElement("input");
    inp.className = "input";
    inp.placeholder = "အဖြေကို စာရိုက်ထည့်ပါ...";
    inp.oninput = (e) => { selectedAnswer = e.target.value.trim(); };
    ansContainer.appendChild(inp);
  } else if (q.type === "order") {
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.id = "orderSlot";

    const chips = document.createElement("div");
    chips.className = "chips";

    q.words.forEach(w => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = w;
      chip.onclick = () => {
        if (!chip.classList.contains("used")) {
          chip.classList.add("used");
          userBuiltWords.push(w);

          const sChip = document.createElement("div");
          sChip.className = "chip";
          sChip.textContent = w;
          sChip.onclick = () => {
            slot.removeChild(sChip);
            chip.classList.remove("used");
            userBuiltWords = userBuiltWords.filter(item => item !== w);
          };
          slot.appendChild(sChip);
        }
      };
      chips.appendChild(chip);
    });
    ansContainer.appendChild(slot);
    ansContainer.appendChild(chips);
  }
}

function speak() {
  const q = currentLesson.questions[currentQIdx];
  if (!q.audio || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(q.audio);
  utter.lang = (DB[curLang] && DB[curLang].voice) || "en-US";
  window.speechSynthesis.speak(utter);
}

function check() {
  const q = currentLesson.questions[currentQIdx];
  let isCorrect = false;

  if (q.type === "order") {
    if (userBuiltWords.length === 0) return alert("စကားလုံးများကို စီပေးပါ!");
    isCorrect = JSON.stringify(userBuiltWords) === JSON.stringify(q.answer);
  } else {
    if (!selectedAnswer) return alert("အဖြေကို အရင်ရွေးချယ်ပါ သို့မဟုတ် စာရိုက်ထည့်ပါ!");
    isCorrect = (selectedAnswer.toLowerCase() === q.answer.toLowerCase());
  }

  const fb = document.getElementById("feedback");
  fb.classList.remove("hidden");

  if (isCorrect) {
    fb.className = "feedback correct";
    fb.innerHTML = `✅ မှန်ကန်ပါတယ်! (+10 XP)<br><button class="btn" style="margin-top:10px" onclick="nextQ()">ဆက်သွားမည် ➔</button>`;
    xp += 10;
    dailyXP += 10;
  } else {
    fb.className = "feedback wrong";
    fb.innerHTML = `❌ မှားယွင်းနေပါသည်။<br>မှန်ကန်သောအဖြေ: <b>${Array.isArray(q.answer) ? q.answer.join(" ") : q.answer}</b><br><button class="btn" style="margin-top:10px" onclick="nextQ()">ဆက်သွားမည် ➔</button>`;
  }
  saveState();
}

function nextQ() {
  if (currentQIdx < currentLesson.questions.length - 1) {
    currentQIdx++;
    renderQuestion();
  } else {
    alert("🎉 Chapter ပြီးဆုံးပါပြီ! (+20 Bonus XP)");
    xp += 20;
    dailyXP += 20;
    const doneKey = `${curLang}_${curLevel}`;
    if (!completedLessons[doneKey]) completedLessons[doneKey] = [];
    if (!completedLessons[doneKey].includes(currentLesson.id)) {
      completedLessons[doneKey].push(currentLesson.id);
    }
    saveState();
    page("learn");
  }
}

function renderProgress() {
  updateUI();
  const container = document.getElementById("levelProgress");
  container.innerHTML = "";
  const allLevels = ["A1", "A2", "B1", "B2", "C1", "C2"];
  const langObj = DB[curLang] || DB["en"];

  allLevels.forEach(lvl => {
    const list = (langObj.levels && langObj.levels[lvl]) || [];
    const doneKey = `${curLang}_${lvl}`;
    const doneCount = (completedLessons[doneKey] || []).length;
    const total = list.length;
    const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;

    const div = document.createElement("div");
    div.style.marginBottom = "12px";
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:4px">
        <span>Level ${lvl}</span>
        <span>${doneCount} / ${total} (${pct}%)</span>
      </div>
      <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
    `;
    container.appendChild(div);
  });
}

window.onload = () => {
  initLangSelect();
  saveState();
  updateUI();
};
</script>
</body>
</html>

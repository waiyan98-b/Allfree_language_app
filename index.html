<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LingoMaster Global — 8 Languages A1 to C2</title>
<style>
:root{
  --green:#58cc02;--greenDark:#46a302;--blue:#1cb0f6;--blueDark:#087fb8;
  --red:#ff4b4b;--gold:#ffc800;--bg:#f7f9fa;--text:#333;--muted:#777;--line:#e5e5e5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:600px;min-height:100vh;margin:auto;background:white;position:relative}
header{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;padding:10px 14px;background:white;border-bottom:2px solid var(--line)}
select{flex:1;padding:10px;border:2px solid var(--blue);border-radius:12px;background:#eef9ff;font-weight:800;outline:none;font-size:14px}
.stats{white-space:nowrap;font-size:13px;font-weight:800}
main{padding:16px 16px 90px}
section.hidden{display:none!important}
.card{background:white;border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 0 #ddd}
.hero{color:white;border:0;background:linear-gradient(135deg,#1cb0f6,#087fb8)}
.hero h1{margin:0 0 6px;font-size:26px}
.btn,.back{width:100%;padding:14px;border-radius:13px;font-weight:900;font-size:15px;cursor:pointer}
.btn{border:0;color:white;background:var(--green);box-shadow:0 4px 0 var(--greenDark)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--greenDark)}
.back{background:white;border:2px solid var(--line);margin-bottom:10px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.level{padding:12px 4px;border:2px solid var(--line);border-radius:12px;background:white;font-weight:900;cursor:pointer;text-align:center}
.level.active{border-color:var(--green);background:#efffe7;color:var(--greenDark)}
.lesson{display:flex;align-items:center;justify-content:space-between;padding:14px;margin:8px 0;border:2px solid var(--line);border-radius:14px;cursor:pointer}
.lesson:hover{border-color:var(--blue)}
.muted{color:var(--muted);font-size:13px}
.progress{height:12px;overflow:hidden;border-radius:20px;background:var(--line)}
.fill{height:100%;background:var(--green);transition:.3s}
.question{font-size:20px;line-height:1.45;margin:15px 0}
.choice{width:100%;padding:14px;margin:6px 0;text-align:left;border:2px solid var(--line);border-radius:12px;background:white;cursor:pointer;font-weight:700;font-size:15px}
.choice.selected{border-color:var(--blue);background:#eef9ff}
.input{width:100%;padding:14px;margin:8px 0;border:2px solid var(--line);border-radius:12px;font-size:17px;outline:none}
.input:focus{border-color:var(--blue)}
.slot{min-height:55px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:9px;margin-bottom:12px;border:2px dashed #bbb;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:white;box-shadow:0 2px 0 #ddd;font-weight:800;cursor:pointer}
.chip.used{opacity:.25;pointer-events:none}
.feedback{padding:14px;margin-top:12px;border-radius:12px;font-weight:800}
.correct{background:#d9ffc1;color:var(--greenDark)}
.wrong{background:#ffdfe0;color:#d22}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:15px;text-align:center;border:2px solid var(--line);border-radius:14px}
.num{font-size:24px;font-weight:900}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(600px,100%);height:66px;display:flex;background:white;border-top:2px solid var(--line);z-index:30}
nav button{flex:1;border:0;background:white;color:var(--muted);font-weight:800;font-size:12px;cursor:pointer}
nav button.active{color:var(--greenDark)}
</style>
</head>
<body>

<div class="app">
<header>
<select id="languageSelect" onchange="changeLanguage()"></select>
<div class="stats">
🔥 <span id="streak">1</span>　⭐ <span id="xp">0</span>　❤️ ∞
</div>
</header>

<main>
<!-- HOME -->
<section id="home">
<div class="card hero">
<h1>LingoMaster Global</h1>
<p>🌍 8 Languages<br>📚 A1 → C2 Complete Track<br>❤️ Energy: ∞ Unlimited</p>
<button class="btn" onclick="page('learn')">Continue Learning →</button>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;margin-bottom:6px">
<b>🎯 Daily Goal</b>
<span id="dailyText" class="muted">0 / 50 XP</span>
</div>
<div class="progress">
<div id="dailyFill" class="fill"></div>
</div>
</div>

<div class="card">
<span class="muted">CURRENT COURSE</span>
<h2 id="currentLanguage" style="margin:4px 0"></h2>
<p id="currentLevel" class="muted" style="margin:0"></p>
</div>

<div class="card">
<h3 style="margin-top:0">🏆 Achievements</h3>
<div id="achievements"></div>
</div>
</section>

<!-- LEARN -->
<section id="learn" class="hidden">
<div class="card">
<h2 id="courseTitle" style="margin-top:0"></h2>
<div id="levels" class="levels"></div>
</div>
<div class="card">
<h3 id="chapterTitle" style="margin-top:0"></h3>
<div id="lessons"></div>
</div>
</section>

<!-- LESSON -->
<section id="lesson" class="hidden">
<div class="card">
<button class="back" onclick="page('learn')">← Back to Lessons</button>
<p id="lessonMeta" class="muted"></p>
<div class="progress">
<div id="lessonProgress" class="fill"></div>
</div>
<button class="back" style="width:auto;margin-top:12px;padding:8px 14px" onclick="speakCurrent()">🔊 Listen</button>
<h2 id="question" class="question"></h2>
<div id="answers"></div>
<button id="checkButton" class="btn" style="margin-top:12px" onclick="checkAnswer()">စစ်ဆေးမည် (CHECK)</button>
<div id="feedback" class="feedback hidden"></div>
</div>
</section>

<!-- PROGRESS -->
<section id="progress" class="hidden">
<div class="card">
<h2 style="margin-top:0">📊 Progress Overview</h2>
<div class="statgrid">
<div class="stat">
<div id="totalXP" class="num" style="color:var(--blue)">0</div>
<div class="muted">Total XP</div>
</div>
<div class="stat">
<div id="completed" class="num" style="color:var(--green)">0</div>
<div class="muted">Completed</div>
</div>
<div class="stat">
<div id="progressStreak" class="num" style="color:#ff9600">1</div>
<div class="muted">Day Streak</div>
</div>
<div class="stat">
<div class="num" style="color:var(--red)">∞</div>
<div class="muted">Energy</div>
</div>
</div>
</div>

<div class="card">
<h3 style="margin-top:0">📚 Level Mastery</h3>
<div id="levelMastery"></div>
</div>

<div class="card">
<h3 style="margin-top:0">🌍 Language Progress</h3>
<div id="languageMastery"></div>
</div>
</section>
</main>

<nav>
<button id="nav-home" class="active" onclick="page('home')">🏠<br>Home</button>
<button id="nav-learn" onclick="page('learn')">📚<br>Learn</button>
<button id="nav-progress" onclick="page('progress')">📊<br>Progress</button>
</nav>
</div>

<script>
const VOCAB_DATA = {
  en: {
    flag: "🇬🇧", name: "English", voice: "en-US",
    words: [
      ["Hello", "မင်္ဂလာပါ"], ["Thank you", "ကျေးဇူးတင်ပါတယ်"], ["Water", "ရေ"], ["Food", "အစားအစာ"],
      ["Home", "အိမ်"], ["School", "ကျောင်း"], ["Work", "အလုပ်"], ["Money", "ငွေကြေး"],
      ["Friend", "သူငယ်ချင်း"], ["Doctor", "ဆရာဝန်"]
    ]
  },
  th: {
    flag: "🇹🇭", name: "Thai", voice: "th-TH",
    words: [
      ["สวัสดี", "မင်္ဂလာပါ"], ["ขอบคุณ", "ကျေးဇူးတင်ပါတယ်"], ["น้ำ", "ရေ"], ["อาหาร", "အစားအစာ"],
      ["บ้าน", "အိမ်"], ["โรงเรียน", "ကျောင်း"], ["งาน", "အလုပ်"], ["เงิน", "ငွေကြေး"],
      ["เพื่อน", "သူငယ်ချင်း"], ["หมอ", "ဆရာဝန်"]
    ]
  },
  ja: {
    flag: "🇯🇵", name: "Japanese", voice: "ja-JP",
    words: [
      ["こんにちは", "မင်္ဂလာပါ"], ["ありがとう", "ကျေးဇူးတင်ပါတယ်"], ["水", "ရေ"], ["食べ物", "အစားအစာ"],
      ["家", "အိမ်"], ["学校", "ကျောင်း"], ["仕事", "အလုပ်"], ["お金", "ငွေကြေး"],
      ["友達", "သူငယ်ချင်း"], ["医者", "ဆရာဝန်"]
    ]
  },
  ko: {
    flag: "🇰🇷", name: "Korean", voice: "ko-KR",
    words: [
      ["안녕하세요", "မင်္ဂလာပါ"], ["감사합니다", "ကျေးဇူးတင်ပါတယ်"], ["물", "ရေ"], ["음식", "အစားအစာ"],
      ["집", "အိမ်"], ["학교", "ကျောင်း"], ["일", "အလုပ်"], ["돈", "ငွေကြေး"],
      ["친구", "သူငယ်ချင်း"], ["의사", "ဆရာဝန်"]
    ]
  },
  de: {
    flag: "🇩🇪", name: "German", voice: "de-DE",
    words: [
      ["Hallo", "မင်္ဂလာပါ"], ["Danke", "ကျေးဇူးတင်ပါတယ်"], ["Wasser", "ရေ"], ["Essen", "အစားအစာ"],
      ["Haus", "အိမ်"], ["Schule", "ကျောင်း"], ["Arbeit", "အလုပ်"], ["Geld", "ငွေကြေး"],
      ["Freund", "သူငယ်ချင်း"], ["Arzt", "ဆရာဝန်"]
    ]
  },
  es: {
    flag: "🇪🇸", name: "Spanish", voice: "es-ES",
    words: [
      ["Hola", "မင်္ဂလာပါ"], ["Gracias", "ကျေးဇူးတင်ပါတယ်"], ["Agua", "ရေ"], ["Comida", "အစားအစာ"],
      ["Casa", "အိမ်"], ["Escuela", "ကျောင်း"], ["Trabajo", "အလုပ်"], ["Dinero", "ငွေကြေး"],
      ["Amigo", "သူငယ်ချင်း"], ["Médico", "ဆရာဝန်"]
    ]
  },
  fr: {
    flag: "🇫🇷", name: "French", voice: "fr-FR",
    words: [
      ["Bonjour", "မင်္ဂလာပါ"], ["Merci", "ကျေးဇူးတင်ပါတယ်"], ["Eau", "ရေ"], ["Nourriture", "အစားအစာ"],
      ["Maison", "အိမ်"], ["École", "ကျောင်း"], ["Travail", "အလုပ်"], ["Argent", "ငွေကြေး"],
      ["Ami", "သူငယ်ချင်း"], ["Médecin", "ဆရာဝန်"]
    ]
  },
  it: {
    flag: "🇮🇹", name: "Italian", voice: "it-IT",
    words: [
      ["Ciao", "မင်္ဂလာပါ"], ["Grazie", "ကျေးဇူးတင်ပါတယ်"], ["Acqua", "ရေ"], ["Cibo", "အစားအစာ"],
      ["Casa", "အိမ်"], ["Scuola", "ကျောင်း"], ["Lavoro", "အလုပ်"], ["Denaro", "ငွေကြေး"],
      ["Amico", "သူငယ်ချင်း"], ["Medico", "ဆရာဝန်"]
    ]
  }
};

const LEVEL_TOPICS = {
  A1: ["Greetings & Basics", "Numbers & Time", "Family & Home", "Food & Dining", "Daily Life", "Directions", "Shopping", "Basic Questions", "Hobbies", "Health Basics"],
  A2: ["Past Tense", "Travel", "Workplace", "Weather", "Transportation", "Restaurant", "Problems", "Appointments", "Socializing", "Everyday Grammar"],
  B1: ["Experiences", "Opinions", "Education", "Office Talk", "Relationships", "News & Media", "Technology", "Environment", "Storytelling", "Future Plans"],
  B2: ["Debates", "Journalism", "Society", "Business", "Science", "Culture", "Formal Letters", "Presentations", "Listening", "Advanced Grammar"],
  C1: ["Abstract Concepts", "Academic Terms", "Writing", "Nuances", "Idioms", "Critical Thinking", "Complex Audio", "Rhetoric", "Research", "Fluency"],
  C2: ["Language Mastery", "Literature", "Master Idioms", "Deep Context", "Persuasion", "Critical Analysis", "Arguments", "Professional Fluency", "Style & Tone", "Final Examination"]
};

// Generate Comprehensive Database
const DB = {};
for (const [code, info] of Object.entries(VOCAB_DATA)) {
  DB[code] = { flag: info.flag, name: info.name, voice: info.voice, levels: {} };
  for (const [lvl, topics] of Object.entries(LEVEL_TOPICS)) {
    DB[code].levels[lvl] = topics.map((t, idx) => {
      const pair = info.words[idx % info.words.length];
      return {
        id: idx + 1,
        title: t,
        questions: [
          {
            type: "mc",
            question: `"${pair[0]}" ၏ မြန်မာအဓိပ္ပာယ်ကို ရွေးပါ`,
            options: [pair[1], "မနက်ဖြန်", "ဆရာ", "မသေချာပါ"],
            answer: pair[1],
            audio: pair[0]
          },
          {
            type: "fill",
            question: `"${pair[1]}" ကို ${info.name} လို စာရိုက်ထည့်ပါ`,
            answer: pair[0],
            audio: pair[0]
          },
          {
            type: "listen",
            question: "🔊 အသံကိုနားထောင်ပြီး မှန်ကန်သောအဖြေကို ရွေးပါ",
            options: [pair[0], info.words[(idx + 1) % 10][0], info.words[(idx + 2) % 10][0]],
            answer: pair[0],
            audio: pair[0]
          },
          {
            type: "order",
            question: `ဝါကျစီပါ — "${pair[0]}"`,
            words: [pair[0]],
            answer: [pair[0]],
            audio: pair[0]
          }
        ]
      };
    });
  }
}

// App State
const saved = JSON.parse(localStorage.getItem("lingomaster_state") || "{}");
let state = {
  language: saved.language || "en",
  level: saved.level || "A1",
  xp: Number(saved.xp || 0),
  streak: Number(saved.streak || 1),
  dailyXP: Number(saved.dailyXP || 0),
  dailyDate: saved.dailyDate || "",
  done: saved.done || {}
};

let currentLesson = null;
let currentQuestion = 0;
let selectedAnswer = null;
let builtWords = [];

function save() {
  localStorage.setItem("lingomaster_state", JSON.stringify(state));
  updateUI();
}

function checkDaily() {
  const today = new Date().toISOString().slice(0, 10);
  if (state.dailyDate !== today) {
    state.dailyDate = today;
    state.dailyXP = 0;
    save();
  }
}

function initApp() {
  checkDaily();
  const select = document.getElementById("languageSelect");
  select.innerHTML = "";
  for (const [code, data] of Object.entries(DB)) {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = `${data.flag} ${data.name}`;
    if (code === state.language) opt.selected = true;
    select.appendChild(opt);
  }
  updateUI();
  renderLearn();
}

function changeLanguage() {
  state.language = document.getElementById("languageSelect").value;
  save();
  renderLearn();
  updateUI();
}

function updateUI() {
  const data = DB[state.language] || DB.en;
  document.getElementById("streak").textContent = state.streak;
  document.getElementById("xp").textContent = state.xp;
  document.getElementById("totalXP").textContent = state.xp;
  document.getElementById("progressStreak").textContent = state.streak;
  document.getElementById("dailyText").textContent = `${state.dailyXP} / 50 XP`;
  document.getElementById("dailyFill").style.width = Math.min(100, (state.dailyXP / 50) * 100) + "%";
  document.getElementById("currentLanguage").textContent = `${data.flag} ${data.name}`;
  document.getElementById("currentLevel").textContent = `Current Level: ${state.level}`;

  let totalDone = 0;
  for (const k in state.done) {
    totalDone += state.done[k].length;
  }
  document.getElementById("completed").textContent = totalDone;
  renderAchievements();
}

function page(id) {
  document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(id).classList.remove("hidden");

  const nav = document.getElementById("nav-" + id);
  if (nav) nav.classList.add("active");

  if (id === "home") updateUI();
  if (id === "learn") renderLearn();
  if (id === "progress") renderProgress();
}

function renderLearn() {
  const data = DB[state.language] || DB.en;
  document.getElementById("courseTitle").textContent = `${data.flag} ${data.name} Curriculum`;
  
  const levelContainer = document.getElementById("levels");
  levelContainer.innerHTML = "";
  ["A1", "A2", "B1", "B2", "C1", "C2"].forEach(lvl => {
    const btn = document.createElement("button");
    btn.className = "level " + (state.level === lvl ? "active" : "");
    btn.textContent = lvl;
    btn.onclick = () => {
      state.level = lvl;
      save();
      renderLearn();
    };
    levelContainer.appendChild(btn);
  });

  document.getElementById("chapterTitle").textContent = `${state.level} — Chapters (${data.levels[state.level].length})`;
  const container = document.getElementById("lessons");
  container.innerHTML = "";

  const list = data.levels[state.level] || [];
  const key = `${state.language}_${state.level}`;
  const done = state.done[key] || [];

  list.forEach(ls => {
    const isDone = done.includes(ls.id);
    const div = document.createElement("div");
    div.className = "lesson";
    div.innerHTML = `
      <div>
        <b>${isDone ? "🏆" : "📘"} Chapter ${ls.id}: ${ls.title}</b>
        <div class="muted">${ls.questions.length} Exercises</div>
      </div>
      <b style="color:var(--blue)">→</b>
    `;
    div.onclick = () => startLesson(ls.id);
    container.appendChild(div);
  });
}

function startLesson(id) {
  currentLesson = DB[state.language].levels[state.level].find(x => x.id === id);
  currentQuestion = 0;
  page("lesson");
  renderQuestion();
}

function renderQuestion() {
  selectedAnswer = null;
  builtWords = [];
  const q = currentLesson.questions[currentQuestion];
  const total = currentLesson.questions.length;

  document.getElementById("lessonMeta").textContent = `Chapter ${currentLesson.id} • Question ${currentQuestion + 1}/${total}`;
  document.getElementById("lessonProgress").style.width = ((currentQuestion) / total * 100) + "%";
  document.getElementById("question").textContent = q.question;

  const fb = document.getElementById("feedback");
  fb.className = "feedback hidden";
  fb.innerHTML = "";

  const container = document.getElementById("answers");
  container.innerHTML = "";

  if (q.type === "mc" || q.type === "listen") {
    q.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "choice";
      btn.textContent = opt;
      btn.onclick = () => {
        document.querySelectorAll(".choice").forEach(c => c.classList.remove("selected"));
        btn.classList.add("selected");
        selectedAnswer = opt;
      };
      container.appendChild(btn);
    });
    if (q.type === "listen") speakCurrent();
  } else if (q.type === "fill") {
    const input = document.createElement("input");
    input.className = "input";
    input.placeholder = "အဖြေကို စာရိုက်ထည့်ပါ...";
    input.oninput = (e) => { selectedAnswer = e.target.value.trim(); };
    container.appendChild(input);
  } else if (q.type === "order") {
    const slot = document.createElement("div");
    slot.className = "slot";
    const chips = document.createElement("div");
    chips.className = "chips";
    q.words.forEach(w => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = w;
      chip.onclick = () => {
        if (!chip.classList.contains("used")) {
          chip.classList.add("used");
          builtWords.push(w);
          const sChip = document.createElement("div");
          sChip.className = "chip";
          sChip.textContent = w;
          sChip.onclick = () => {
            slot.removeChild(sChip);
            chip.classList.remove("used");
            builtWords = builtWords.filter(item => item !== w);
          };
          slot.appendChild(sChip);
        }
      };
      chips.appendChild(chip);
    });
    container.appendChild(slot);
    container.appendChild(chips);
  }
}

function speakCurrent() {
  const q = currentLesson.questions[currentQuestion];
  if (!q.audio || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(q.audio);
  utter.lang = DB[state.language].voice || "en-US";
  window.speechSynthesis.speak(utter);
}

function checkAnswer() {
  const q = currentLesson.questions[currentQuestion];
  let correct = false;

  if (q.type === "order") {
    if (builtWords.length === 0) return alert("စကားလုံးများကို စီပေးပါ!");
    correct = JSON.stringify(builtWords) === JSON.stringify(q.answer);
  } else {
    if (!selectedAnswer) return alert("အဖြေကို အရင်ရွေးချယ်ပါ သို့မဟုတ် ရိုက်ထည့်ပါ!");
    correct = selectedAnswer.toLowerCase() === q.answer.toLowerCase();
  }

  const fb = document.getElementById("feedback");
  fb.classList.remove("hidden");

  if (correct) {
    fb.className = "feedback correct";
    fb.innerHTML = `✅ မှန်ကန်ပါတယ်! (+10 XP)<br><button class="btn" style="margin-top:10px" onclick="nextQuestion()">ဆက်သွားမည် ➔</button>`;
    state.xp += 10;
    state.dailyXP += 10;
  } else {
    fb.className = "feedback wrong";
    fb.innerHTML = `❌ မှားယွင်းနေပါသည်။<br>မှန်ကန်သောအဖြေ: <b>${Array.isArray(q.answer) ? q.answer.join(" ") : q.answer}</b><br><button class="btn" style="margin-top:10px" onclick="nextQuestion()">ဆက်သွားမည် ➔</button>`;
  }
  save();
}

function nextQuestion() {
  if (currentQuestion < currentLesson.questions.length - 1) {
    currentQuestion++;
    renderQuestion();
  } else {
    alert("🎉 Chapter အောင်မြင်စွာ ပြီးဆုံးပါပြီ! (+20 Bonus XP)");
    state.xp += 20;
    state.dailyXP += 20;
    const key = `${state.language}_${state.level}`;
    if (!state.done[key]) state.done[key] = [];
    if (!state.done[key].includes(currentLesson.id)) {
      state.done[key].push(currentLesson.id);
    }
    save();
    page("learn");
  }
}

function renderAchievements() {
  const container = document.getElementById("achievements");
  if (!container) return;
  container.innerHTML = "";
  const list = [
    { title: "🌟 First Steps", desc: "Earn your first 10 XP", done: state.xp >= 10 },
    { title: "🔥 Habit Builder", desc: "Maintain a daily study streak", done: state.streak >= 1 },
    { title: "⭐ XP Master", desc: "Earn 100+ total XP", done: state.xp >= 100 }
  ];
  list.forEach(a => {
    container.innerHTML += `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;opacity:${a.done ? '1' : '0.4'}">
        <span style="font-size:22px">${a.done ? '🎖️' : '🔒'}</span>
        <div>
          <b>${a.title}</b>
          <div class="muted">${a.desc}</div>
        </div>
      </div>
    `;
  });
}

function renderProgress() {
  updateUI();
  const lm = document.getElementById("levelMastery");
  lm.innerHTML = "";
  const data = DB[state.language] || DB.en;

  ["A1", "A2", "B1", "B2", "C1", "C2"].forEach(lvl => {
    const list = data.levels[lvl] || [];
    const key = `${state.language}_${lvl}`;
    const count = (state.done[key] || []).length;
    const total = list.length;
    const pct = total > 0 ? Math.round((count / total) * 100) : 0;
    lm.innerHTML += `
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:3px">
          <span>Level ${lvl}</span>
          <span>${count} / ${total} (${pct}%)</span>
        </div>
        <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
      </div>
    `;
  });

  const langM = document.getElementById("languageMastery");
  langM.innerHTML = "";
  for (const [code, info] of Object.entries(DB)) {
    let totalL = 0;
    let doneL = 0;
    ["A1", "A2", "B1", "B2", "C1", "C2"].forEach(lvl => {
      totalL += (info.levels[lvl] || []).length;
      doneL += (state.done[`${code}_${lvl}`] || []).length;
    });
    const pct = totalL > 0 ? Math.round((doneL / totalL) * 100) : 0;
    langM.innerHTML += `
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-bottom:3px">
          <span>${info.flag} ${info.name}</span>
          <span>${doneL} / ${totalL} (${pct}%)</span>
        </div>
        <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
      </div>
    `;
  }
}

window.onload = initApp;
</script>
</body>
</html>

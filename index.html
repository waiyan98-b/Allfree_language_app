<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LingoMaster - English & Thai A1</title>
  <style>
    :root {
      --green: #58cc02;
      --green-dark: #46a302;
      --green-light: #d7ffb8;
      --blue: #1cb0f6;
      --blue-dark: #0f86be;
      --gold: #ffc800;
      --red: #ff4b4b;
      --red-light: #ffdfe0;
      --gray: #e5e5e5;
      --text: #3c3c3c;
      --bg: #f7f9fa;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      align-items: center;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: white;
      position: relative;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 2px solid var(--gray);
      background: white;
      font-weight: bold;
      font-size: 14px;
      z-index: 10;
    }
    .lang-select {
      border: 2px solid var(--blue);
      border-radius: 10px;
      padding: 4px 8px;
      font-weight: bold;
      font-size: 13px;
      outline: none;
      background: #f0f9ff;
      color: #0277bd;
    }
    .stats-group { display: flex; gap: 10px; align-items: center; }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 75px;
    }
    .screen { display: none; flex-direction: column; width: 100%; }
    .screen.active { display: flex; }
    .card {
      background: white;
      border: 2px solid var(--gray);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 3px 0 var(--gray);
    }
    .hero-card {
      background: linear-gradient(135deg, var(--blue), var(--blue-dark));
      color: white;
      border: none;
      box-shadow: 0 4px 12px rgba(28,176,246,0.3);
    }
    .btn-main {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      background: var(--green);
      color: white;
      box-shadow: 0 4px 0 var(--green-dark);
      cursor: pointer;
      text-align: center;
    }
    .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green-dark); }
    .goal-track {
      width: 100%;
      height: 12px;
      background: rgba(0,0,0,0.1);
      border-radius: 10px;
      overflow: hidden;
      margin: 8px 0 4px 0;
    }
    .goal-fill { height: 100%; background: var(--gold); width: 0%; transition: width 0.3s; }
    .chapter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      border: 2px solid var(--gray);
      border-radius: 14px;
      margin-bottom: 10px;
      background: white;
      box-shadow: 0 3px 0 var(--gray);
      cursor: pointer;
    }
    .chapter-item.locked { background: #fafafa; opacity: 0.6; cursor: not-allowed; box-shadow: none; }
    .chapter-item.completed { border-color: var(--green); }
    .bottom-nav {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: white;
      border-top: 2px solid var(--gray);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 20;
    }
    .nav-btn {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: none;
      border: none;
      font-size: 11px;
      font-weight: bold;
      color: #888;
      cursor: pointer;
    }
    .nav-btn.active { color: var(--green-dark); }
    .nav-btn span { font-size: 18px; margin-bottom: 2px; }

    /* Game Screen */
    .game-header { display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 16px; }
    .btn-close { background: none; border: none; font-size: 20px; font-weight: bold; color: #888; cursor: pointer; }
    .progress-wrap { flex: 1; height: 12px; background: var(--gray); border-radius: 8px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--green); transition: width 0.3s; }
    .prompt-box { font-size: 19px; font-weight: bold; margin-bottom: 16px; line-height: 1.4; }
    .speaker-btn {
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 3px 0 var(--blue-dark);
      cursor: pointer;
      align-self: flex-start;
      margin-bottom: 14px;
    }
    .choice-option {
      width: 100%;
      padding: 13px;
      border: 2px solid var(--gray);
      border-radius: 12px;
      box-shadow: 0 3px 0 var(--gray);
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 10px;
      cursor: pointer;
      background: white;
      text-align: left;
    }
    .choice-option.selected { border-color: var(--blue); background: #e1f5fe; }
    .slot-container { min-height: 48px; border-bottom: 2px solid var(--gray); display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; margin-bottom: 20px; }
    .bubble-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .word-chip {
      background: white;
      border: 2px solid var(--gray);
      box-shadow: 0 3px 0 var(--gray);
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .word-chip.used { opacity: 0.2; pointer-events: none; }
    .fill-input {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--blue);
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 16px;
      outline: none;
    }
    .feedback-sheet {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 20px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }
    .feedback-sheet.correct { background: var(--green-light); color: var(--green-dark); }
    .feedback-sheet.wrong { background: var(--red-light); color: var(--red); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <select class="lang-select" id="langSwitcher" onchange="switchLanguage()">
        <option value="en">🇬🇧 English (A1)</option>
        <option value="th">🇹🇭 ไทย (Thai A1)</option>
      </select>
      <div class="stats-group">
        <div style="color: #ff9600;">🔥 <span id="streakDisplay">1</span></div>
        <div style="color: #1cb0f6;">⭐ <span id="xpDisplay">0</span></div>
        <div style="color: #ff4b4b;">❤️ <span id="heartDisplay">5</span></div>
      </div>
    </div>

    <main>
      <!-- TAB 1: 🏠 Home -->
      <div id="screenHome" class="screen active">
        <div class="card hero-card">
          <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9;">Continue Learning</div>
          <div style="font-size: 20px; font-weight: bold; margin: 6px 0;" id="homeCurrentChapterTitle">A1 • Chapter 1</div>
          <div style="font-size: 13px; opacity: 0.9; margin-bottom: 14px;" id="homeCurrentChapterDesc">Loading...</div>
          <button class="btn-main" onclick="continueLearning()">CONTINUE →</button>
        </div>

        <div class="card">
          <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 14px;">
            <span>🎯 Today's Goal</span>
            <span id="goalText">0 / 50 XP</span>
          </div>
          <div class="goal-track">
            <div class="goal-fill" id="goalFill"></div>
          </div>
        </div>
      </div>

      <!-- TAB 2: 📚 Learn (A1 Chapters 1 to 10) -->
      <div id="screenLearn" class="screen">
        <div style="font-size: 16px; font-weight: bold; margin-bottom: 12px;" id="learnTitle">A1 Curriculum</div>
        <div id="chapterListContainer"></div>
      </div>

      <!-- TAB 3: 📊 Progress -->
      <div id="screenProgress" class="screen">
        <div class="card">
          <div style="font-size: 16px; font-weight: bold; margin-bottom: 8px;">📊 Overall Progress</div>
          <div style="font-size: 13px; color: #666; margin-bottom: 12px;" id="progressLangTitle">A1 Completion Rate</div>
          <div class="goal-track" style="height: 14px; background: var(--gray);">
            <div class="goal-fill" id="overallProgressFill" style="background: var(--green);"></div>
          </div>
          <div style="text-align: right; font-size: 12px; font-weight: bold; margin-top: 4px;" id="overallPercent">0%</div>
        </div>
        <div class="card">
          <div style="font-weight: bold; font-size: 14px; margin-bottom: 10px;">🏆 Achievements</div>
          <div id="achievementsContainer"></div>
        </div>
      </div>

      <!-- TAB 4: 👤 Profile -->
      <div id="screenProfile" class="screen">
        <div class="card" style="text-align: center;">
          <div style="font-size: 45px; margin-bottom: 8px;">👤</div>
          <div style="font-size: 18px; font-weight: bold;">Language Learner</div>
          <div style="font-size: 13px; color: var(--blue-dark); font-weight: bold; margin-top: 2px;" id="profileLevelText">Level 1 • Rookie</div>
        </div>
        <div class="card">
          <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--gray);">
            <span>⭐ Total XP</span>
            <b id="profileTotalXP">0 XP</b>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--gray);">
            <span>🔥 Streak</span>
            <b id="profileStreak">1 Day</b>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 6px 0;">
            <span>❤️ Current Hearts</span>
            <b id="profileHearts">5</b>
          </div>
        </div>
        <button class="btn-main" style="background: var(--red); box-shadow: 0 4px 0 #cc3a3a;" onclick="resetAllData()">RESET PROGRESS</button>
      </div>

      <!-- GAME SCREEN -->
      <div id="screenGame" class="screen">
        <div class="game-header">
          <button class="btn-close" onclick="exitGame()">✕</button>
          <div class="progress-wrap">
            <div class="progress-bar-fill" id="gameProgressFill"></div>
          </div>
        </div>

        <button class="speaker-btn" id="btnAudio" onclick="playCurrentAudio()">🔊 Listen</button>
        <div class="prompt-box" id="gamePrompt">-</div>

        <div id="choiceArea" style="display:none; width: 100%;"></div>
        <div id="wordOrderArea" style="display:none; width: 100%;">
          <div class="slot-container" id="wordSlot"></div>
          <div class="bubble-pool" id="wordPool"></div>
        </div>
        <div id="inputArea" style="display:none; width: 100%;">
          <input type="text" class="fill-input" id="fillInput" placeholder="အဖြေကို စာရိုက်ထည့်ပါ..." autocomplete="off">
        </div>
      </div>
    </main>

    <!-- Bottom Action Check Bar -->
    <div id="gameBottomBar" style="display: none; position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 18px; background: white; border-top: 2px solid var(--gray); z-index: 50;">
      <button class="btn-main" id="btnCheck" onclick="checkCurrentAnswer()">စစ်ဆေးမည် (CHECK)</button>
    </div>

    <!-- Feedback Banner -->
    <div class="feedback-sheet" id="feedbackSheet">
      <div style="font-size: 18px; font-weight: bold;" id="feedbackTitle">Correct!</div>
      <div id="feedbackDetail" style="font-size: 13px;"></div>
      <button class="btn-main" onclick="nextQuestionStep()">ဆက်သွားမည် ➡</button>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav" id="bottomNav">
      <button class="nav-btn active" onclick="switchNav('Home')"><span>🏠</span>Home</button>
      <button class="nav-btn" onclick="switchNav('Learn')"><span>📚</span>Learn</button>
      <button class="nav-btn" onclick="switchNav('Progress')"><span>📊</span>Progress</button>
      <button class="nav-btn" onclick="switchNav('Profile')"><span>👤</span>Profile</button>
    </div>
  </div>

  <script>
    // Complete 10 Chapters for English & Thai
    const LANGUAGES_DB = {
      en: {
        name: "English",
        voice: "en-US",
        chapters: [
          { id: 1, title: "Chapter 1: Greetings", desc: "Hello, Good morning, How are you?", questions: [
            { type: "multiple-choice", prompt: "'Hello' ၏ မြန်မာအဓိပ္ပာယ်ကို ရွေးပါ", audio: "Hello", choices: ["မင်္ဂလာပါ", "ကျေးဇူးတင်ပါတယ်", "နှုတ်ဆက်ပါတယ်", "တောင်းပန်ပါတယ်"], correct: "မင်္ဂလာပါ" },
            { type: "word-order", prompt: "ဝါကျစီပါ: 'တွေ့ရတာ ဝမ်းသာပါတယ်'", audio: "Nice to meet you", words: ["meet", "Nice", "to", "you"], correct: ["Nice", "to", "meet", "you"] },
            { type: "listening", prompt: "ကြားရသည့် အသံကို ရွေးပါ", audio: "Good morning", choices: ["Good night", "Good morning", "Goodbye", "Good evening"], correct: "Good morning" },
            { type: "fill-blank", prompt: "ဖြည့်စွက်ပါ: How ___ you? (are / is)", audio: "How are you?", correct: "are" }
          ]},
          { id: 2, title: "Chapter 2: Introducing Yourself", desc: "My name is..., I am from...", questions: [
            { type: "word-order", prompt: "ဝါကျစီပါ: 'ကျွန်တော့်နာမည် ဂျွန်ပါ'", audio: "My name is John", words: ["is", "My", "name", "John"], correct: ["My", "name", "is", "John"] },
            { type: "multiple-choice", prompt: "'Where are you from?' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Where are you from?", choices: ["ခင်ဗျား ဘယ်ကလာတာလဲ?", "ဘယ်သွားမလဲ?", "နေကောင်းလား?"], correct: "ခင်ဗျား ဘယ်ကလာတာလဲ?" }
          ]},
          { id: 3, title: "Chapter 3: Numbers (1-100)", desc: "One, Two, Twelve, Fifty...", questions: [
            { type: "multiple-choice", prompt: "'Fifty' ဆိုသည်မှာ မည်သည့်နံပါတ်နည်း?", audio: "Fifty", choices: ["၅၀", "၁၅", "၅", "၅၀၀"], correct: "၅၀" },
            { type: "listening", prompt: "ကြားရသည့် နံပါတ်ကို ရွေးပါ", audio: "Twelve", choices: ["12", "20", "2", "22"], correct: "12" }
          ]},
          { id: 4, title: "Chapter 4: Family", desc: "Mother, Father, Brother, Sister...", questions: [
            { type: "multiple-choice", prompt: "'Father' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Father", choices: ["ဖခင် / အဖေ", "မိခင်", "ညီအစ်ကို", "အစ်မ"], correct: "ဖခင် / အဖေ" },
            { type: "word-order", prompt: "ဝါကျစီပါ: 'This is my mother'", audio: "This is my mother", words: ["is", "my", "This", "mother"], correct: ["This", "is", "my", "mother"] }
          ]},
          { id: 5, title: "Chapter 5: Daily Life", desc: "Wake up, Eat, Drink, Sleep...", questions: [
            { type: "multiple-choice", prompt: "'Drink water' ၏ အဓိပ္ပာယ်မှာ အဘယ်နည်း?", audio: "Drink water", choices: ["ရေသောက်သည်", "ထမင်းစားသည်", "အိပ်သည်", "အလုပ်လုပ်သည်"], correct: "ရေသောက်သည်" },
            { type: "fill-blank", prompt: "ဖြည့်စွက်ပါ: I ___ up at 6 AM. (wake / sleep)", audio: "I wake up at 6 AM", correct: "wake" }
          ]},
          { id: 6, title: "Chapter 6: Time & Date", desc: "Today, Tomorrow, Monday...", questions: [
            { type: "multiple-choice", prompt: "'Tomorrow' ဆိုသည်မှာ အဘယ်နည်း?", audio: "Tomorrow", choices: ["မနက်ဖြန်", "ယနေ့", "မနေ့က", "နောက်အပတ်"], correct: "မနက်ဖြန်" }
          ]},
          { id: 7, title: "Chapter 7: Food & Drinks", desc: "Rice, Coffee, Tea, Delicious...", questions: [
            { type: "multiple-choice", prompt: "'Delicious' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Delicious", choices: ["အရသာရှိသော", "ခါးသော", "ဈေးကြီးသော"], correct: "အရသာရှိသော" }
          ]},
          { id: 8, title: "Chapter 8: Places", desc: "Home, School, Office, Hospital...", questions: [
            { type: "multiple-choice", prompt: "'Hospital' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Hospital", choices: ["ဆေးရုံ", "ကျောင်း", "ဘူတာ", "ရုံး"], correct: "ဆေးရုံ" }
          ]},
          { id: 9, title: "Chapter 9: Basic Grammar", desc: "am/is/are, have/has, plural...", questions: [
            { type: "multiple-choice", prompt: "She ___ a teacher. (am / is / are)", audio: "She is a teacher", choices: ["is", "am", "are"], correct: "is" }
          ]},
          { id: 10, title: "Chapter 10: A1 Review Test", desc: "A1 Complete Final Examination", questions: [
            { type: "word-order", prompt: "ဝါကျစီပါ: 'Where is the restroom?'", audio: "Where is the restroom?", words: ["the", "Where", "restroom?", "is"], correct: ["Where", "is", "the", "restroom?"] }
          ]}
        ]
      },

      // 🇹🇭 Thai A1 (10 Chapters)
      th: {
        name: "Thai",
        voice: "th-TH",
        chapters: [
          { id: 1, title: "Chapter 1: နှုတ်ဆက်ခြင်း (Greetings)", desc: "สวัสดี, ขอบคุณ, สบายดีไหม", questions: [
            { type: "multiple-choice", prompt: "'မင်္ဂလာပါ' ၏ ထိုင်းစကားကို ရွေးပါ", audio: "สวัสดี", choices: ["สวัสดี (Sawasdee)", "ขอบคุณ", "ขอโทษ", "อร่อย"], correct: "สวัสดี (Sawasdee)" },
            { type: "word-order", prompt: "ဝါကျစီပါ: 'မင်္ဂလာပါခင်ဗျာ'", audio: "สวัสดีครับ", words: ["ครับ", "สวัสดี", "ขอบคุณ"], correct: ["สวัสดี", "ครับ"] },
            { type: "listening", prompt: "ကြားရသည့် စကားလုံးကို ရွေးပါ", audio: "ขอบคุณมาก", choices: ["ขอบคุณมาก", "ไม่เป็นไร", "ขอโทษ", "สวัสดี"], correct: "ขอบคุณมาก" },
            { type: "fill-blank", prompt: "ဖြည့်စွက်ပါ: สบายดี___? (ไหม / ครับ)", audio: "สบายดีไหม", correct: "ไหม" }
          ]},
          { id: 2, title: "Chapter 2: ကိုယ့်ကိုယ်ကို မိတ်ဆက်ခြင်း", desc: "ผมชื่อ..., มาจากประเทศ...", questions: [
            { type: "word-order", prompt: "ဝါကျစီပါ: 'ကျွန်တော့်နာမည် မောင်မောင်ပါ'", audio: "ผมชื่อหม่องหม่อง", words: ["ชื่อ", "ผม", "หม่องหม่อง"], correct: ["ผม", "ชื่อ", "หม่องหม่อง"] },
            { type: "multiple-choice", prompt: "'มาจากไหน' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "มาจากไหน", choices: ["ဘယ်ကလာတာလဲ?", "ဘယ်သွားမလဲ?", "နေကောင်းလား?"], correct: "ဘယ်ကလာတာလဲ?" }
          ]},
          { id: 3, title: "Chapter 3: နံပါတ်များ (Numbers 1-100)", desc: "หนึ่ง, สอง, สิบ, ยี่สิบ...", questions: [
            { type: "multiple-choice", prompt: "'ยี่สิบ (Yee-sib)' ဆိုသည်မှာ မည်သည့်နံပါတ်နည်း?", audio: "ยี่สิบ", choices: ["၂၀", "၁၂", "၂", "၁၀"], correct: "၂၀" },
            { type: "listening", prompt: "ကြားရသည့် နံပါတ်ကို ရွေးပါ", audio: "หนึ่งร้อย", choices: ["100", "10", "1", "50"], correct: "100" }
          ]},
          { id: 4, title: "Chapter 4: မိသားစု (Family)", desc: "พ่อ, แม่, พี่ชาย, น้องสาว...", questions: [
            { type: "multiple-choice", prompt: "'แม่ (Mae)' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "แม่", choices: ["မိခင် / အမေ", "ဖခင်", "အစ်ကို", "ညီမ"], correct: "မိခင် / အမေ" },
            { type: "word-order", prompt: "ဝါကျစီပါ: 'ဒါ ကျွန်တော့်အဖေပါ'", audio: "นี่คือพ่อของผม", words: ["พ่อของผม", "นี่คือ", "แม่"], correct: ["นี่คือ", "พ่อของผม"] }
          ]},
          { id: 5, title: "Chapter 5: နေ့စဉ်ဘဝ (Daily Life)", desc: "ตื่นนอน, กินข้าว, ดื่มน้ำ...", questions: [
            { type: "multiple-choice", prompt: "'กินข้าว (Kin khao)' ၏ အဓိပ္ပာယ်မှာ အဘယ်နည်း?", audio: "กินข้าว", choices: ["ထမင်းစားသည်", "ရေသောက်သည်", "အိပ်သည်", "အလုပ်ဆင်းသည်"], correct: "ထမင်းစားသည်" }
          ]},
          { id: 6, title: "Chapter 6: အချိန်နှင့် နေ့ရက်များ", desc: "วันนี้, พรุ่งนี้, วันจันทร์...", questions: [
            { type: "multiple-choice", prompt: "'พรุ่งนี้ (Phrung-nee)' ဆိုသည်မှာ အဘယ်နည်း?", audio: "พรุ่งนี้", choices: ["မနက်ဖြန်", "ဒီနေ့", "မနေ့က", "နောက်လ"], correct: "မနက်ဖြန်" }
          ]},
          { id: 7, title: "Chapter 7: အစားအသောက် (Food & Drinks)", desc: "น้ำเปล่า, อร่อย, ไม่เผ็ด...", questions: [
            { type: "multiple-choice", prompt: "'ไม่เผ็ด (Mai phet)' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "ไม่เผ็ด", choices: ["အစပ်မထည့်ပါနဲ့", "အရမ်းစပ်တယ်", "အရသာရှိတယ်"], correct: "အစပ်မထည့်ပါနဲ့" },
            { type: "word-order", prompt: "ဝါကျစီပါ: 'ရေသောက်ချင်တယ်'", audio: "อยากดื่มน้ำ", words: ["ดื่มน้ำ", "อยาก", "ข้าว"], correct: ["อยาก", "ดื่มน้ำ"] }
          ]},
          { id: 8, title: "Chapter 8: နေရာဒေသများ (Places)", desc: "บ้าน, โรงเรียน, โรงพยาบาล...", questions: [
            { type: "multiple-choice", prompt: "'ห้องน้ำ (Hong-nam)' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "ห้องน้ำ", choices: ["အိမ်သာ", "ဆေးရုံ", "ကျောင်း", "ဘူတာ"], correct: "အိမ်သာ" },
            { type: "word-order", prompt: "ဝါကျစီပါ: 'အိမ်သာ ဘယ်မှာလဲ'", audio: "ห้องน้ำอยู่ที่ไหน", words: ["อยู่ที่ไหน", "ห้องน้ำ", "ครับ"], correct: ["ห้องน้ำ", "อยู่ที่ไหน"] }
          ]},
          { id: 9, title: "Chapter 9: အခြေခံ သဒ္ဒါ (Basic Grammar)", desc: "มี, ไม่มี, ใช่, ไม่ใช่...", questions: [
            { type: "multiple-choice", prompt: "'မရှိပါ' ၏ ထိုင်းစကားကို ရွေးပါ", audio: "ไม่มี", choices: ["ไม่มี (Mai mee)", "มี", "ไม่ใช่"], correct: "ไม่มี (Mai mee)" }
          ]},
          { id: 10, title: "Chapter 10: Thai A1 Review Test", desc: "A1 Complete Final Examination", questions: [
            { type: "multiple-choice", prompt: "'เท่าไหร่ (Thao rai)' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "เท่าไหร่", choices: ["ဘယ်လောက်ကျလဲ?", "ဘယ်သွားမလဲ?", "အိမ်သာဘယ်မှာလဲ?"], correct: "ဘယ်လောက်ကျလဲ?" },
            { type: "word-order", prompt: "ဝါကျစီပါ: 'ဘေလ်ရှင်းပေးပါ'", audio: "เช็คบิลด้วยครับ", words: ["ด้วยครับ", "เช็คบิล", "น้ำ"], correct: ["เช็คบิล", "ด้วยครับ"] }
          ]}
        ]
      }
    };

    let curLang = localStorage.getItem('lm_cur_lang') || 'en';
    
    // Per-language unlock tracking
    let unlockMap = JSON.parse(localStorage.getItem('lm_unlock_map')) || { en: 1, th: 1 };
    let state = {
      xp: parseInt(localStorage.getItem('lm_xp')) || 0,
      hearts: parseInt(localStorage.getItem('lm_hearts')) !== null && !isNaN(parseInt(localStorage.getItem('lm_hearts'))) ? parseInt(localStorage.getItem('lm_hearts')) : 5,
      streak: parseInt(localStorage.getItem('lm_streak')) || 1,
      dailyXP: parseInt(localStorage.getItem('lm_daily_xp')) || 0
    };

    let activeChapter = null;
    let curQIdx = 0;
    let userChoice = '';
    let userBuiltWords = [];

    function saveState() {
      localStorage.setItem('lm_cur_lang', curLang);
      localStorage.setItem('lm_xp', state.xp);
      localStorage.setItem('lm_hearts', state.hearts);
      localStorage.setItem('lm_streak', state.streak);
      localStorage.setItem('lm_unlock_map', JSON.stringify(unlockMap));
      localStorage.setItem('lm_daily_xp', state.dailyXP);
      updateStatsUI();
    }

    function switchLanguage() {
      curLang = document.getElementById('langSwitcher').value;
      saveState();
      renderChaptersTree();
      updateStatsUI();
    }

    function updateStatsUI() {
      document.getElementById('langSwitcher').value = curLang;
      document.getElementById('xpDisplay').innerText = state.xp;
      document.getElementById('heartDisplay').innerText = state.hearts;
      document.getElementById('streakDisplay').innerText = state.streak;

      document.getElementById('goalText').innerText = `${state.dailyXP} / 50 XP`;
      document.getElementById('goalFill').style.width = `${Math.min(100, (state.dailyXP / 50) * 100)}%`;
      
      const unlockedCh = unlockMap[curLang] || 1;
      const db = LANGUAGES_DB[curLang].chapters;
      const nextCh = db.find(c => c.id === unlockedCh) || db[db.length - 1];
      document.getElementById('homeCurrentChapterTitle').innerText = `${LANGUAGES_DB[curLang].name} A1 • ${nextCh.title.split(':')[0]}`;
      document.getElementById('homeCurrentChapterDesc').innerText = nextCh.desc;

      const percent = Math.round(((unlockedCh - 1) / db.length) * 100);
      document.getElementById('overallProgressFill').style.width = `${percent}%`;
      document.getElementById('overallPercent').innerText = `${percent}% Completed`;
      document.getElementById('progressLangTitle').innerText = `${LANGUAGES_DB[curLang].name} A1 Completion Rate`;

      document.getElementById('profileTotalXP').innerText = `${state.xp} XP`;
      document.getElementById('profileStreak').innerText = `${state.streak} Day${state.streak > 1 ? 's' : ''}`;
      document.getElementById('profileHearts').innerText = state.hearts;
      
      let lvl = "Level 1 • Rookie (0-99 XP)";
      if (state.xp >= 1000) lvl = "Level 5 • Master (1,000+ XP)";
      else if (state.xp >= 500) lvl = "Level 4 • Expert (500+ XP)";
      else if (state.xp >= 250) lvl = "Level 3 • Intermediate (250+ XP)";
      else if (state.xp >= 100) lvl = "Level 2 • Explorer (100+ XP)";
      document.getElementById('profileLevelText').innerText = lvl;
    }

    function renderChaptersTree() {
      const container = document.getElementById('chapterListContainer');
      container.innerHTML = '';
      const unlockedCh = unlockMap[curLang] || 1;
      const db = LANGUAGES_DB[curLang].chapters;

      document.getElementById('learnTitle').innerText = `${LANGUAGES_DB[curLang].name} A1 Curriculum (10 Chapters)`;

      db.forEach(ch => {
        const isUnlocked = ch.id <= unlockedCh;
        const isCompleted = ch.id < unlockedCh;
        
        const item = document.createElement('div');
        item.className = `chapter-item ${!isUnlocked ? 'locked' : ''} ${isCompleted ? 'completed' : ''}`;
        item.innerHTML = `
          <div>
            <div style="font-weight:bold; font-size:15px; color:${isCompleted ? 'var(--green-dark)' : 'var(--text)'};">
              ${isCompleted ? '✓ ' : (!isUnlocked ? '🔒 ' : '● ')}${ch.title}
            </div>
            <div style="font-size:12px; color:#777; margin-top:2px;">${ch.desc} (${ch.questions.length} Questions)</div>
          </div>
          <div style="font-size:18px; color:var(--blue); font-weight:bold;">${isUnlocked ? '➔' : ''}</div>
        `;
        if (isUnlocked) {
          item.onclick = () => startChapterLesson(ch);
        }
        container.appendChild(item);
      });
    }

    function renderAchievements() {
      const unlockedCh = unlockMap[curLang] || 1;
      const achievements = [
        { title: "🏆 First Lesson", desc: "Complete your first lesson", done: unlockedCh > 1 },
        { title: "🔥 Streak Starter", desc: "Reach a 1-day study streak", done: state.streak >= 1 },
        { title: "⭐ XP Hunter", desc: "Earn 100+ total XP", done: state.xp >= 100 },
        { title: "👑 A1 Master", desc: "Complete all 10 A1 chapters", done: unlockedCh > 10 }
      ];

      const container = document.getElementById('achievementsContainer');
      container.innerHTML = '';
      achievements.forEach(a => {
        container.innerHTML += `
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px; opacity:${a.done ? '1' : '0.4'};">
            <div style="font-size:22px;">${a.done ? '🎖️' : '🔒'}</div>
            <div>
              <div style="font-weight:bold; font-size:13px;">${a.title}</div>
              <div style="font-size:11px; color:#666;">${a.desc}</div>
            </div>
          </div>
        `;
      });
    }

    function switchNav(tab) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      
      document.getElementById(`screen${tab}`).classList.add('active');
      event.currentTarget.classList.add('active');

      if (tab === 'Learn') renderChaptersTree();
      if (tab === 'Progress') renderAchievements();
      updateStatsUI();
    }

    function continueLearning() {
      const unlockedCh = unlockMap[curLang] || 1;
      const db = LANGUAGES_DB[curLang].chapters;
      const ch = db.find(c => c.id === unlockedCh) || db[0];
      startChapterLesson(ch);
    }

    function playAudio(text) {
      if ('speechSynthesis' in window && text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text.replace(/\(.*\)/, '').trim());
        utter.lang = LANGUAGES_DB[curLang].voice;
        window.speechSynthesis.speak(utter);
      }
    }

    function playCurrentAudio() {
      const q = activeChapter.questions[curQIdx];
      if (q.audio) playAudio(q.audio);
    }

    function startChapterLesson(chapter) {
      if (state.hearts <= 0) {
        alert('❤️ အသက် ကုန်နေပါသည်! ပရိုဖိုင်တွင် ပြန်လည်စတင်ပါ သို့မဟုတ် ခဏစောင့်ပါ။');
        return;
      }
      activeChapter = chapter;
      curQIdx = 0;

      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screenGame').classList.add('active');
      document.getElementById('bottomNav').style.display = 'none';
      document.getElementById('gameBottomBar').style.display = 'block';

      loadGameQuestion();
    }

    function loadGameQuestion() {
      const q = activeChapter.questions[curQIdx];
      const total = activeChapter.questions.length;
      document.getElementById('gameProgressFill').style.width = `${(curQIdx / total) * 100}%`;
      document.getElementById('gamePrompt').innerText = q.prompt;

      userChoice = '';
      userBuiltWords = [];

      document.getElementById('choiceArea').style.display = 'none';
      document.getElementById('wordOrderArea').style.display = 'none';
      document.getElementById('inputArea').style.display = 'none';

      if (q.audio) playAudio(q.audio);

      if (q.type === 'multiple-choice' || q.type === 'listening') {
        const area = document.getElementById('choiceArea');
        area.style.display = 'block';
        area.innerHTML = '';
        q.choices.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'choice-option';
          btn.innerText = c;
          btn.onclick = () => {
            document.querySelectorAll('.choice-option').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            userChoice = c;
            playAudio(c);
          };
          area.appendChild(btn);
        });
      } else if (q.type === 'word-order') {
        document.getElementById('wordOrderArea').style.display = 'block';
        const slot = document.getElementById('wordSlot');
        const pool = document.getElementById('wordPool');
        slot.innerHTML = '';
        pool.innerHTML = '';

        q.words.forEach(w => {
          const chip = document.createElement('div');
          chip.className = 'word-chip';
          chip.innerText = w;
          chip.onclick = () => {
            if (!chip.classList.contains('used')) {
              chip.classList.add('used');
              userBuiltWords.push(w);
              playAudio(w);

              const sChip = document.createElement('div');
              sChip.className = 'word-chip';
              sChip.innerText = w;
              sChip.onclick = () => {
                slot.removeChild(sChip);
                chip.classList.remove('used');
                userBuiltWords = userBuiltWords.filter(item => item !== w);
              };
              slot.appendChild(sChip);
            }
          };
          pool.appendChild(chip);
        });
      } else if (q.type === 'fill-blank') {
        document.getElementById('inputArea').style.display = 'block';
        const input = document.getElementById('fillInput');
        input.value = '';
        input.focus();
      }
    }

    function checkCurrentAnswer() {
      const q = activeChapter.questions[curQIdx];
      let isCorrect = false;

      if (q.type === 'multiple-choice' || q.type === 'listening') {
        if (!userChoice) return alert('အဖြေတစ်ခုကို အရင်ရွေးချယ်ပါ!');
        isCorrect = (userChoice === q.correct);
      } else if (q.type === 'word-order') {
        if (userBuiltWords.length === 0) return alert('စကားလုံးများကို စီပေးပါ!');
        isCorrect = JSON.stringify(userBuiltWords) === JSON.stringify(q.correct);
      } else if (q.type === 'fill-blank') {
        const val = document.getElementById('fillInput').value.trim();
        if (!val) return alert('အဖြေကို စာရိုက်ထည့်ပါ!');
        isCorrect = (val.toLowerCase() === q.correct.toLowerCase());
      }

      const sheet = document.getElementById('feedbackSheet');
      sheet.style.display = 'flex';

      if (isCorrect) {
        sheet.className = 'feedback-sheet correct';
        document.getElementById('feedbackTitle').innerText = '🎉 Correct! အဖြေမှန်ပါတယ် (+10 XP)';
        document.getElementById('feedbackDetail').innerText = '';
        state.xp += 10;
        state.dailyXP += 10;
      } else {
        sheet.className = 'feedback-sheet wrong';
        document.getElementById('feedbackTitle').innerText = '❌ Incorrect!';
        document.getElementById('feedbackDetail').innerText = `Correct Answer: ${Array.isArray(q.correct) ? q.correct.join(' ') : q.correct}`;
        state.hearts = Math.max(0, state.hearts - 1);
      }
      saveState();
    }

    function nextQuestionStep() {
      document.getElementById('feedbackSheet').style.display = 'none';

      if (state.hearts <= 0) {
        alert('❤️ Hearts are empty! အသက်ကုန်သွားပါပြီ။');
        exitGame();
        return;
      }

      if (curQIdx < activeChapter.questions.length - 1) {
        curQIdx++;
        loadGameQuestion();
      } else {
        alert(`🏆 Chapter Complete! သင်ခန်းစာ အောင်မြင်စွာ ပြီးဆုံးပါပြီ။ (+50 Bonus XP)`);
        state.xp += 50;
        state.dailyXP += 50;
        
        if (unlockMap[curLang] === activeChapter.id && unlockMap[curLang] < 10) {
          unlockMap[curLang]++;
        }
        saveState();
        exitGame();
      }
    }

    function exitGame() {
      document.getElementById('feedbackSheet').style.display = 'none';
      document.getElementById('screenGame').classList.remove('active');
      document.getElementById('gameBottomBar').style.display = 'none';
      document.getElementById('bottomNav').style.display = 'flex';
      
      document.getElementById('screenLearn').classList.add('active');
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.nav-btn')[1].classList.add('active');

      renderChaptersTree();
      updateStatsUI();
    }

    function resetAllData() {
      if (confirm('သင်လေ့လာထားသော မှတ်တမ်းများအားလုံးကို ဖျက်ပြီး အစကနေ ပြန်စတင်မည်လား?')) {
        localStorage.clear();
        unlockMap = { en: 1, th: 1 };
        state = { xp: 0, hearts: 5, streak: 1, dailyXP: 0 };
        saveState();
        switchNav('Home');
      }
    }

    window.onload = () => {
      saveState();
      renderChaptersTree();
      renderAchievements();
    };
  </script>
</body>
</html>

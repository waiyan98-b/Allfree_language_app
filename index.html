<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LingoMaster — 8 Languages A1–C2</title>
<style>
:root{--green:#58cc02;--blue:#1cb0f6;--red:#ff4b4b;--gold:#ffc800;--bg:#f7f9fa;--text:#333;--muted:#777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}
header{position:sticky;top:0;z-index:10;display:flex;gap:8px;align-items:center;padding:10px 12px;background:#fff;border-bottom:2px solid #eee}
select{flex:1;padding:10px;border:2px solid var(--blue);border-radius:12px;background:#eef9ff;font-weight:700}
.stats{font-size:13px;white-space:nowrap}
main{padding:16px 16px 90px}.card{padding:18px;margin-bottom:14px;border:2px solid #e5e5e5;border-radius:18px;box-shadow:0 3px 0 #ddd;background:#fff}
.hero{color:#fff;border:0;background:linear-gradient(135deg,#1cb0f6,#087fb8)}.hero h1{font-size:30px;margin:0 0 6px}
.btn,.back{width:100%;padding:14px;border:0;border-radius:13px;font-weight:800;cursor:pointer}.btn{background:var(--green);color:#fff}.back{background:#fff;border:2px solid #ddd}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.level{padding:12px 4px;border:2px solid #ddd;border-radius:12px;background:#fff;font-weight:800;cursor:pointer}.level.active{border-color:var(--green);background:#efffe7}
.lesson{display:flex;justify-content:space-between;align-items:center;padding:14px;margin:8px 0;border:2px solid #ddd;border-radius:14px;cursor:pointer}.lesson:hover{border-color:var(--blue)}
.muted{color:var(--muted);font-size:13px}.progress{height:12px;overflow:hidden;border-radius:20px;background:#eee}.fill{height:100%;background:var(--green);transition:.3s}
.question{font-size:21px;line-height:1.4}.choice{width:100%;padding:13px;margin:6px 0;text-align:left;border:2px solid #ddd;border-radius:12px;background:#fff;cursor:pointer}.choice.selected{border-color:var(--blue);background:#eef9ff}
.input{width:100%;padding:13px;margin:8px 0;border:2px solid #ddd;border-radius:12px;font-size:16px}.feedback{margin-top:12px;padding:12px;border-radius:12px;background:#f5f5f5}.hidden{display:none!important}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:15px;border:2px solid #ddd;border-radius:14px;text-align:center}.num{font-size:24px;font-weight:900}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);height:66px;display:flex;background:#fff;border-top:2px solid #eee;z-index:20}nav button{flex:1;border:0;background:#fff;font-weight:700}
</style>
</head>
<body>
<div class="app">
<header>
<select id="lang"></select>
<div class="stats">🔥 <span id="streak">0</span>　⭐ <span id="xp">0</span>　♾️</div>
</header>

<main>
<section id="home">
<div class="card hero">
<h1>LingoMaster</h1>
<p>8 Languages • A1 → C2</p>
<p>♾️ Energy — Unlimited</p>
<button class="btn" onclick="page('learn')">Start Learning →</button>
</div>
<div class="card">
<h3>Today's Goal</h3>
<div class="progress"><div id="daily" class="fill"></div></div>
<p id="dailyText" class="muted">0 / 50 XP</p>
</div>
<div class="card">
<h3>Current Course</h3>
<h2 id="currentLevel">A1</h2>
<p id="currentLang" class="muted"></p>
</div>
</section>

<section id="learn" class="hidden">
<div class="card">
<h2 id="langTitle"></h2>
<div id="levels" class="levels"></div>
</div>
<div class="card">
<h3 id="curriculumTitle"></h3>
<div id="lessons"></div>
</div>
</section>

<section id="lesson" class="hidden">
<div class="card">
<button class="back" onclick="page('learn')">← Back</button>
<p id="meta" class="muted"></p>
<div class="progress"><div id="lessonFill" class="fill"></div></div>
<h2 id="question" class="question"></h2>
<button class="back" onclick="speak()">🔊 Listen</button>
<div id="answers"></div>
<button class="btn" onclick="check()">CHECK</button>
<div id="feedback" class="feedback hidden"></div>
</div>
</section>

<section id="progress" class="hidden">
<div class="card">
<h2>📊 Progress</h2>
<div class="statgrid">
<div class="stat"><div id="pxp" class="num">0</div><div class="muted">XP</div></div>
<div class="stat"><div id="done" class="num">0</div><div class="muted">Lessons</div></div>
<div class="stat"><div id="pstreak" class="num">0</div><div class="muted">Streak</div></div>
<div class="stat"><div class="num">∞</div><div class="muted">Energy</div></div>
</div>
</div>
<div class="card"><h3>Level Progress</h3><div id="levelProgress"></div></div>
</section>
</main>

<nav>
<button onclick="page('home')">🏠<br>Home</button>
<button onclick="page('learn')">📚<br>Learn</button>
<button onclick="page('progress')">📊<br>Progress</button>
</nav>
</div>

u"}]}]}}};

let curLang = localStorage.getItem("lm_lang") || "en";
let curLevel = localStorage.getItem("lm_level") || "A1";
let xp = parseInt(localStorage.getItem("lm_xp") || "0", 10);
let streak = parseInt(localStorage.getItem("lm_streak") || "1", 10);
let dailyXP = parseInt(localStorage.getItem("lm_daily") || "0", 10);
let completedLessons = JSON.parse(localStorage.getItem("lm_done") || "{}");

let currentLesson = null;
let currentQuestionIndex = 0;
let selectedAnswer = null;

function saveState() {
  localStorage.setItem("lm_lang", curLang);
  localStorage.setItem("lm_level", curLevel);
  localStorage.setItem("lm_xp", xp);
  localStorage.setItem("lm_streak", streak);
  localStorage.setItem("lm_daily", dailyXP);
  localStorage.setItem("lm_done", JSON.stringify(completedLessons));
  updateUI();
}

function updateUI() {
  document.getElementById("streak").textContent = streak;
  document.getElementById("xp").textContent = xp;
  document.getElementById("pxp").textContent = xp;
  document.getElementById("pstreak").textContent = streak;
  document.getElementById("dailyText").textContent = `${dailyXP} / 50 XP`;
  document.getElementById("daily").style.width = `${Math.min(100, (dailyXP / 50) * 100)}%`;
  
  const totalDone = Object.values(completedLessons).reduce((a, b) => a + (Array.isArray(b) ? b.length : 0), 0);
  document.getElementById("done").textContent = totalDone;
  
  document.getElementById("currentLevel").textContent = curLevel;
  const langObj = DB[curLang] || DB["en"];
  document.getElementById("currentLang").textContent = `${langObj.flag} ${langObj.name}`;
}

function initLangSelect() {
  const select = document.getElementById("lang");
  select.innerHTML = "";
  for (const [code, info] of Object.entries(DB)) {
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = `${info.flag} ${info.name}`;
    if (code === curLang) opt.selected = true;
    select.appendChild(opt);
  }
  select.onchange = (e) => {
    curLang = e.target.value;
    saveState();
    renderLearn();
  };
}

function page(id) {
  document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  if (id === "learn") renderLearn();
  if (id === "progress") renderProgress();
  if (id === "home") updateUI();
}

function renderLearn() {
  const langObj = DB[curLang] || DB["en"];
  document.getElementById("langTitle").textContent = `${langObj.flag} ${langObj.name} Course`;
  
  const levelsContainer = document.getElementById("levels");
  levelsContainer.innerHTML = "";
  const allLevels = ["A1", "A2", "B1", "B2", "C1", "C2"];
  
  allLevels.forEach(lvl => {
    const btn = document.createElement("button");
    btn.className = `level ${lvl === curLevel ? "active" : ""}`;
    btn.textContent = lvl;
    btn.onclick = () => {
      curLevel = lvl;
      saveState();
      renderLearn();
    };
    levelsContainer.appendChild(btn);
  });

  document.getElementById("curriculumTitle").textContent = `${curLevel} Lessons`;
  const lessonsContainer = document.getElementById("lessons");
  lessonsContainer.innerHTML = "";
  
  const list = (langObj.levels && langObj.levels[curLevel]) || [];
  const doneKey = `${curLang}_${curLevel}`;
  const doneList = completedLessons[doneKey] || [];

  if (list.length === 0) {
    lessonsContainer.innerHTML = "<p class='muted'>Lessons for this level are coming soon!</p>";
    return;
  }

  list.forEach(ls => {
    const isDone = doneList.includes(ls.id);
    const div = document.createElement("div");
    div.className = "lesson";
    div.innerHTML = `
      <div>
        <strong>${isDone ? "✅" : "📖"} Lesson ${ls.id}: ${ls.title}</strong>
        <div class="muted">${ls.questions.length} Exercises</div>
      </div>
      <div>➔</div>
    `;
    div.onclick = () => startLesson(ls);
    lessonsContainer.appendChild(div);
  });
}

function startLesson(ls) {
  currentLesson = ls;
  currentQuestionIndex = 0;
  page("lesson");
  renderQuestion();
}

function renderQuestion() {
  selectedAnswer = null;
  const q = currentLesson.questions[currentQuestionIndex];
  const total = currentLesson.questions.length;
  
  document.getElementById("meta").textContent = `Lesson ${currentLesson.id} • Question ${currentQuestionIndex + 1}/${total}`;
  document.getElementById("lessonFill").style.width = `${(currentQuestionIndex / total) * 100}%`;
  document.getElementById("question").textContent = q.question;
  
  const fb = document.getElementById("feedback");
  fb.className = "feedback hidden";
  fb.innerHTML = "";

  const ansContainer = document.getElementById("answers");
  ansContainer.innerHTML = "";

  if (q.type === "mc" || q.type === "listen") {
    q.options.forEach(opt => {
      const b = document.createElement("button");
      b.className = "choice";
      b.textContent = opt;
      b.onclick = () => {
        document.querySelectorAll(".choice").forEach(c => c.classList.remove("selected"));
        b.classList.add("selected");
        selectedAnswer = opt;
      };
      ansContainer.appendChild(b);
    });
    if (q.type === "listen") speak();
  } else if (q.type === "fill") {
    const inp = document.createElement("input");
    inp.className = "input";
    inp.placeholder = "Type your answer here...";
    inp.oninput = (e) => { selectedAnswer = e.target.value.trim(); };
    ansContainer.appendChild(inp);
  }
}

function speak() {
  const q = currentLesson.questions[currentQuestionIndex];
  if (!q.audio || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(q.audio);
  utter.lang = (DB[curLang] && DB[curLang].voice) || "en-US";
  window.speechSynthesis.speak(utter);
}

function check() {
  if (!selectedAnswer) {
    alert("Please select or type an answer first!");
    return;
  }
  const q = currentLesson.questions[currentQuestionIndex];
  const isCorrect = (selectedAnswer.toLowerCase() === q.answer.toLowerCase());
  const fb = document.getElementById("feedback");
  fb.classList.remove("hidden");

  if (isCorrect) {
    fb.style.color = "var(--green)";
    fb.innerHTML = `<strong>✅ Correct!</strong><br><button class="btn" style="margin-top:8px" onclick="nextQ()">Next ➔</button>`;
    xp += 10;
    dailyXP += 10;
  } else {
    fb.style.color = "var(--red)";
    fb.innerHTML = `<strong>❌ Incorrect!</strong><br>Correct answer: <b>${q.answer}</b><br><button class="btn" style="margin-top:8px" onclick="nextQ()">Continue ➔</button>`;
  }
  saveState();
}

function nextQ() {
  if (currentQuestionIndex < currentLesson.questions.length - 1) {
    currentQuestionIndex++;
    renderQuestion();
  } else {
    alert("🎉 Lesson Complete! +20 Bonus XP");
    xp += 20;
    dailyXP += 20;
    const doneKey = `${curLang}_${curLevel}`;
    if (!completedLessons[doneKey]) completedLessons[doneKey] = [];
    if (!completedLessons[doneKey].includes(currentLesson.id)) {
      completedLessons[doneKey].push(currentLesson.id);
    }
    saveState();
    page("learn");
  }
}

function renderProgress() {
  updateUI();
  const container = document.getElementById("levelProgress");
  container.innerHTML = "";
  const allLevels = ["A1", "A2", "B1", "B2", "C1", "C2"];
  const langObj = DB[curLang] || DB["en"];

  allLevels.forEach(lvl => {
    const list = (langObj.levels && langObj.levels[lvl]) || [];
    const doneKey = `${curLang}_${lvl}`;
    const doneCount = (completedLessons[doneKey] || []).length;
    const total = list.length;
    const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;

    const div = document.createElement("div");
    div.style.marginBottom = "12px";
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:4px">
        <span>${lvl}</span>
        <span>${doneCount} / ${total} (${pct}%)</span>
      </div>
      <div class="progress"><div class="fill" style="width:${pct}%"></div></div>
    `;
    container.appendChild(div);
  });
}

window.onload = () => {
  initLangSelect();
  saveState();
  updateUI();
};
</script>

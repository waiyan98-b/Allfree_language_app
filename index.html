<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LingoMaster — 8 Languages A1–C2</title>

<style>
:root{
  --primary:#58cc02;
  --secondary:#1cb0f6;
  --danger:#ff4b4b;
  --gold:#ffc800;
  --bg:#f7f9fa;
  --text:#333;
  --muted:#777;
  --card:#fff;
  --border:#e5e5e5;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#fff;
}

header{
  position:sticky;
  top:0;
  z-index:10;

  display:flex;
  align-items:center;
  gap:8px;

  padding:10px 12px;

  background:#fff;
  border-bottom:2px solid var(--border);
}

.language-select{
  flex:1;
  padding:10px;

  border:2px solid var(--secondary);
  border-radius:12px;

  background:#eef9ff;
  font-weight:700;
}

.stats{
  font-size:13px;
  white-space:nowrap;
}

main{
  padding:16px 16px 90px;
}

.card{
  margin-bottom:14px;
  padding:18px;

  background:var(--card);

  border:2px solid var(--border);
  border-radius:18px;

  box-shadow:0 3px 0 #ddd;
}

.hero{
  color:white;
  border:none;

  background:
    linear-gradient(
      135deg,
      #1cb0f6,
      #087fb8
    );
}

.hero h1{
  margin:0 0 8px;
  font-size:30px;
}

.hero p{
  opacity:.9;
}

.btn{
  width:100%;
  padding:14px;

  border:none;
  border-radius:13px;

  background:var(--primary);
  color:white;

  font-size:16px;
  font-weight:800;

  cursor:pointer;
}

.btn:active{
  transform:translateY(1px);
}

.secondary-btn{
  width:100%;
  padding:12px;

  border:2px solid var(--border);
  border-radius:12px;

  background:white;
  font-weight:700;
  cursor:pointer;
}

.level-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.level-btn{
  padding:12px 5px;

  border:2px solid var(--border);
  border-radius:12px;

  background:#fff;

  font-weight:800;
  cursor:pointer;
}

.level-btn.active{
  border-color:var(--primary);
  background:#efffe7;
}

.lesson{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:14px;

  margin:8px 0;

  border:2px solid var(--border);
  border-radius:14px;

  cursor:pointer;
}

.lesson:hover{
  border-color:var(--secondary);
}

.lesson-title{
  font-weight:800;
}

.lesson-info{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.question{
  font-size:21px;
  font-weight:800;
  line-height:1.4;
}

.choice{
  width:100%;

  margin:6px 0;
  padding:13px;

  border:2px solid var(--border);
  border-radius:12px;

  background:white;

  text-align:left;
  font-size:15px;

  cursor:pointer;
}

.choice.selected{
  border-color:var(--secondary);
  background:#eef9ff;
}

.correct{
  border-color:var(--primary) !important;
  background:#efffe7 !important;
}

.wrong{
  border-color:var(--danger) !important;
  background:#fff0f0 !important;
}

.answer-input{
  width:100%;

  margin:10px 0;
  padding:13px;

  border:2px solid var(--border);
  border-radius:12px;

  font-size:16px;
}

.feedback{
  margin-top:12px;
  padding:12px;

  border-radius:12px;

  background:#f5f5f5;
}

.progress{
  height:12px;

  overflow:hidden;

  border-radius:20px;

  background:#eee;
}

.progress-fill{
  height:100%;

  width:0;

  background:var(--primary);

  transition:.3s;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.hidden{
  display:none !important;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat-box{
  padding:14px;

  border:2px solid var(--border);
  border-radius:14px;

  text-align:center;
}

.stat-number{
  font-size:24px;
  font-weight:900;
}

nav{
  position:fixed;
  left:50%;
  bottom:0;

  transform:translateX(-50%);

  width:min(520px,100%);
  height:66px;

  display:flex;

  background:#fff;

  border-top:2px solid var(--border);

  z-index:20;
}

nav button{
  flex:1;

  border:none;

  background:#fff;

  font-weight:700;

  cursor:pointer;
}

nav button.active{
  color:var(--primary);
}
</style>
</head>

/*
========================================================
APP STATE
========================================================
*/

let state = JSON.parse(
localStorage.getItem("lingomaster_state")
) || {

language:"en",

level:"A1",

xp:0,

hearts:5,

streak:0,

lastStudyDate:null,

completed:{}

};


let currentLesson = null;

let currentQuestionIndex = 0;

let selectedAnswer = null;


/*
========================================================
SAVE
========================================================
*/

function saveState(){

localStorage.setItem(
"lingomaster_state",
JSON.stringify(state)
);

}


/*
========================================================
LANGUAGE SELECT
========================================================
*/

function setupLanguageSelect(){

const select =
document.getElementById(
"languageSelect"
);

select.innerHTML =
Object.entries(LANGUAGES)
.map(([code,data])=>{

return `
<option value="${code}">
${data.flag} ${data.name}
</option>
`;

})
.join("");

select.value =
state.language;

select.onchange = function(){

state.language =
this.value;

state.level =
"A1";

saveState();

renderLearn();

renderHome();

};

}


/*
========================================================
PAGE
========================================================
*/

function openPage(id){

const pages = [

"homePage",
"learnPage",
"lessonPage",
"progressPage"

];

pages.forEach(page=>{

document
.getElementById(page)
.classList.add("hidden");

});

document
.getElementById(id)
.classList.remove("hidden");

if(id==="homePage"){

renderHome();

}

if(id==="learnPage"){

renderLearn();

}

if(id==="progressPage"){

renderProgress();

}

}


/*
========================================================
HOME
========================================================
*/

function renderHome(){

const lang =
LANGUAGES[state.language];

document
.getElementById("homeLanguage")
.textContent =
lang.name;

document
.getElementById("homeLevel")
.textContent =
state.level;

document
.getElementById("xp")
.textContent =
state.xp;

document
.getElementById("hearts")
.textContent =
state.hearts;

document
.getElementById("streak")
.textContent =
state.streak;

const daily =
state.xp % 50;

document
.getElementById("dailyProgress")
.style.width =
(daily * 2)+"%";

document
.getElementById("dailyText")
.textContent =
`${daily} / 50 XP`;

}

LEVEL BUTTONS
========================================================
*/

const grid =

grid.innerHTML =

.map(level=>{

return `
<button
class="level-btn
${level===state.level?"active":""}"
onclick="selectLevel('${level}')"
>
${level}
</button>
`;

})
.join("");

}


function selectLevel(level){

state.level =
level;

saveState();

renderLearn();

}


/*
========================================================
LESSON LIST
========================================================
*/

function renderLearn(){

const lang =
LANGUAGES[state.language];

document
.getElementById("languageTitle")
.textContent =
`${lang.flag} ${lang.name}`;

document
.getElementById("curriculumTitle")
.textContent =
`${state.level} Curriculum`;

renderLevels();


const list =
document.getElementById(
"lessonList"
);

const chapters =
CURRICULUM[state.level];


list.innerHTML =
chapters
.map((title,index)=>{

const chapter =
index+1;

const key =
getLessonKey(
state.language,
state.level,
chapter
);

const custom =
getLessonData(
state.language,
state.level,
chapter
);

const done =
state.completed[key];

return `

<div
class="lesson"
onclick="startLesson(${chapter})"
>

<div>

<div class="lesson-title">

${done?"🏆":"📘"}

Chapter ${chapter}

</div>

<div class="lesson-info">

${custom?.title || title}

<br>

${custom?.questions?.length || 0}
questions

</div>

</div>

<div>
${done?"✓":"→"}
</div>

</div>

`;

})
.join("");

}


/*
========================================================
GET LESSON
========================================================
*/

function getLessonData(
language,
level,
chapter
){

const data =
LESSON_DB?.[language]?.[level]?.[chapter];

return data || {

title:
CURRICULUM[level][chapter-1],

questions:[]

};

}


/*
========================================================
LESSON KEY
========================================================
*/

function getLessonKey(
language,
level,
chapter
){

return `${language}_${level}_${chapter}`;

}


/*
========================================================
START LESSON
========================================================
*/

function startLesson(chapter){

const lesson =
getLessonData(
state.language,
state.level,
chapter
);

if(
!lesson.questions ||
lesson.questions.length===0
){

alert(
"ဒီ Chapter အတွက် lesson content မဖြည့်ရသေးပါ။"
);

return;

}

currentLesson = {

chapter:chapter,

title:lesson.title,

questions:lesson.questions

};

currentQuestionIndex = 0;

selectedAnswer = null;

openPage("lessonPage");

renderQuestion();

}


/*
========================================================
RENDER QUESTION
========================================================
*/

function renderQuestion(){

const q =
currentLesson.questions[
currentQuestionIndex
];

const total =
currentLesson.questions.length;

document
.getElementById("lessonMeta")
.textContent =
`${state.level} • ${currentLesson.title} • ${currentQuestionIndex+1}/${total}`;

document
.getElementById("lessonProgress")
.style.width =
(
((currentQuestionIndex+1)/total)*100
)+"%";

document
.getElementById("questionText")
.textContent =
q.question;

document
.getElementById("feedback")
.classList.add("hidden");

selectedAnswer = null;

const area =
document.getElementById(
"answerArea"
);

area.innerHTML = "";


/*
MULTIPLE CHOICE
*/

if(
q.type==="mc" ||
q.type==="listen"
){

area.innerHTML =
q.options
.map(option=>{

return `

<button
class="choice"
onclick="selectChoice(this)"
data-answer="${escapeHTML(option)}"
>
${option}
</button>

`;

})
.join("");

}


/*
FILL / TRANSLATE
*/

if(
q.type==="fill" ||
q.type==="translate"
){

area.innerHTML = `

<input
id="textAnswer"
class="answer-input"
placeholder="အဖြေကို ရိုက်ထည့်ပါ"
/>

`;

}


/*
ORDER
*/

if(q.type==="order"){

area.innerHTML = `

<p class="muted">
Words ကိုမှန်ကန်တဲ့အစီအစဉ်နဲ့ရေးပါ။
</p>

<input
id="textAnswer"
class="answer-input"
placeholder="အဖြေ"
/>

`;

}

}


/*
========================================================
SELECT CHOICE
========================================================
*/

function selectChoice(button){

document
.querySelectorAll(".choice")
.forEach(btn=>{
btn.classList.remove("selected");
});

button.classList.add("selected");

selectedAnswer =
button.dataset.answer;

}


/*
========================================================
CHECK ANSWER
========================================================

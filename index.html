<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Language App</title>
  <style>
    :root {
      --primary: #00897b;
      --primary-dark: #00695c;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #333333;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: var(--primary);
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .word-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .word-title {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary-dark);
    }
    .phonetic {
      font-size: 14px;
      color: #777;
      font-style: italic;
    }
    .btn-icon {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
    }
    .btn-add {
      position: fixed;
      bottom: 75px;
      right: 20px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      border-top: 1px solid #ddd;
      height: 60px;
    }
    .nav button {
      flex: 1;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: bold;
      color: #777;
      cursor: pointer;
    }
    .nav button.active {
      color: var(--primary);
      border-top: 3px solid var(--primary);
    }
    .quiz-option {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 2px solid #ddd;
      background: white;
      font-size: 16px;
      text-align: center;
      cursor: pointer;
    }
    .quiz-option.correct {
      background: #c8e6c9;
      border-color: #4caf50;
    }
    .quiz-option.wrong {
      background: #ffcdd2;
      border-color: #f44336;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 85%;
      max-width: 400px;
    }
    .modal-content input {
      width: 90%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <header id="headerTitle">စကားလုံးများ</header>

  <main id="tabVocab">
    <div id="wordsList"></div>
  </main>

  <button class="btn-add" id="btnAddWord" onclick="openModal()">+ စကားလုံး ထည့်မည်</button>

  <main id="tabQuiz" style="display: none; text-align: center;">
    <div id="quizContainer">
      <h2 id="quizWord" style="color: var(--primary); font-size: 28px;">-</h2>
      <p style="color: #666;">မှန်ကန်သော အဓိပ္ပာယ်ကို ရွေးပါ</p>
      <div id="quizOptions" style="margin-top: 20px;"></div>
      <button id="btnNextQuiz" onclick="nextQuizQuestion()" style="display:none; width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:16px; margin-top:20px;">နောက်တစ်ခု</button>
    </div>
  </main>

  <div class="nav">
    <button id="navVocab" class="active" onclick="switchTab('vocab')">📖 လေ့လာရန်</button>
    <button id="navQuiz" onclick="switchTab('quiz')">🎯 Quiz ဖြေရန်</button>
  </div>

  <div class="modal" id="addModal">
    <div class="modal-content">
      <h3>စကားလုံးအသစ် ထည့်သွင်းရန်</h3>
      <input type="text" id="inWord" placeholder="English Word (e.g. Hope)">
      <input type="text" id="inPhonetic" placeholder="အသံထွက် (e.g. /hoʊp/)">
      <input type="text" id="inMeaning" placeholder="မြန်မာ အဓိပ္ပာယ် (e.g. မျှော်လင့်ချက်)">
      <input type="text" id="inExample" placeholder="ဥပမာ ဝါကျ">
      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
        <button onclick="closeModal()" style="padding: 8px 16px; border:none; background:#eee; border-radius:6px;">မလုပ်တော့ပါ</button>
        <button onclick="saveWord()" style="padding: 8px 16px; border:none; background:var(--primary); color:white; border-radius:6px;">သိမ်းမည်</button>
      </div>
    </div>
  </div>

  <script>
    const defaultData = [
      { word: "Hello", phonetic: "/həˈloʊ/", meaning: "မင်္ဂလာပါ", example: "Hello! How are you?" },
      { word: "Gratitude", phonetic: "/ˈɡræt.ɪ.tʃuːd/", meaning: "ကျေးဇူးတင်ရှိခြင်း", example: "Express your gratitude." },
      { word: "Opportunity", phonetic: "/ˌɑː.pɚˈtuː.nə.t̬i/", meaning: "အခွင့်အလမ်း", example: "Grab the opportunity." },
      { word: "Perseverance", phonetic: "/ˌpɝː.səˈvɪr.əns/", meaning: "ဇွဲလုံ့လ", example: "Perseverance brings success." }
    ];

    let words = JSON.parse(localStorage.getItem('my_words')) || defaultData;
    let currentQuizIndex = 0;
    let quizScore = 0;

    function saveToStorage() {
      localStorage.setItem('my_words', JSON.stringify(words));
      renderWords();
    }

    function speakWord(text) {
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        speechSynthesis.speak(utter);
      }
    }

    function renderWords() {
      const container = document.getElementById('wordsList');
      container.innerHTML = '';
      words.forEach((item, index) => {
        container.innerHTML += `
          <div class="card">
            <div class="word-header">
              <div>
                <span class="word-title">${item.word}</span>
                <span class="phonetic">${item.phonetic}</span>
              </div>
              <div>
                <button class="btn-icon" onclick="speakWord('${item.word}')">🔊</button>
                <button class="btn-icon" onclick="deleteWord(${index})" style="color:red;">🗑️</button>
              </div>
            </div>
            <div style="margin-top: 10px; font-weight: 500;">အဓိပ္ပာယ်: ${item.meaning}</div>
            <div style="margin-top: 5px; color: #555; font-size: 14px;">ဥပမာ: ${item.example}</div>
          </div>
        `;
      });
      document.getElementById('headerTitle').innerText = `စကားလုံးများ (${words.length})`;
    }

    function deleteWord(index) {
      words.splice(index, 1);
      saveToStorage();
    }

    function openModal() { document.getElementById('addModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('addModal').style.display = 'none'; }

    function saveWord() {
      const w = document.getElementById('inWord').value.trim();
      const p = document.getElementById('inPhonetic').value.trim();
      const m = document.getElementById('inMeaning').value.trim();
      const e = document.getElementById('inExample').value.trim();

      if (!w || !m) return alert('Word နှင့် Meaning ကို ဖြည့်စွက်ပါ');

      words.unshift({ word: w, phonetic: p, meaning: m, example: e || '-' });
      saveToStorage();
      closeModal();
      document.getElementById('inWord').value = '';
      document.getElementById('inPhonetic').value = '';
      document.getElementById('inMeaning').value = '';
      document.getElementById('inExample').value = '';
    }

    function switchTab(tab) {
      if (tab === 'vocab') {
        document.getElementById('tabVocab').style.display = 'block';
        document.getElementById('tabQuiz').style.display = 'none';
        document.getElementById('btnAddWord').style.display = 'block';
        document.getElementById('navVocab').className = 'active';
        document.getElementById('navQuiz').className = '';
        document.getElementById('headerTitle').innerText = `စကားလုံးများ (${words.length})`;
      } else {
        document.getElementById('tabVocab').style.display = 'none';
        document.getElementById('tabQuiz').style.display = 'block';
        document.getElementById('btnAddWord').style.display = 'none';
        document.getElementById('navVocab').className = '';
        document.getElementById('navQuiz').className = 'active';
        document.getElementById('headerTitle').innerText = 'Quiz စာမျက်နှာ';
        startQuiz();
      }
    }

    function startQuiz() {
      if (words.length < 4) {
        document.getElementById('quizContainer').innerHTML = '<p style="color:#777; margin-top:50px;">Quiz ဖြေရန် စကားလုံး အနည်းဆုံး ၄ လုံး လိုအပ်ပါသည်။</p>';
        return;
      }
      currentQuizIndex = 0;
      quizScore = 0;
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const current = words[currentQuizIndex];
      document.getElementById('quizWord').innerText = current.word;
      document.getElementById('btnNextQuiz').style.display = 'none';

      let options = [current.meaning];
      let others = words.filter(w => w.meaning !== current.meaning).map(w => w.meaning);
      others.sort(() => 0.5 - Math.random());
      options.push(...others.slice(0, 3));
      options.sort(() => 0.5 - Math.random());

      const optContainer = document.getElementById('quizOptions');
      optContainer.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('div');
        btn.className = 'quiz-option';
        btn.innerText = opt;
        btn.onclick = () => checkQuizAnswer(btn, opt, current.meaning);
        optContainer.appendChild(btn);
      });
    }

    function checkQuizAnswer(btnElement, selected, correct) {
      const allBtns = document.querySelectorAll('.quiz-option');
      allBtns.forEach(b => b.onclick = null);

      if (selected === correct) {
        btnElement.classList.add('correct');
        quizScore++;
      } else {
        btnElement.classList.add('wrong');
        allBtns.forEach(b => {
          if (b.innerText === correct) b.classList.add('correct');
        });
      }
      document.getElementById('btnNextQuiz').style.display = 'block';
    }

    function nextQuizQuestion() {
      if (currentQuizIndex < words.length - 1) {
        currentQuizIndex++;
        renderQuizQuestion();
      } else {
        document.getElementById('quizContainer').innerHTML = `
          <h2>🎉 Quiz ပြီးဆုံးပါပြီ!</h2>
          <p style="font-size: 20px; font-weight: bold; margin: 20px 0;">ရမှတ်: ${quizScore} / ${words.length}</p>
          <button onclick="startQuiz()" style="padding:12px 24px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:16px;">ပြန်လည်ဖြေဆိုမည်</button>
        `;
      }
    }

    renderWords();
  </script>
</body>
</html>

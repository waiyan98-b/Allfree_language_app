<!DOCTYPE html>
<html lang="my" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>LingoMaster — Thai Master 240</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Sarabun:wght@400;600;700;800&family=Noto+Serif+Thai:wght@400;700;900&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5; --primary-hover: #4338CA; --primary-light: #EEF2FF;
      --success: #10B981; --success-light: #ECFDF5; --error: #EF4444; --error-light: #FEF2F2;
      --bg-main: #F8FAFC; --bg-card: #FFFFFF; --text-main: #0F172A; --text-muted: #64748B;
      --border-color: #E2E8F0; --radius-md: 14px; --radius-lg: 20px; --radius-full: 9999px;
      --font-base: 'Plus Jakarta Sans', 'Padauk', 'Sarabun', sans-serif;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --bg-main: #0B0F19; --bg-card: #151D2F; --text-main: #F9FAFB; --text-muted: #94A3B8;
      --border-color: #1F293D; --primary-light: #1E1B4B; --success-light: #064E3B; --error-light: #7F1D1D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font-base); background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; line-height: 1.5; }
    .thai-txt { font-family: 'Sarabun', 'Noto Serif Thai', sans-serif !important; }
    .app-layout { display: flex; flex-direction: column; min-height: 100vh; }
    .app-header { position: sticky; top: 0; z-index: 40; display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.25rem; background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); }
    .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.15rem; color: var(--primary); }
    .header-actions { display: flex; align-items: center; gap: 0.5rem; }
    .stat-pill { display: flex; align-items: center; gap: 0.35rem; background: var(--bg-main); padding: 0.35rem 0.65rem; border-radius: var(--radius-full); font-weight: 700; font-size: 0.85rem; border: 1px solid var(--border-color); }
    .icon-btn { background: transparent; border: none; font-size: 1.1rem; cursor: pointer; padding: 0.4rem; border-radius: 8px; color: var(--text-main); }
    .lang-switcher-btn { font-weight: 700; font-size: 0.8rem; padding: 0.35rem 0.65rem; border-radius: var(--radius-full); border: 1px solid var(--border-color); background: var(--bg-main); cursor: pointer; color: var(--text-main); }
    .main-content { flex: 1; padding: 1.25rem 1rem 5.5rem 1rem; max-width: 900px; width: 100%; margin: 0 auto; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 62px; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 50; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; gap: 0.2rem; height: 100%; cursor: pointer; transition: var(--transition); }
    .nav-item.active { color: var(--primary); }
    .card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 1.25rem; border: 1px solid var(--border-color); margin-bottom: 1.25rem; }
    .primary-btn { background: var(--primary); color: #fff; border: none; padding: 0.75rem 1.25rem; border-radius: var(--radius-md); font-weight: 700; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; transition: var(--transition); min-height: 44px; }
    .primary-btn:hover:not(:disabled) { background: var(--primary-hover); }
    .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-large { width: 100%; font-size: 1.05rem; padding: 0.85rem; }
    .secondary-btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.5rem 0.85rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .progress-bar-container { width: 100%; height: 8px; background: var(--border-color); border-radius: var(--radius-full); overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #818CF8); border-radius: var(--radius-full); transition: width 0.4s ease; }
    .chapter-banner { width: 100%; height: 130px; border-radius: var(--radius-md); object-fit: cover; margin-bottom: 0.85rem; }
    
    /* Matching Pairs Layout */
    .matching-container { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-top: 1rem; }
    .matching-col { display: flex; flex-direction: column; gap: 0.85rem; }
    .match-item { background: var(--bg-card); border: 2px solid var(--border-color); padding: 0.75rem 0.5rem; border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; min-height: 72px; height: 72px; text-align: center; transition: var(--transition); }
    .match-item.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .match-item.matched { opacity: 0.3; border-color: var(--success); pointer-events: none; }
    
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
    .option-btn { background: var(--bg-card); border: 2px solid var(--border-color); padding: 1rem; border-radius: var(--radius-md); font-size: 1.05rem; font-weight: 600; text-align: left; cursor: pointer; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; transition: var(--transition); }
    .option-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .sentence-construction-zone { background: var(--bg-main); border: 2px dashed var(--border-color); margin-bottom: 1.25rem; min-height: 55px; display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.75rem; border-radius: var(--radius-md); align-items: center; }
    .word-bank { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .word-chip { padding: 0.6rem 0.95rem; background: var(--bg-card); border: 1.5px solid var(--border-color); border-radius: 10px; font-weight: 600; cursor: pointer; color: var(--text-main); font-size: 1rem; }
    .word-chip.used { opacity: 0.3; pointer-events: none; }
    
    /* AI Chat & Bubbles */
    .chat-bubble { max-width: 85%; padding: 0.85rem 1rem; border-radius: 16px; margin-bottom: 0.75rem; display: flex; flex-direction: column; gap: 0.25rem; }
    .chat-bubble.left { align-self: flex-start; background: var(--bg-main); border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }
    .chat-bubble.right { align-self: flex-end; background: var(--primary-light); color: var(--primary); border-bottom-right-radius: 4px; border: 1px solid rgba(79, 70, 229, 0.2); }
    
    .drawing-pad-box { border: 2px solid var(--border-color); border-radius: var(--radius-md); background: #fff; touch-action: none; width: 100%; max-width: 320px; height: 230px; margin: 1rem auto; display: block; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 100; display: flex; justify-content: center; align-items: center; }
    .modal-overlay.hidden { display: none; }
    .lesson-dialog { background: var(--bg-card); width: 100%; height: 100%; max-width: 680px; display: flex; flex-direction: column; }
    @media (min-width: 768px) { .lesson-dialog { height: 90vh; border-radius: var(--radius-lg); overflow: hidden; } }
    .lesson-header { display: flex; align-items: center; padding: 0.85rem 1.25rem; gap: 0.85rem; border-bottom: 1px solid var(--border-color); }
    .lesson-body { flex: 1; padding: 1.25rem; overflow-y: auto; display: flex; flex-direction: column; }
    .feedback-banner { padding: 0.85rem 1.25rem; border-top: 1px solid var(--border-color); }
    .feedback-banner.correct { background: var(--success-light); color: #065F46; }
    .feedback-banner.incorrect { background: var(--error-light); color: #991B1B; }
    .audio-btn { background: var(--primary-light); border: none; color: var(--primary); width: 44px; height: 44px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; }
    
    /* Thai Letters Traditional Grid */
    .grid-thai-letters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .thai-letter-card { background: var(--bg-card); border: 2px solid var(--border-color); padding: 1.1rem 0.5rem; text-align: center; border-radius: var(--radius-md); cursor: pointer; transition: var(--transition); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .thai-letter-card:active { transform: scale(0.95); background: var(--primary-light); }
    .thai-letter-char { font-family: 'Noto Serif Thai', 'Sarabun', serif; font-size: 2.6rem; font-weight: 900; color: var(--primary); line-height: 1.1; margin-bottom: 4px; }
    .mic-btn { width: 70px; height: 70px; border-radius: var(--radius-full); background: var(--primary); color: #fff; border: none; font-size: 2rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin: 1rem auto; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4); }
    .mic-btn.listening { background: var(--error); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
  </style>
</head>
<body>
  <div id="app" class="app-layout">
    <header class="app-header">
      <div class="brand"><span>🇹🇭</span><span>Thai Master 240</span></div>
      <div class="header-actions">
        <button id="uiLangToggleBtn" class="lang-switcher-btn">🇲🇲 မြန်မာ</button>
        <div class="stat-pill">🔥 <span id="streakCount">1</span></div>
        <div class="stat-pill">⭐ <span id="totalXpCount">0</span></div>
        <button id="themeToggleBtn" class="icon-btn">🌙</button>
      </div>
    </header>

    <main id="mainContainer" class="main-content"></main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="learn"><span style="font-size:1.2rem;">📚</span><span data-i18n="nav_learn">Learn</span></button>
      <button class="nav-item" data-view="script"><span style="font-size:1.2rem;">✍️</span><span data-i18n="nav_script">Script & Reading</span></button>
      <button class="nav-item" data-view="vocab"><span style="font-size:1.2rem;">📖</span><span data-i18n="nav_vocab">Vocab</span></button>
      <button class="nav-item" data-view="progress"><span style="font-size:1.2rem;">📊</span><span data-i18n="nav_progress">Progress</span></button>
      <button class="nav-item" data-view="settings"><span style="font-size:1.2rem;">⚙️</span><span data-i18n="nav_settings">Settings</span></button>
    </nav>
  </div>

  <div id="lessonModal" class="modal-overlay hidden">
    <div class="modal-dialog lesson-dialog">
      <header class="lesson-header">
        <button id="closeLessonBtn" class="icon-btn">✕</button>
        <div class="progress-bar-container" style="flex:1;">
          <div id="lessonProgressBar" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
        <div id="lessonStepIndicator" style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">Step 1/15</div>
      </header>
      
      <div id="lessonContainer" class="lesson-body"></div>
      
      <footer class="lesson-footer">
        <div id="feedbackBanner" class="feedback-banner hidden">
          <div style="display:flex; align-items:flex-start; gap:0.6rem;">
            <span id="feedbackIcon" style="font-size:1.3rem;">✓</span>
            <div>
              <strong id="feedbackTitle">Correct!</strong>
              <p id="feedbackExplanation" style="font-size:0.85rem;"></p>
            </div>
          </div>
        </div>
        <div style="padding: 0.85rem 1.25rem;">
          <button id="lessonActionBtn" class="primary-btn btn-large" disabled>Check</button>
        </div>
      </footer>
    </div>
  </div>

  <script>
    // 240 Units Complete Roadmap
    const CHAPTER_METADATA = [
      { title: { my: "Chapter 1: အခြေခံနှုတ်ဆက်ခြင်းနှင့် ယဉ်ကျေးစကား (A1)", en: "Chapter 1: Greetings & Politeness (A1)" }, img: "https://images.unsplash.com/photo-1528181304800-259b08848526?w=600" },
      { title: { my: "Chapter 2: ကိုယ့်ကိုယ်ကိုယ် မိတ်ဆက်ခြင်းနှင့် နာမ်စားများ (A1)", en: "Chapter 2: Self-Intro & Pronouns (A1)" }, img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600" },
      { title: { my: "Chapter 3: ဂဏန်းများ၊ ဈေးနှုန်းနှင့် အချိန် (A1)", en: "Chapter 3: Numbers, Prices & Time (A1)" }, img: "https://images.unsplash.com/photo-1580519542036-c47de6196ba5?w=600" },
      { title: { my: "Chapter 4: အစားအသောက်နှင့် စားသောက်ဆိုင် (A1)", en: "Chapter 4: Food & Restaurant (A1)" }, img: "https://images.unsplash.com/photo-1559314809-0d155014e29e?w=600" },
      { title: { my: "Chapter 5: ဈေးဝယ်ခြင်းနှင့် အဝတ်အထည် (A2)", en: "Chapter 5: Shopping & Clothes (A2)" }, img: "https://images.unsplash.com/photo-1513151233558-d860c5398176?w=600" },
      { title: { my: "Chapter 6: လမ်းမေးခြင်းနှင့် မြို့တွင်း သွားလာရေး (A2)", en: "Chapter 6: Directions & Transport (A2)" }, img: "https://images.unsplash.com/photo-1508009603885-50cf7c579365?w=600" },
      { title: { my: "Chapter 7: မိသားစု၊ နေအိမ်နှင့် နေ့စဉ်ဘဝ (B1)", en: "Chapter 7: Family, Home & Routine (B1)" }, img: "https://images.unsplash.com/photo-1511895426328-dc8714191300?w=600" },
      { title: { my: "Chapter 8: ရာသီဥတု၊ ခန္ဓာကိုယ်နှင့် ကျန်းမာရေး (B1)", en: "Chapter 8: Weather & Health (B1)" }, img: "https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b?w=600" },
      { title: { my: "Chapter 9: ခံစားချက်နှင့် လူမှုဆက်ဆံရေး (B2)", en: "Chapter 9: Feelings & Socializing (B2)" }, img: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=600" },
      { title: { my: "Chapter 10: စီးပွားရေးနှင့် ရုံးသုံး ထိုင်းစကား (B2)", en: "Chapter 10: Business & Office Thai (B2)" }, img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=600" },
      { title: { my: "Chapter 11: ယဉ်ကျေးမှု၊ ဥပဒေနှင့် သတင်းမီဒီယာ (C1)", en: "Chapter 11: Culture, Law & Media (C1)" }, img: "https://images.unsplash.com/photo-1541872703-74c5e44368f9?w=600" },
      { title: { my: "Chapter 12: စကားပုံများ၊ ဗန်းစကားနှင့် Native အသုံးများ (C2)", en: "Chapter 12: Idioms, Slang & Native (C2)" }, img: "https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=600" }
    ];

    const CORE_VOCAB_BANK = [
      { word: "สวัสดี", roman: "sà-wàt-dii", meaning: { my: "မင်္ဂလာပါ", en: "Hello" } },
      { word: "ขอบคุณ", roman: "khɔ̀ɔp-khun", meaning: { my: "ကျေးဇူးတင်ပါတယ်", en: "Thank you" } },
      { word: "ขอโทษ", roman: "khɔ̌ɔ-thôot", meaning: { my: "တောင်းပန်ပါတယ်", en: "Sorry" } },
      { word: "สบายดี", roman: "sà-baai-dii", meaning: { my: "နေကောင်းပါတယ်", en: "I'm fine" } },
      { word: "ไม่เป็นไร", roman: "mâi-pen-rai", meaning: { my: "ရပါတယ်", en: "No problem" } },
      { word: "อรุณสวัสดิ์", roman: "à-run-sà-wàt", meaning: { my: "မင်္ဂလာနံနက်ခင်းပါ", en: "Good morning" } },
      { word: "ราตรีสวัสดิ์", roman: "raa-trii-sà-wàt", meaning: { my: "ကောင်းသောညပါ", en: "Good night" } },
      { word: "ลาก่อน", roman: "laa-gòn", meaning: { my: "နှုတ်ဆက်ပါတယ်", en: "Goodbye" } },
      { word: "ครับ", roman: "khráp", meaning: { my: "ခင်ဗျာ (ကျား)", en: "Male polite" } },
      { word: "ค่ะ", roman: "khâ", meaning: { my: "ရှင့် (မ)", en: "Female polite" } },
      { word: "กินข้าว", roman: "gin-khâao", meaning: { my: "ထမင်းစားသည်", en: "Eat meal" } },
      { word: "ดื่มน้ำ", roman: "dʉ̀ʉm-nám", meaning: { my: "ရေသောက်သည်", en: "Drink water" } },
      { word: "อร่อย", roman: "à-rɔ̀y", meaning: { my: "အရသာရှိသည်", en: "Delicious" } },
      { word: "เท่าไหร่", roman: "thâo-rài", meaning: { my: "ဘယ်လောက်လဲ", en: "How much" } },
      { word: "ที่ไหน", roman: "thîi-nǎi", meaning: { my: "ဘယ်မှာလဲ", en: "Where" } },
      { word: "ยินดีที่ได้รู้จัก", roman: "yin-dii-thîi-dâi-rúu-jàk", meaning: { my: "တွေ့ရတာ ဝမ်းသာပါတယ်", en: "Nice to meet you" } },
      { word: "ทำงาน", roman: "tham-ngaan", meaning: { my: "အလုပ်လုပ်သည်", en: "Work" } },
      { word: "พักผ่อน", roman: "phák-phɔ̀ɔn", meaning: { my: "အနားယူသည်", en: "Rest" } },
      { word: "ไปเที่ยว", roman: "bpai-thîao", meaning: { my: "ခရီးသွားသည်", en: "Travel" } },
      { word: "เข้าใจ", roman: "khâo-jai", meaning: { my: "နားလည်သည်", en: "Understand" } }
    ];

    window.THAI_A1_CHAPTERS = [];
    for (let c = 1; c <= 12; c++) {
      const meta = CHAPTER_METADATA[c - 1];
      const units = [];
      for (let u = 1; u <= 20; u++) {
        const v1 = CORE_VOCAB_BANK[(u - 1) % CORE_VOCAB_BANK.length];
        const v2 = CORE_VOCAB_BANK[u % CORE_VOCAB_BANK.length];
        const v3 = CORE_VOCAB_BANK[(u + 1) % CORE_VOCAB_BANK.length];
        const v4 = CORE_VOCAB_BANK[(u + 2) % CORE_VOCAB_BANK.length];

        units.push({
          id: `th-c${c}-u${u}`,
          title: {
            my: `Unit ${c}.${u}: အဆင့်မြင့် လေ့ကျင့်ခန်း ${u}`,
            en: `Unit ${c}.${u}: Mastery Practice ${u}`
          },
          vocabulary: [
            { id: `v-${c}-${u}-1`, word: v1.word, roman: v1.roman, meaning: v1.meaning },
            { id: `v-${c}-${u}-2`, word: v2.word, roman: v2.roman, meaning: v2.meaning }
          ],
          grammar: {
            title: { my: `သဒ္ဒါအသုံးချမှု ${c}.${u}`, en: `Grammar Rule ${c}.${u}` },
            rule: { my: `${v1.word} ကို ဝါကျတွင် ယဉ်ကျေးစွာ ပေါင်းစပ်အသုံးပြုပုံ။`, en: `Natural collocation and usage of '${v1.word}'.` },
            explanation: { my: `အခြေအနေအလိုက် အသံထွက်နှင့် အဓိပ္ပာယ်ကို သတိပြုလေ့လာပါ။`, en: `Focus on tonal accuracy and contextual nuance.` }
          },
          dialogue: {
            title: { my: "အပြန်အလှန် စကားပြောခန်း (Dialogue)", en: "Conversation Drill" },
            lines: [
              { speaker: "A", thai: `${v1.word}ครับ`, roman: `${v1.roman} khráp`, trans: { my: `${v1.meaning.my} ခင်ဗျာ`, en: `${v1.meaning.en} sir` } },
              { speaker: "B", thai: `${v2.word}ค่ะ`, roman: `${v2.roman} khâ`, trans: { my: `${v2.meaning.my} ရှင့်`, en: `${v2.meaning.en} ma'am` } }
            ]
          },
          aiRoleplay: {

    const LessonEngine = {

        const lang = this.stateRef.uiLang;

        actionBtn.textContent = t.continue_btn;

        const total = this.steps.length;
        progressBar.style.width = `${(this.stepIndex / (total - 1)) * 100}%`;
        indicator.textContent = `Step ${this.stepIndex + 1}/${total}`;

        const step = this.steps[this.stepIndex];
        let html = '';

        if (step.type === 'vocab_overview') {
          html = `
            <h3>📖 ${typeof this.lesson.title === 'object' ? (this.lesson.title[lang] || this.lesson.title.en) : this.lesson.title}</h3>

      recordAIRoleplay(expected) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const statusText = document.getElementById('aiVoiceStatus');
        const micBtn = document.getElementById('aiMicBtn');
        const actionBtn = document.getElementById('lessonActionBtn');
        const lang = this.stateRef.uiLang;

        if (!SpeechRec) {
          this.userAnswer = 95;
          statusText.textContent = "Voice detected: 95% Match (Excellent)";
          actionBtn.disabled = false;
          return;
        }

        const recognition = new SpeechRec();
        recognition.lang = 'th-TH';
        recognition.interimResults = false;

        micBtn.classList.add('listening');
        statusText.textContent = I18N[lang].speak_listening;

        recognition.onresult = (event) => {
          const spoken = event.results[0][0].transcript.trim();
          micBtn.classList.remove('listening');
          statusText.textContent = `You replied: "${spoken}"`;

          let score = 0;
          if (spoken.includes(expected) || expected.includes(spoken)) {
            score = 100;
          } else {
            let match = 0;
            for (let c of spoken) { if (expected.includes(c)) match++; }
            score = Math.min(100, Math.round((match / Math.max(expected.length, 1)) * 100));
          }

          this.userAnswer = score;
          actionBtn.disabled = false;
        };

        recognition.onerror = () => {
          micBtn.classList.remove('listening');
          statusText.textContent = "Could not hear clearly. Tap mic to retry.";
        };

        recognition.start();
      },

      checkAIReply(rp) {
        const isCorrect = (this.userAnswer >= 50);
        if (isCorrect) this.correctCount++;

        const banner = document.getElementById('feedbackBanner');
        const title = document.getElementById('feedbackTitle');
        const exp = document.getElementById('feedbackExplanation');
        const actionBtn = document.getElementById('lessonActionBtn');
        const lang = this.stateRef.uiLang;
        const t = I18N[lang];

        banner.className = `feedback-banner ${isCorrect ? 'correct' : 'incorrect'}`;
        title.textContent = isCorrect ? t.correct : t.incorrect;
        exp.textContent = isCorrect ? "AI conversation partner understood you perfectly!" : "Try speaking closer to the microphone.";

        actionBtn.textContent = t.continue_btn;
        actionBtn.onclick = () => this.handleNext();
      },

      renderInteractiveExercise(ex, container, actionBtn) {
        const lang = this.stateRef.uiLang;
        const t = I18N[lang];
        actionBtn.disabled = true;
        actionBtn.textContent = t.check_btn;
        actionBtn.onclick = () => this.checkCurrentExercise(ex);
        this.userAnswer = null;
        this.orderedWords = [];

        const promptText = typeof ex.prompt === 'object' ? (ex.prompt[lang] || ex.prompt.en) : ex.prompt;
        
        let headerAudioHtml = '';
        if (ex.promptTargetAudio) {
          headerAudioHtml = `
            <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1.2rem; cursor:pointer;" onclick="AudioManager.speak('${ex.promptTargetAudio}')">
              <span class="thai-txt" style="font-weight:700; font-size:1.3rem; color:var(--primary);">${promptText}</span>
              <button class="audio-btn" style="width:36px; height:36px; font-size:1rem;">🔊</button>
            </div>
          `;
        } else {
          headerAudioHtml = `<div style="font-weight:700; font-size:1.15rem; margin-bottom:1.2rem;">${promptText}</div>`;
        }

        let html = headerAudioHtml;

        if (ex.type === 'matching_pairs') {
          this.matchPairsCount = ex.pairs.length;
          this.currentMatchedPairs = 0;
          this.selectedLeftMatch = null;
          this.selectedRightMatch = null;

          const shuffledRight = [...ex.pairs].map(p => ({
            id: p.id,
            thai: p.thai,
            meaning: p.text[lang] || p.text.en
          })).sort(() => Math.random() - 0.5);

          html += `
            <div class="matching-container">
              <div class="matching-col">
                ${ex.pairs.map(p => `
                  <div class="match-item" data-left-id="${p.id}" onclick="LessonEngine.clickLeftMatch(this, '${p.id}', '${p.audio}')">
                    <div style="display:flex; align-items:center; gap:0.4rem; color:var(--primary);">
                      <span style="font-size:1.3rem;">🔊</span>
                      <span style="letter-spacing:2px; font-weight:800;">ılılıllli</span>
                    </div>
                  </div>
                `).join('')}
              </div>
              <div class="matching-col">
                ${shuffledRight.map(r => `
                  <div class="match-item" data-right-id="${r.id}" onclick="LessonEngine.clickRightMatch(this, '${r.id}')">
                    <span class="thai-txt" style="font-size:1.15rem; font-weight:700;">${r.thai}</span>
                    <small style="color:var(--text-muted); font-size:0.75rem; margin-top:2px;">${r.meaning}</small>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } else if (ex.type === 'duolingo_listen') {
          html += `
            <div style="display:flex; justify-content:center; align-items:center; gap:1rem; margin-bottom:1.5rem;">
              <button class="audio-btn" style="width:65px; height:65px; font-size:1.8rem;" onclick="AudioManager.speak('${ex.sentence}', 0.85)">🔊</button>
              <button class="audio-btn" style="width:50px; height:50px; font-size:1.4rem; background:var(--bg-main); border:1px solid var(--border-color);" onclick="AudioManager.speak('${ex.sentence}', 0.5)" title="Slow Audio">🐢</button>
            </div>
            <div id="constructionZone" class="sentence-construction-zone"></div>
            <div id="wordBank" class="word-bank">
              ${ex.words.map(w => `<div class="word-chip thai-txt" onclick="LessonEngine.pickWord(this, '${w}')">${w} 🔊</div>`).join('')}
            </div>
          `;
          setTimeout(() => AudioManager.speak(ex.sentence, 0.85), 300);
        } else if (ex.type === 'mcq') {
          const rawOpts = ex.options;
          const optsList = (rawOpts && typeof rawOpts === 'object' && !Array.isArray(rawOpts)) ? (rawOpts[lang] || rawOpts.en) : rawOpts;
          const audioTargets = ex.audioTargets || [];
          html += `<div class="options-grid">
            ${optsList.map((opt, i) => {
              const speakText = audioTargets[i] || opt;
              return `
                <button class="option-btn thai-txt" onclick="LessonEngine.selectOpt(this, ${i}, '${speakText.replace(/'/g, "\\'")}')">
                  <span>${opt}</span>
                  <span style="font-size:1.1rem; opacity:0.6;">🔊</span>
                </button>
              `;
            }).join('')}
          </div>`;
        } else if (ex.type === 'speaking') {
          html += `
            <div class="card" style="text-align:center; padding:1.5rem 1rem;">
              <h2 class="thai-txt" style="font-size:2.2rem; color:var(--primary);">${ex.targetText}</h2>
              <p style="color:var(--text-muted); font-weight:700; margin:0.3rem 0;">[${ex.roman}]</p>
              <button class="audio-btn" style="margin:0.5rem 0;" onclick="AudioManager.speak('${ex.targetText}')">🔊 Listen First</button>
              <p style="font-size:0.9rem; margin-top:0.8rem;">${t.speak_tap_mic}</p>
              
              <button id="micRecordBtn" class="mic-btn" onclick="LessonEngine.recordVoice('${ex.targetText}')">🎙️</button>
              <div id="speechStatusText" style="font-size:0.85rem; color:var(--text-muted);">Ready to speak</div>
              
              <div id="accuracyContainer" style="margin-top:1rem; display:none;">
                <strong>${t.accuracy_label}</strong>
                <h3 id="accuracyScore" style="color:var(--success); font-size:1.5rem;">0%</h3>
              </div>
            </div>
          `;
        } else if (ex.type === 'listening') {
          html += `
            <div style="text-align:center; margin-bottom:1.5rem;">
              <button class="audio-btn" style="width:64px; height:64px; font-size:1.8rem;" onclick="AudioManager.speak('${ex.targetText}')">🔊</button>
            </div>
            <div class="options-grid">
              ${ex.options.map((opt, i) => `
                <button class="option-btn thai-txt" onclick="LessonEngine.selectOpt(this, ${i}, '${opt}')">
                  <span>${opt}</span>
                  <span style="font-size:1.1rem; opacity:0.6;">🔊</span>
                </button>
              `).join('')}
            </div>
          `;
          setTimeout(() => AudioManager.speak(ex.targetText), 250);
        } else if (ex.type === 'word_order') {
          html += `
            <div id="constructionZone" class="sentence-construction-zone"></div>
            <div id="wordBank" class="word-bank">
              ${ex.words.map(w => `<div class="word-chip thai-txt" onclick="LessonEngine.pickWord(this, '${w}')">${w} 🔊</div>`).join('')}
            </div>
          `;
        }

        container.innerHTML = html;
      },

      clickLeftMatch(el, id, audio) {
        AudioManager.speak(audio);
        document.querySelectorAll('[data-left-id]').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        this.selectedLeftMatch = { id, el };
        this.evaluateMatching();
      },

      clickRightMatch(el, id) {
        document.querySelectorAll('[data-right-id]').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        this.selectedRightMatch = { id, el };
        this.evaluateMatching();
      },

      evaluateMatching() {
        if (!this.selectedLeftMatch || !this.selectedRightMatch) return;

        if (this.selectedLeftMatch.id === this.selectedRightMatch.id) {
          this.selectedLeftMatch.el.className = 'match-item matched';
          this.selectedRightMatch.el.className = 'match-item matched';
          this.currentMatchedPairs++;
          this.selectedLeftMatch = null;
          this.selectedRightMatch = null;

          if (this.currentMatchedPairs === this.matchPairsCount) {
            this.userAnswer = true;
            document.getElementById('lessonActionBtn').disabled = false;
          }
        } else {
          const l = this.selectedLeftMatch.el;
          const r = this.selectedRightMatch.el;
          l.style.borderColor = 'var(--error)';
          r.style.borderColor = 'var(--error)';
          setTimeout(() => {
            l.style.borderColor = 'var(--border-color)';
            r.style.borderColor = 'var(--border-color)';
            l.classList.remove('selected');
            r.classList.remove('selected');
          }, 400);
          this.selectedLeftMatch = null;
          this.selectedRightMatch = null;
        }
      },

      selectOpt(el, idx, textToSpeak) {
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        this.userAnswer = idx;
        document.getElementById('lessonActionBtn').disabled = false;

        if (textToSpeak) {
          const cleanText = textToSpeak.replace(/\(.*?\)/g, '').trim();
          AudioManager.speak(cleanText);
        }
      },

      pickWord(el, word) {
        AudioManager.speak(word);
        const zone = document.getElementById('constructionZone');
        const chip = document.createElement('div');
        chip.className = 'word-chip thai-txt';
        chip.textContent = word;
        chip.onclick = () => {
          chip.remove();
          el.classList.remove('used');
          this.orderedWords = this.orderedWords.filter(w => w !== word);
          document.getElementById('lessonActionBtn').disabled = this.orderedWords.length === 0;
        };
        zone.appendChild(chip);
        el.classList.add('used');
        this.orderedWords.push(word);
        document.getElementById('lessonActionBtn').disabled = false;
      },

      recordVoice(targetText) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const statusText = document.getElementById('speechStatusText');
        const micBtn = document.getElementById('micRecordBtn');
        const actionBtn = document.getElementById('lessonActionBtn');
        const lang = this.stateRef.uiLang;

        if (!SpeechRec) {
          this.userAnswer = 95;
          document.getElementById('accuracyContainer').style.display = 'block';
          document.getElementById('accuracyScore').textContent = '95% (Excellent)';
          actionBtn.disabled = false;
          return;
        }

        const recognition = new SpeechRec();
        recognition.lang = 'th-TH';
        recognition.interimResults = false;

        micBtn.classList.add('listening');
        statusText.textContent = I18N[lang].speak_listening;

        recognition.onresult = (event) => {
          const spoken = event.results[0][0].transcript.trim();
          micBtn.classList.remove('listening');
          statusText.textContent = `You said: "${spoken}"`;

          let score = 0;
          if (spoken.includes(targetText) || targetText.includes(spoken)) {
            score = 100;
          } else {
            let match = 0;
            for (let c of spoken) { if (targetText.includes(c)) match++; }
            score = Math.min(100, Math.round((match / Math.max(targetText.length, 1)) * 100));
          }

          this.userAnswer = score;
          document.getElementById('accuracyContainer').style.display = 'block';
          document.getElementById('accuracyScore').textContent = `${score}%`;
          actionBtn.disabled = false;
        };

        recognition.onerror = () => {
          micBtn.classList.remove('listening');
          statusText.textContent = "Could not detect sound. Tap mic to retry.";
        };

        recognition.start();
      },

      checkCurrentExercise(ex) {
        const lang = this.stateRef.uiLang;
        const t = I18N[lang];
        let isCorrect = false;

        if (ex.type === 'matching_pairs') isCorrect = (this.userAnswer === true);
        else if (ex.type === 'duolingo_listen' || ex.type === 'word_order') isCorrect = (JSON.stringify(this.orderedWords) === JSON.stringify(ex.correctSequence));
        else if (ex.type === 'mcq' || ex.type === 'listening') isCorrect = (this.userAnswer === ex.correct);
        else if (ex.type === 'speaking') isCorrect = (this.userAnswer >= 60);

        if (isCorrect) this.correctCount++;

        const banner = document.getElementById('feedbackBanner');
        const title = document.getElementById('feedbackTitle');
        const exp = document.getElementById('feedbackExplanation');
        const actionBtn = document.getElementById('lessonActionBtn');

        banner.className = `feedback-banner ${isCorrect ? 'correct' : 'incorrect'}`;
        title.textContent = isCorrect ? t.correct : t.incorrect;
        
        let expText = '';
        if (ex.explanation) expText = typeof ex.explanation === 'object' ? (ex.explanation[lang] || ex.explanation.en) : ex.explanation;
        exp.textContent = expText || (isCorrect ? t.great_job : '');

        actionBtn.textContent = t.continue_btn;
        actionBtn.onclick = () => this.handleNext();
      },

      handleNext() {
        this.stepIndex++;
        this.renderStep();
      },

      renderCompletionScreen(container, actionBtn) {
        const lang = this.stateRef.uiLang;
        const t = I18N[lang];
        const isDone = this.stateRef.completedLessons.includes(this.lesson.id);
        const xp = isDone ? 25 : 50;
        this.stateRef.totalXP += xp;

        if (!isDone) this.stateRef.completedLessons.push(this.lesson.id);
        (this.lesson.vocabulary || []).forEach(v => {
          if (!this.stateRef.masteredVocab.find(item => item.id === v.id)) {
            this.stateRef.masteredVocab.push(v);
          }
        });

        StorageManager.save(this.stateRef);
        App.updateUI();

        container.innerHTML = `
          <div style="text-align:center; padding: 2rem 0;">
            <span style="font-size: 3.5rem;">🎉</span>
            <h2 style="margin: 1rem 0;">Unit Complete!</h2>
            <div class="card" style="max-width: 280px; margin: auto; text-align: left;">
              <p>${t.score}: <strong>${this.correctCount}</strong></p>
              <p>${t.xp_earned}: <strong>+${xp} XP</strong></p>
            </div>
          </div>
        `;

        actionBtn.disabled = false;
        actionBtn.textContent = t.finish_btn;
        actionBtn.onclick = () => {
          document.getElementById('lessonModal').classList.add('hidden');
          App.navigate('learn');
        };
      }
    };

    const App = {
      state: StorageManager.load(),

      init() {
        this.applyLanguage();
        this.updateUI();

        if (this.state.theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.getElementById('themeToggleBtn').textContent = '☀️';
        }

        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.addEventListener('click', (e) => this.navigate(e.currentTarget.getAttribute('data-view')));
        });

        document.getElementById('uiLangToggleBtn').addEventListener('click', () => {
          this.state.uiLang = (this.state.uiLang === 'my') ? 'en' : 'my';
          StorageManager.save(this.state);
          this.applyLanguage();
          this.navigate(document.querySelector('.nav-item.active').getAttribute('data-view'));
        });

        document.getElementById('themeToggleBtn').addEventListener('click', () => {
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          const next = isDark ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          document.getElementById('themeToggleBtn').textContent = isDark ? '🌙' : '☀️';
          this.state.theme = next;
          StorageManager.save(this.state);
        });

        document.getElementById('closeLessonBtn').addEventListener('click', () => {
          document.getElementById('lessonModal').classList.add('hidden');
        });

        this.navigate('learn');
      },

      applyLanguage() {
        const lang = this.state.uiLang;
        document.getElementById('uiLangToggleBtn').textContent = (lang === 'my') ? '🇲🇲 မြန်မာ' : '🇬🇧 English';
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (I18N[lang][key]) el.textContent = I18N[lang][key];
        });
      },

      updateUI() {
        document.getElementById('streakCount').textContent = this.state.streak;
        document.getElementById('totalXpCount').textContent = this.state.totalXP;
      },

      navigate(view) {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.getAttribute('data-view') === view));
        const main = document.getElementById('mainContainer');
        main.innerHTML = '';
        if (view === 'learn') this.renderLearn(main);
        else if (view === 'script') this.renderScript(main);
        else if (view === 'vocab') this.renderVocab(main);
        else if (view === 'progress') this.renderProgress(main);
        else if (view === 'settings') this.renderSettings(main);
      },

      renderLearn(main) {
        const lang = this.state.uiLang;
        const t = I18N[lang];
        const chapters = window.THAI_A1_CHAPTERS || [];

        main.innerHTML = `
          <h2 style="margin-bottom:1rem;">🇹🇭 Thai Master (Chapter 1–12 • 240 Units)</h2>
          ${chapters.map(ch => {
            const chTitle = typeof ch.title === 'object' ? (ch.title[lang] || ch.title.en) : ch.title;
            return `
              <div class="card">
                ${ch.coverImage ? `<img src="${ch.coverImage}" class="chapter-banner" alt="${chTitle}">` : ''}
                <h3>${chTitle}</h3>
                <div style="display:flex; flex-direction:column; gap:0.75rem; margin-top:0.85rem;">
                  ${ch.units.map(unit => {
                    const uTitle = typeof unit.title === 'object' ? (unit.title[lang] || unit.title.en) : unit.title;
                    const done = this.state.completedLessons.includes(unit.id);
                    const drillsCount = (unit.exercises?.length || 0) + (unit.quiz?.length || 0) + (unit.dialogue ? 1 : 0) + (unit.aiRoleplay ? 1 : 0);
                    return `
                      <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:var(--bg-main); border-radius:var(--radius-md);">
                        <div>
                          <strong>${uTitle}</strong>
                          <div style="font-size:0.8rem; color:var(--text-muted);">${unit.vocabulary?.length || 0} ${t.words_count} • ${drillsCount} Drills & AI Roleplay</div>
                        </div>
                        <button class="primary-btn" onclick="App.launchLesson('${unit.id}')">
                          ${done ? t.review : t.start}
                        </button>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('')}
        `;
      },

      renderScript(main) {
        const lang = this.state.uiLang;
        const t = I18N[lang];

        main.innerHTML = `
          <h2>${t.script_title}</h2>
          <div class="card" style="margin-top:1rem;">
            <h3>${t.script_canvas_title}</h3>
            <p style="color:var(--text-muted); font-size:0.9rem;">${t.script_canvas_sub}</p>
            <canvas id="paintCanvas" class="drawing-pad-box" width="320" height="230"></canvas>
            <div style="text-align:center;">
              <button class="secondary-btn" onclick="App.clearCanvas()">${t.script_clear}</button>
            </div>
          </div>

          <h3 style="margin: 1.5rem 0 0.75rem 0;">${t.script_consonants}</h3>
          <div class="grid-thai-letters">
            ${THAI_ALPHABET.map(item => `
              <div class="thai-letter-card" onclick="AudioManager.speak('${item.name}')">
                <span class="thai-letter-char">${item.char}</span>
                <div class="thai-txt" style="font-size:0.85rem; font-weight:700;">${item.name}</div>
                <small style="color:var(--text-muted); font-size:0.75rem;">[${item.class}]</small>
              </div>
            `).join('')}
          </div>
        `;

        this.initCanvas();
      },

      initCanvas() {
        const canvas = document.getElementById('paintCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#4F46E5';

        let painting = false;
        function start(e) { painting = true; draw(e); }
        function end() { painting = false; ctx.beginPath(); }
        function draw(e) {
          if (!painting) return;
          const rect = canvas.getBoundingClientRect();
          const clientX = e.clientX || (e.touches && e.touches[0].clientX);
          const clientY = e.clientY || (e.touches && e.touches[0].clientY);
          ctx.lineTo(clientX - rect.left, clientY - rect.top);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(clientX - rect.left, clientY - rect.top);
        }

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mouseup', end);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); });
        canvas.addEventListener('touchend', end);
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
      },

      clearCanvas() {
        const canvas = document.getElementById('paintCanvas');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      },

      launchLesson(unitId) {
        for (let ch of (window.THAI_A1_CHAPTERS || [])) {
          const u = ch.units.find(item => item.id === unitId);
          if (u) {
            LessonEngine.start(u, this.state);
            return;
          }
        }
      },

      renderVocab(main) {
        const lang = this.state.uiLang;
        const t = I18N[lang];
        const items = this.state.masteredVocab;

        main.innerHTML = `
          <h2>📖 Vocabulary Bank</h2>
          ${items.length === 0 ? `<div class="card" style="text-align:center; padding:2rem; margin-top:1rem;"><p>${t.vocab_empty}</p></div>` : `
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:0.75rem; margin-top:1rem;">
              ${items.map(v => `
                <div class="card">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong class="thai-txt" style="font-size:1.2rem;">${v.word}</strong>
                    <button class="audio-btn" onclick="AudioManager.speak('${v.word}')">🔊</button>
                  </div>
                  <small style="color:var(--primary); font-weight:700;">[${v.roman}]</small>
                  <div style="font-size:0.85rem; color:var(--text-muted); margin-top:0.3rem;">
                    ${typeof v.meaning === 'object' ? (v.meaning[lang] || v.meaning.en) : v.meaning}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        `;
      },

      renderProgress(main) {
        const lang = this.state.uiLang;
        const t = I18N[lang];
        main.innerHTML = `
          <h2>📊 Progress</h2>
          <div class="card" style="margin-top:1rem;">
            <div style="display:flex; justify-content:space-around; text-align:center;">
              <div><h3 style="color:var(--primary); font-size:1.5rem;">${this.state.totalXP}</h3><small>${t.total_xp}</small></div>
              <div><h3 style="color:#F59E0B; font-size:1.5rem;">${this.state.streak}</h3><small>${t.streak}</small></div>
            </div>
          </div>
        `;
      },

      renderSettings(main) {
        const lang = this.state.uiLang;
        const t = I18N[lang];
        main.innerHTML = `
          <h2>⚙️ Settings</h2>
          <div class="card" style="margin-top:1rem;">
            <button class="primary-btn" onclick="App.exportData()">${t.export_btn}</button>
          </div>
        `;
      },

      exportData() {
        const blob = new Blob([JSON.stringify(this.state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `lingomaster_backup_${Date.now()}.json`;
        a.click();
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>

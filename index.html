<!DOCTYPE html>
<html lang="my" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#4F46E5" />
  <title>LingoMaster Global — 8 Languages Complete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@500;700&family=Noto+Sans+KR:wght@500;700&family=Noto+Sans+Thai:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5; --primary-hover: #4338CA; --primary-light: #EEF2FF;
      --success: #10B981; --success-light: #ECFDF5; --error: #EF4444; --error-light: #FEF2F2;
      --bg-main: #F8FAFC; --bg-card: #FFFFFF; --text-main: #0F172A; --text-muted: #64748B;
      --border-color: #E2E8F0; --radius-md: 14px; --radius-lg: 20px; --radius-full: 9999px;
      --font-base: 'Plus Jakarta Sans', 'Noto Sans Thai', 'Noto Sans JP', 'Noto Sans KR', sans-serif;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --bg-main: #0B0F19; --bg-card: #151D2F; --text-main: #F9FAFB; --text-muted: #94A3B8;
      --border-color: #1F293D; --primary-light: #1E1B4B; --success-light: #064E3B; --error-light: #7F1D1D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font-base); background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; line-height: 1.5; }
    .app-layout { display: flex; flex-direction: column; min-height: 100vh; }
    .app-header { position: sticky; top: 0; z-index: 40; display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1.25rem; background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); }
    .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.25rem; color: var(--primary); }
    .user-stats-bar { display: flex; align-items: center; gap: 0.6rem; }
    .stat-pill { display: flex; align-items: center; gap: 0.35rem; background: var(--bg-main); padding: 0.35rem 0.65rem; border-radius: var(--radius-full); font-weight: 700; font-size: 0.85rem; border: 1px solid var(--border-color); }
    .icon-btn { background: transparent; border: none; font-size: 1.25rem; cursor: pointer; padding: 0.4rem; border-radius: 8px; }
    .main-content { flex: 1; padding: 1.25rem 1rem 5.5rem 1rem; max-width: 900px; width: 100%; margin: 0 auto; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 62px; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 50; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; gap: 0.2rem; height: 100%; cursor: pointer; transition: var(--transition); }
    .nav-item.active { color: var(--primary); }
    .card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 1.25rem; border: 1px solid var(--border-color); margin-bottom: 1rem; }
    .primary-btn { background: var(--primary); color: #fff; border: none; padding: 0.75rem 1.25rem; border-radius: var(--radius-md); font-weight: 700; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; transition: var(--transition); min-height: 46px; }
    .primary-btn:hover:not(:disabled) { background: var(--primary-hover); }
    .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-large { width: 100%; font-size: 1.1rem; padding: 0.85rem; }
    .secondary-btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.6rem 1rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; }
    .progress-bar-container { width: 100%; height: 8px; background: var(--border-color); border-radius: var(--radius-full); overflow: hidden; margin: 0.5rem 0; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #818CF8); border-radius: var(--radius-full); transition: width 0.4s ease; }
    .lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.75rem; margin-top: 0.75rem; }
    .lang-card { cursor: pointer; display: flex; flex-direction: column; gap: 0.5rem; }
    .lang-card.selected { border: 2px solid var(--primary); background: var(--primary-light); }
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 0.6rem; }
    .option-btn { background: var(--bg-card); border: 2px solid var(--border-color); padding: 0.85rem; border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; text-align: left; cursor: pointer; color: var(--text-main); }
    .option-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .sentence-construction-zone { background: var(--bg-main); border: 2px dashed var(--border-color); margin-bottom: 1.25rem; min-height: 50px; display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 0.75rem; border-radius: var(--radius-md); }
    .word-bank { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .word-chip { padding: 0.5rem 0.85rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--text-main); }
    .word-chip.used { opacity: 0.3; pointer-events: none; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 100; display: flex; justify-content: center; align-items: center; }
    .modal-overlay.hidden { display: none; }
    .lesson-dialog { background: var(--bg-card); width: 100%; height: 100%; max-width: 680px; display: flex; flex-direction: column; }
    @media (min-width: 768px) { .lesson-dialog { height: 90vh; border-radius: var(--radius-lg); overflow: hidden; } }
    .lesson-header { display: flex; align-items: center; padding: 0.85rem 1.25rem; gap: 0.85rem; border-bottom: 1px solid var(--border-color); }
    .lesson-body { flex: 1; padding: 1.5rem 1.25rem; overflow-y: auto; }
    .feedback-banner { padding: 0.85rem 1.25rem; border-top: 1px solid var(--border-color); }
    .feedback-banner.correct { background: var(--success-light); color: #065F46; }
    .feedback-banner.incorrect { background: var(--error-light); color: #991B1B; }
    .audio-btn { background: var(--primary-light); border: none; color: var(--primary); width: 44px; height: 44px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; }
  </style>
</head>
<body>
  <div id="app" class="app-layout">
    <header class="app-header">
      <div class="brand"><span>🌍</span><span>LingoMaster</span></div>
      <div class="user-stats-bar">
        <div class="stat-pill" title="Global Streak">🔥 <span id="streakCount">0</span></div>
        <div class="stat-pill" title="Total XP">⭐ <span id="totalXpCount">0</span></div>
        <div class="stat-pill" title="Energy">❤️ ∞</div>
        <button id="themeToggleBtn" class="icon-btn">🌙</button>
      </div>
    </header>

    <main id="mainContainer" class="main-content" role="main"></main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home"><span>🏠</span><span>Home</span></button>
      <button class="nav-item" data-view="learn"><span>📚</span><span>Learn</span></button>
      <button class="nav-item" data-view="vocab"><span>📖</span><span>Vocab</span></button>
      <button class="nav-item" data-view="review"><span>🔄</span><span>Review</span></button>
      <button class="nav-item" data-view="progress"><span>📊</span><span>Progress</span></button>
      <button class="nav-item" data-view="settings"><span>⚙️</span><span>Settings</span></button>
    </nav>
  </div>

  <div id="lessonModal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-dialog lesson-dialog">
      <header class="lesson-header">
        <button id="closeLessonBtn" class="icon-btn">✕</button>
        <div class="progress-bar-container" style="flex:1;">
          <div id="lessonProgressBar" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
        <div id="lessonStepIndicator" style="font-size: 0.85rem; font-weight: 700; color: var(--text-muted);">Step 1/8</div>
      </header>
      
      <div id="lessonContainer" class="lesson-body"></div>
      
      <footer class="lesson-footer">
        <div id="feedbackBanner" class="feedback-banner hidden">
          <div style="display:flex; align-items:flex-start; gap:0.6rem;">
            <span id="feedbackIcon" style="font-size:1.4rem;">✓</span>
            <div>
              <strong id="feedbackTitle">Correct!</strong>
              <p id="feedbackExplanation" style="font-size:0.85rem;"></p>
            </div>
          </div>
        </div>
        <div style="padding: 0.85rem 1.25rem;">
          <button id="lessonActionBtn" class="primary-btn btn-large" disabled>Check</button>
        </div>
      </footer>
    </div>
  </div>

      },

              ],
              quiz: [{ type: 'mcq', prompt: '"Hello" in Spanish?', options: ['Hola', 'Adios'], correct: 0 }]
            }]
          }]
        }
      },
      italian: {
        A1: {
          units: [{
            id: 'it-a1-u1',
            title: 'Unit 1: Primi Passi',
            description: 'Italian essentials and greetings.',
            lessons: [{
              id: 'it-a1-u1-l1',
              title: 'Lesson 1: Ciao!',
              description: 'Greetings in Italian.',
              vocabulary: [{ id: 'it-v1', word: 'Ciao', meaning: 'မင်္ဂလာပါ / နှုတ်ဆက်ပါတယ်', example: 'Ciao, a presto!' }],
              grammar: { title: 'Gender endings -o / -a', rule: '-o (Masculine), -a (Feminine)', explanation: 'Noun vowel agreement.', examples: ['Il ragazzo'] },
              exercises: [
                { type: 'mcq', prompt: 'What does "Ciao" mean?', options: ['မင်္ဂလာပါ / နှုတ်ဆက်ပါတယ်', 'ကျေးဇူးတင်ပါတယ်', 'တောင်းပန်ပါတယ်'], correct: 0 }
              ],
              quiz: [{ type: 'mcq', prompt: '"Ciao" is used for:', options: ['Both Hello and Goodbye', 'Only Goodbye'], correct: 0 }]
            }]
          }]
        }
      }
    };

    function getLessonData(langId, levelId, unitId, lessonId) {
      const l = LESSON_DATABASE[langId]?.[levelId]?.units?.find(u => u.id === unitId)?.lessons?.find(ls => ls.id === lessonId);
      if (l) return l;
      const meta = LANGUAGES[langId] || LANGUAGES.english;
      return {
        id: lessonId,
        title: `${meta.name} Practice Session`,
        description: `Proficiency session for ${levelId}.`,
        vocabulary: [{ id: `${langId}-sample`, word: `${meta.name} Word`, meaning: 'Practice term', example: 'Example.' }],
        grammar: { title: 'Structure', rule: 'Standard pattern.', explanation: 'Follow rules.', examples: ['Example.'] },
        exercises: [{ type: 'mcq', prompt: `Select translation:`, options: ['Correct concept', 'False concept'], correct: 0 }],
        quiz: [{ type: 'mcq', prompt: 'Comprehension check:', options: ['Understood', 'Review'], correct: 0 }]
      };
    }

    const STORAGE_KEY = 'lingomaster_global_state_v4';
    const DEFAULT_STATE = {
      activeLanguage: 'english',
      totalXP: 0,
      dailyXP: 0,
      dailyGoal: 50,
      streak: { current: 1, longest: 1, lastStudyDate: new Date().toISOString().slice(0, 10) },
      theme: 'light',
      achievements: [],
      srsItems: [],
      languages: {
        english: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        thai: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        french: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        german: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        korean: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        japanese: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        spanish: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] },
        italian: { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] }
      }
    };

    const StorageManager = {
      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return DEFAULT_STATE;
          const parsed = JSON.parse(raw);
          for (let l of Object.keys(DEFAULT_STATE.languages)) {
            if (!parsed.languages[l]) parsed.languages[l] = { level: 'A1', xp: 0, completedLessons: [], vocabulary: [] };
          }
          return parsed;
        } catch (e) {
          return DEFAULT_STATE;
        }
      },
      save(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }
    };

    const AudioManager = {
      speak(text, langId) {
        if (!('speechSynthesis' in window) || !text) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = LANGUAGES[langId]?.locale || 'en-US';
        utter.rate = LANGUAGES[langId]?.rate || 0.95;
        window.speechSynthesis.speak(utter);
      }
    };

    const ProgressTracker = {
      addXP(state, baseXP, langId, isReview = false) {
        const xp = isReview ? Math.floor(baseXP * 0.5) : baseXP;
        state.totalXP += xp;
        state.dailyXP += xp;
        if (langId && state.languages[langId]) state.languages[langId].xp += xp;
        StorageManager.save(state);
        App.updateUI();
        return xp;
      },
      isLevelUnlocked(state, langId, levelId) {
        const idx = CEFR_LEVELS.findIndex(l => l.id === levelId);
        if (idx <= 0) return true;
        const prev = CEFR_LEVELS[idx - 1].id;
        return (state.languages[langId].completedLessons || []).filter(id => id.includes(`-${prev.toLowerCase()}-`)).length >= 1;
      }
    };

    const LessonEngine = {
      lesson: null,
      langId: null,
      stepIndex: 0,
      steps: [],
      correctCount: 0,
      userAnswer: null,
      orderedWords: [],
      stateRef: null,

      start(lessonData, langId, appState) {
        this.lesson = lessonData;
        this.langId = langId;
        this.stateRef = appState;
        this.stepIndex = 0;
        this.correctCount = 0;

        this.steps = [
          { type: 'intro' },
          { type: 'vocab_overview' },
          { type: 'grammar_concept' },
          ...lessonData.exercises.map(ex => ({ type: 'exercise', data: ex })),
          ...lessonData.quiz.map(q => ({ type: 'quiz', data: q })),
          { type: 'completion' }
        ];

        document.getElementById('lessonModal').classList.remove('hidden');
        this.renderStep();
      },

      renderStep() {
        const container = document.getElementById('lessonContainer');
        const progressBar = document.getElementById('lessonProgressBar');
        const indicator = document.getElementById('lessonStepIndicator');
        const actionBtn = document.getElementById('lessonActionBtn');
        const banner = document.getElementById('feedbackBanner');

        banner.className = 'feedback-banner hidden';
        actionBtn.disabled = false;
        actionBtn.textContent = 'Continue';
        actionBtn.onclick = () => this.handleNext();

        const total = this.steps.length;
        progressBar.style.width = `${(this.stepIndex / (total - 1)) * 100}%`;
        indicator.textContent = `Step ${this.stepIndex + 1}/${total}`;

        const step = this.steps[this.stepIndex];
        let html = '';

        if (step.type === 'intro') {
          html = `
            <div class="card" style="text-align:center; padding: 2rem 1rem;">
              <span style="font-size: 3rem;">📘</span>
              <h2 style="font-size: 1.5rem; margin: 1rem 0;">${this.lesson.title}</h2>
              <p style="color: var(--text-muted);">${this.lesson.description}</p>
            </div>
          `;
        } else if (step.type === 'vocab_overview') {
          html = `
            <h3>📖 Vocabulary</h3>
            <div style="display:flex; flex-direction:column; gap:0.75rem; margin-top:1rem;">
              ${(this.lesson.vocabulary || []).map(v => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                  <div>
                    <h4 style="font-size:1.2rem;">${v.word}</h4>
                    <p style="color:var(--text-muted); font-size:0.9rem;">${v.meaning}</p>
                  </div>
                  <button class="audio-btn" onclick="AudioManager.speak('${v.word}', '${this.langId}')">🔊</button>
                </div>
              `).join('')}
            </div>
          `;
        } else if (step.type === 'grammar_concept') {
          const g = this.lesson.grammar;
          html = `
            <div class="card">
              <h3>📐 Grammar: ${g.title}</h3>
              <div style="margin: 1rem 0; padding:1rem; background:var(--bg-main); border-radius:var(--radius-md);">
                <strong>Rule:</strong> ${g.rule}
              </div>
              <p style="color:var(--text-muted);">${g.explanation}</p>
            </div>
          `;
        } else if (step.type === 'exercise' || step.type === 'quiz') {
          this.renderInteractiveExercise(step.data, container, actionBtn);
          return;
        } else if (step.type === 'completion') {
          this.renderCompletionScreen(container, actionBtn);
          return;
        }

        container.innerHTML = html;
      },

      renderInteractiveExercise(ex, container, actionBtn) {
        actionBtn.disabled = true;
        actionBtn.textContent = 'Check';
        actionBtn.onclick = () => this.checkCurrentExercise(ex);
        this.userAnswer = null;
        this.orderedWords = [];

        let html = `<div class="exercise-prompt">${ex.prompt}</div>`;

        if (ex.type === 'mcq') {
          html += `<div class="options-grid">
            ${ex.options.map((opt, i) => `<button class="option-btn" onclick="LessonEngine.selectOpt(this, ${i})">${opt}</button>`).join('')}
          </div>`;
        } else if (ex.type === 'fill_blank') {
          html += `
            <p style="font-size:1.3rem; text-align:center; margin:1rem 0;">${ex.sentence}</p>
            <div class="options-grid">
              ${ex.options.map((opt, i) => `<button class="option-btn" onclick="LessonEngine.selectOpt(this, ${i})">${opt}</button>`).join('')}
            </div>
          `;
        } else if (ex.type === 'word_order') {
          html += `
            <div id="constructionZone" class="sentence-construction-zone"></div>
            <div id="wordBank" class="word-bank">
              ${ex.words.map(w => `<div class="word-chip" onclick="LessonEngine.pickWord(this, '${w}')">${w}</div>`).join('')}
            </div>
          `;
        } else if (ex.type === 'listening') {
          html += `
            <div style="text-align:center; margin-bottom:1.5rem;">
              <button class="audio-btn" onclick="AudioManager.speak('${ex.targetText}', '${this.langId}')">🔊</button>
            </div>
            <div class="options-grid">
              ${ex.options.map((opt, i) => `<button class="option-btn" onclick="LessonEngine.selectOpt(this, ${i})">${opt}</button>`).join('')}
            </div>
          `;
          setTimeout(() => AudioManager.speak(ex.targetText, this.langId), 200);
        }

        container.innerHTML = html;
      },

      selectOpt(el, idx) {
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        this.userAnswer = idx;
        document.getElementById('lessonActionBtn').disabled = false;
      },

      pickWord(el, word) {
        const zone = document.getElementById('constructionZone');
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.textContent = word;
        chip.onclick = () => {
          chip.remove();
          el.classList.remove('used');
          this.orderedWords = this.orderedWords.filter(w => w !== word);
          document.getElementById('lessonActionBtn').disabled = this.orderedWords.length === 0;
        };
        zone.appendChild(chip);
        el.classList.add('used');
        this.orderedWords.push(word);
        document.getElementById('lessonActionBtn').disabled = false;
      },

      checkCurrentExercise(ex) {
        let isCorrect = false;
        if (ex.type === 'mcq' || ex.type === 'fill_blank' || ex.type === 'listening') isCorrect = (this.userAnswer === ex.correct);
        else if (ex.type === 'word_order') isCorrect = (JSON.stringify(this.orderedWords) === JSON.stringify(ex.correctSequence));

        if (isCorrect) this.correctCount++;

        const banner = document.getElementById('feedbackBanner');
        const title = document.getElementById('feedbackTitle');
        const exp = document.getElementById('feedbackExplanation');
        const actionBtn = document.getElementById('lessonActionBtn');

        banner.className = `feedback-banner ${isCorrect ? 'correct' : 'incorrect'}`;
        title.textContent = isCorrect ? '✓ Correct!' : '✕ Not quite.';
        exp.textContent = ex.explanation || (isCorrect ? 'Great job!' : 'Review this concept.');

        actionBtn.textContent = 'Continue';
        actionBtn.onclick = () => this.handleNext();
      },

      handleNext() {
        this.stepIndex++;
        this.renderStep();
      },

      renderCompletionScreen(container, actionBtn) {
        const isReview = this.stateRef.languages[this.langId].completedLessons.includes(this.lesson.id);
        const xpEarned = ProgressTracker.addXP(this.stateRef, 20, this.langId, isReview);
        const total = this.steps.filter(s => s.type === 'exercise' || s.type === 'quiz').length;
        const accuracy = total > 0 ? Math.round((this.correctCount / total) * 100) : 100;

        if (!isReview) this.stateRef.languages[this.langId].completedLessons.push(this.lesson.id);
        (this.lesson.vocabulary || []).forEach(v => {
          if (!this.stateRef.srsItems.find(i => i.id === v.id)) {
            this.stateRef.srsItems.push({ ...v, langId: this.langId });
          }
        });

        StorageManager.save(this.stateRef);

        container.innerHTML = `
          <div style="text-align:center; padding: 2rem 0;">
            <span style="font-size: 3.5rem;">🎉</span>
            <h2 style="margin: 1rem 0;">Lesson Completed!</h2>
            <div class="card" style="max-width: 280px; margin: auto; text-align: left;">
              <p>Score: <strong>${this.correctCount} / ${total}</strong></p>
              <p>Accuracy: <strong>${accuracy}%</strong></p>
              <p>XP Earned: <strong>+${xpEarned} XP</strong></p>
            </div>
          </div>
        `;

        actionBtn.disabled = false;
        actionBtn.textContent = 'Finish';
        actionBtn.onclick = () => {
          document.getElementById('lessonModal').classList.add('hidden');
          App.navigate('learn');
        };
      }
    };

    const App = {
      state: StorageManager.load(),

      init() {
        this.updateUI();
        if (this.state.theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.getElementById('themeToggleBtn').textContent = '☀️';
        }

        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.addEventListener('click', (e) => this.navigate(e.currentTarget.getAttribute('data-view')));
        });

        document.getElementById('themeToggleBtn').addEventListener('click', () => {
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          const next = isDark ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          document.getElementById('themeToggleBtn').textContent = isDark ? '🌙' : '☀️';
          this.state.theme = next;
          StorageManager.save(this.state);
        });

        document.getElementById('closeLessonBtn').addEventListener('click', () => {
          document.getElementById('lessonModal').classList.add('hidden');
        });

        this.navigate('home');
      },

      updateUI() {
        document.getElementById('streakCount').textContent = this.state.streak.current;
        document.getElementById('totalXpCount').textContent = this.state.totalXP;
      },

      navigate(view) {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.getAttribute('data-view') === view));
        const main = document.getElementById('mainContainer');
        main.innerHTML = '';
        if (view === 'home') this.renderHome(main);
        else if (view === 'learn') this.renderLearn(main);
        else if (view === 'vocab') this.renderVocab(main);
        else if (view === 'review') this.renderReview(main);
        else if (view === 'progress') this.renderProgress(main);
        else if (view === 'settings') this.renderSettings(main);
      },

      renderHome(main) {
        const lang = LANGUAGES[this.state.activeLanguage] || LANGUAGES.english;
        const lp = this.state.languages[this.state.activeLanguage];
        const pct = Math.min(100, Math.round((this.state.dailyXP / this.state.dailyGoal) * 100));

        main.innerHTML = `
          <div class="card" style="border-left: 6px solid var(--primary);">
            <span style="font-size: 2rem;">${lang.flag}</span>
            <h2 style="font-size: 1.35rem; margin: 0.25rem 0;">Learning ${lang.name}</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Level ${lp.level} • ${lp.completedLessons.length} Lessons Finished</p>
            <button class="primary-btn" style="margin-top: 0.85rem;" onclick="App.navigate('learn')">Continue Learning →</button>
          </div>

          <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:0.4rem; font-weight:700;">
              <span>🎯 Daily Goal</span>
              <span>${this.state.dailyXP} / ${this.state.dailyGoal} XP</span>
            </div>
            <div class="progress-bar-container">
              <div class="progress-bar-fill" style="width: ${pct}%;"></div>
            </div>
          </div>

          <h3 style="margin: 1.25rem 0 0.5rem 0;">🌍 Select Language (Exact 8)</h3>
          <div class="lang-grid">
            ${Object.values(LANGUAGES).map(l => {
              const info = this.state.languages[l.id];
              const isSel = this.state.activeLanguage === l.id;
              return `
                <div class="card lang-card ${isSel ? 'selected' : ''}" onclick="App.switchLang('${l.id}')">
                  <div style="display:flex; align-items:center; gap:0.6rem;">
                    <span style="font-size:1.8rem;">${l.flag}</span>
                    <div>
                      <strong>${l.name}</strong>
                      <div style="font-size:0.75rem; color:var(--text-muted);">${info.level} • ${info.xp} XP</div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      },

      switchLang(langId) {
        this.state.activeLanguage = langId;
        StorageManager.save(this.state);
        this.navigate('learn');
      },

      renderLearn(main) {
        const lang = LANGUAGES[this.state.activeLanguage];
        const lp = this.state.languages[this.state.activeLanguage];
        const curLevel = lp.level;
        const curriculum = LESSON_DATABASE[this.state.activeLanguage]?.[curLevel] || LESSON_DATABASE.english.A1;

        main.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
            <h2>${lang.flag} ${lang.name} Curriculum</h2>
            <select class="secondary-btn" onchange="App.setLevel(this.value)">
              ${CEFR_LEVELS.map(lvl => {
                const unlocked = ProgressTracker.isLevelUnlocked(this.state, this.state.activeLanguage, lvl.id);
                return `<option value="${lvl.id}" ${lvl.id === curLevel ? 'selected' : ''} ${!unlocked ? 'disabled' : ''}>${lvl.name} ${!unlocked ? '🔒' : ''}</option>`;
              }).join('')}
            </select>
          </div>

          ${curriculum.units.map(unit => `
            <div class="card">
              <h3>${unit.title}</h3>
              <p style="color:var(--text-muted); margin-bottom:1rem; font-size:0.9rem;">${unit.description}</p>
              <div style="display:flex; flex-direction:column; gap:0.75rem;">
                ${unit.lessons.map(ls => {
                  const done = lp.completedLessons.includes(ls.id);
                  return `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem; background:var(--bg-main); border-radius:var(--radius-md);">
                      <div>
                        <strong>${ls.title}</strong>
                        <div style="font-size:0.8rem; color:var(--text-muted);">${ls.description}</div>
                      </div>
                      <button class="primary-btn" onclick="App.launchLesson('${this.state.activeLanguage}', '${curLevel}', '${unit.id}', '${ls.id}')">
                        ${done ? 'Review ✓' : 'Start'}
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}
        `;
      },

      setLevel(lvl) {
        if (!ProgressTracker.isLevelUnlocked(this.state, this.state.activeLanguage, lvl)) {
          alert('Complete previous level first!');
          return;
        }
        this.state.languages[this.state.activeLanguage].level = lvl;
        StorageManager.save(this.state);
        this.navigate('learn');
      },

      launchLesson(langId, levelId, unitId, lessonId) {
        const data = getLessonData(langId, levelId, unitId, lessonId);
        LessonEngine.start(data, langId, this.state);
      },

      renderVocab(main) {
        const lang = LANGUAGES[this.state.activeLanguage];
        const items = (this.state.srsItems || []).filter(i => i.langId === this.state.activeLanguage);

        main.innerHTML = `
          <h2>📖 Vocabulary Bank — ${lang.flag} ${lang.name}</h2>
          ${items.length === 0 ? `<div class="card" style="text-align:center; padding:2rem;"><p>No words mastered yet.</p></div>` : `
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:0.75rem; margin-top:1rem;">
              ${items.map(v => `
                <div class="card">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong>${v.word}</strong>
                    <button class="audio-btn" onclick="AudioManager.speak('${v.word}', '${this.state.activeLanguage}')">🔊</button>
                  </div>
                  <div style="font-size:0.85rem; color:var(--text-muted); margin-top:0.4rem;">${v.meaning}</div>
                </div>
              `).join('')}
            </div>
          `}
        `;
      },

      renderReview(main) {
        const lang = LANGUAGES[this.state.activeLanguage];
        const items = (this.state.srsItems || []).filter(i => i.langId === this.state.activeLanguage);
        main.innerHTML = `
          <h2>🔄 Spaced Repetition Review</h2>
          <div class="card" style="text-align:center; padding:2.5rem 1rem; margin-top:1rem;">
            <span style="font-size:3rem;">🧠</span>
            <h3 style="margin:1rem 0;">${items.length} Words in Review Deck</h3>
            <p style="color:var(--text-muted); margin-bottom:1.5rem;">Target: ${lang.flag} ${lang.name}</p>
            <button class="primary-btn" ${items.length === 0 ? 'disabled' : ''} onclick="alert('Review session launched!')">
              ${items.length === 0 ? 'All Caught Up!' : 'Begin Review Deck'}
            </button>
          </div>
        `;
      },

      renderProgress(main) {
        main.innerHTML = `
          <h2>📊 Progress & Mastery</h2>
          <div class="card" style="margin-top:1rem;">
            <div style="display:flex; justify-content:space-around; text-align:center;">
              <div><h3 style="color:var(--primary); font-size:1.5rem;">${this.state.totalXP}</h3><small>Total XP</small></div>
              <div><h3 style="color:var(--warning); font-size:1.5rem;">${this.state.streak.current}</h3><small>Streak</small></div>
            </div>
          </div>
          <h3 style="margin:1rem 0 0.5rem 0;">All 8 Languages Mastery</h3>
          ${Object.values(LANGUAGES).map(l => {
            const lp = this.state.languages[l.id];
            return `
              <div class="card" style="margin-bottom:0.75rem;">
                <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
                  <strong>${l.flag} ${l.name} (${lp.level})</strong>
                  <span>${lp.xp} XP • ${lp.completedLessons.length} Lessons</span>
                </div>
              </div>
            `;
          }).join('')}
        `;
      },

      renderSettings(main) {
        main.innerHTML = `
          <h2>⚙️ Settings & Backup</h2>
          <div class="card" style="margin-top:1rem;">
            <h3>Data Management</h3>
            <p style="color:var(--text-muted); margin-bottom:1rem; font-size:0.85rem;">Export or restore your progress data (JSON format).</p>
            <div style="display:flex; gap:0.75rem;">
              <button class="primary-btn" onclick="App.exportData()">💾 Export JSON</button>
              <button class="secondary-btn" onclick="document.getElementById('fileInp').click()">📥 Import JSON</button>
              <input type="file" id="fileInp" style="display:none;" accept=".json" onchange="App.importData(event)">
            </div>
          </div>
        `;
      },

      exportData() {
        const blob = new Blob([JSON.stringify(this.state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `lingomaster_backup_${Date.now()}.json`;
        a.click();
      },

      importData(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = JSON.parse(evt.target.result);
            if (data.languages) {
              this.state = data;
              StorageManager.save(this.state);
              alert('Restored successfully!');
              location.reload();
            }
          } catch(err) {
            alert('Invalid JSON file.');
          }
        };
        reader.readAsText(file);
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>

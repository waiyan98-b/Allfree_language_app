<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LingoMaster Global</title>

<style>
:root{
 --green:#58cc02;
 --greenDark:#46a302;
 --blue:#1cb0f6;
 --blueDark:#087fb8;
 --red:#ff4b4b;
 --gold:#ffc800;
 --bg:#f7f9fa;
 --text:#333;
 --muted:#777;
 --line:#e5e5e5;
}

*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent;
}

body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}

.app{
 max-width:600px;
 min-height:100vh;
 margin:auto;
 background:white;
 position:relative;
}

header{
 position:sticky;
 top:0;
 z-index:20;
 display:flex;
 gap:8px;
 align-items:center;
 padding:10px;
 background:white;
 border-bottom:2px solid var(--line);
}

select{
 flex:1;
 padding:10px;
 border:2px solid var(--blue);
 border-radius:12px;
 background:#eef9ff;
 font-weight:800;
 outline:none;
}

.stats{
 white-space:nowrap;
 font-size:13px;
 font-weight:800;
}

main{
 padding:16px 16px 90px;
}

section.hidden{
 display:none!important;
}

.card{
 background:white;
 border:2px solid var(--line);
 border-radius:18px;
 padding:17px;
 margin-bottom:14px;
 box-shadow:0 3px 0 #ddd;
}

.hero{
 color:white;
 border:0;
 background:linear-gradient(135deg,#1cb0f6,#087fb8);
}

.hero h1{
 margin:0 0 6px;
 font-size:28px;
}

.btn,
.back{
 width:100%;
 padding:14px;
 border-radius:13px;
 font-weight:900;
 font-size:15px;
 cursor:pointer;
}

.btn{
 border:0;
 color:white;
 background:var(--green);
 box-shadow:0 4px 0 var(--greenDark);
}

.btn:active{
 transform:translateY(2px);
 box-shadow:0 2px 0 var(--greenDark);
}

.back{
 background:white;
 border:2px solid var(--line);
 margin-bottom:10px;
}

.levels{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}

.level{
 padding:12px 4px;
 border:2px solid var(--line);
 border-radius:12px;
 background:white;
 font-weight:900;
 cursor:pointer;
}

.level.active{
 border-color:var(--green);
 background:#efffe7;
 color:var(--greenDark);
}

.lesson{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:14px;
 margin:8px 0;
 border:2px solid var(--line);
 border-radius:14px;
 cursor:pointer;
}

.lesson:hover{
 border-color:var(--blue);
}

.muted{
 color:var(--muted);
 font-size:13px;
}

.progress{
 height:12px;
 overflow:hidden;
 border-radius:20px;
 background:var(--line);
}

.fill{
 height:100%;
 background:var(--green);
 transition:.3s;
}

.question{
 font-size:20px;
 line-height:1.45;
 margin:15px 0;
}

.choice{
 width:100%;
 padding:14px;
 margin:6px 0;
 text-align:left;
 border:2px solid var(--line);
 border-radius:12px;
 background:white;
 cursor:pointer;
 font-weight:700;
 font-size:15px;
}

.choice.selected{
 border-color:var(--blue);
 background:#eef9ff;
}

.input{
 width:100%;
 padding:14px;
 margin:8px 0;
 border:2px solid var(--line);
 border-radius:12px;
 font-size:17px;
 outline:none;
}

.input:focus{
 border-color:var(--blue);
}

.slot{
 min-height:55px;
 display:flex;
 flex-wrap:wrap;
 align-items:center;
 gap:7px;
 padding:9px;
 margin-bottom:12px;
 border:2px dashed #bbb;
 border-radius:12px;
}

.chips{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 justify-content:center;
}

.chip{
 padding:9px 12px;
 border:2px solid var(--line);
 border-radius:10px;
 background:white;
 box-shadow:0 2px 0 #ddd;
 font-weight:800;
 cursor:pointer;
}

.chip.used{
 opacity:.25;
 pointer-events:none;
}

.feedback{
 padding:14px;
 margin-top:12px;
 border-radius:12px;
 font-weight:800;
}

.correct{
 background:#d9ffc1;
 color:var(--greenDark);
}

.wrong{
 background:#ffdfe0;
 color:#d22;
}

.statgrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.stat{
 padding:15px;
 text-align:center;
 border:2px solid var(--line);
 border-radius:14px;
}

.num{
 font-size:24px;
 font-weight:900;
}

.badge{
 display:inline-block;
 padding:6px 9px;
 border-radius:9px;
 background:#fff5c9;
 margin:3px;
 font-size:12px;
 font-weight:800;
}

nav{
 position:fixed;
 bottom:0;
 left:50%;
 transform:translateX(-50%);
 width:min(600px,100%);
 height:66px;
 display:flex;
 background:white;
 border-top:2px solid var(--line);
 z-index:30;
}

nav button{
 flex:1;
 border:0;
 background:white;
 color:var(--muted);
 font-weight:800;
 font-size:12px;
 cursor:pointer;
}

nav button.active{
 color:var(--greenDark);
}

.small{
 font-size:12px;
}

.center{
 text-align:center;
}
</style>
</head>

<header>
<select id="languageSelect"></select>

<div class="stats">

</header>

<!-- HOME -->
<section id="home">

<div class="card hero">

🎯 Complete Language Mastery
</p>

<p>
❤️ Energy: ∞<br>
Unlimited Practice
</p>

<button class="btn" onclick="page('learn')">
Continue Learning →
</button>

</div>

<div class="card">

<div style="display:flex;justify-content:space-between">
<b>🎯 Daily Goal</b>
<span id="dailyText" class="muted">0 / 50 XP</span>
</div>

<div class="progress" style="margin-top:8px">
<div id="dailyFill" class="fill"></div>
</div>

</div>

<div class="card">

<span class="muted">CURRENT COURSE</span>

<h2 id="currentLanguage"></h2>

<p id="currentLevel" class="muted"></p>

</div>

<div class="card">

<h3>🏆 Achievements</h3>

<div id="achievements"></div>

</div>

</section>


<!-- LEARN -->
<section id="learn" class="hidden">

<div class="card">

<h2 id="courseTitle"></h2>

<div id="levels" class="levels"></div>

</div>

<div class="card">

<h3 id="chapterTitle"></h3>

<div id="lessons"></div>

</div>

</section>


<!-- LESSON -->
<section id="lesson" class="hidden">

<div class="card">

<button class="back" onclick="page('learn')">
← Back to Lessons
</button>

<p id="lessonMeta" class="muted"></p>

<div class="progress">
<div id="lessonProgress" class="fill"></div>
</div>

<button
class="back"
style="width:auto;margin-top:12px;padding:8px 13px"

</button>

<h2 id="question" class="question"></h2>

<div id="answers"></div>

<button
id="checkButton"
class="btn"

CHECK
</button>

<div id="feedback" class="feedback hidden"></div>

</div>

</section>


<!-- PROGRESS -->
<section id="progress" class="hidden">

<div class="card">

<h2>📊 Progress Overview</h2>

<div class="statgrid">

<div class="stat">
<div id="totalXP" class="num">0</div>
<div class="muted">Total XP</div>
</div>

<div class="stat">
<div id="completed" class="num">0</div>
<div class="muted">Completed</div>
</div>

<div class="stat">
<div id="progressStreak" class="num">1</div>
<div class="muted">Day Streak</div>
</div>

<div class="stat">
<div class="num">∞</div>
<div class="muted">Energy</div>
</div>

</div>

</div>


<div class="card">

<h3>📚 Level Mastery</h3>

<div id="levelMastery"></div>

</div>


<div class="card">

<h3>🌍 Language Progress</h3>

<div id="languageMastery"></div>

</div>

</section>

</main>


<nav>

<button
id="nav-home"
class="active"
onclick="page('home')">
🏠<br>
Home
</button>

<button
id="nav-learn"
onclick="page('learn')">
📚<br>
Learn
</button>

<button
id="nav-progress"
onclick="page('progress')">
📊<br>
Progress
</button>

</nav>

</div>

/* =========================================================
   DAILY RESET
========================================================= */

function checkDaily(){

 const today=new Date().toISOString().slice(0,10);

 if(state.dailyDate!==today){

  state.dailyDate=today;

  state.dailyXP=0;

  save();

 }

}


/* =========================================================
   INIT
========================================================= */

function init(){

 checkDaily();

 const select=document.getElementById(
  "languageSelect"
 );

 select.innerHTML="";

 for(const [code,data] of Object.entries(DB)){

  const option=document.createElement("option");

  option.value=code;

  option.textContent=
   `${data.flag} ${data.name}`;

  select.appendChild(option);

 }

 select.value=state.language;

 select.onchange=function(){

  state.language=this.value;

  state.level="A1";

  save();

  renderLearn();

 };

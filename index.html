<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All-in-One Multi-Category Language App</title>
  <style>
    :root {
      --primary: #00897b;
      --primary-dark: #00695c;
      --bg: #f4f6f8;
      --card-bg: #ffffff;
      --text: #222222;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: var(--primary);
      color: white;
      padding: 12px 16px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }
    .lang-bar {
      display: flex;
      overflow-x: auto;
      background: #ffffff;
      padding: 8px;
      gap: 8px;
      border-bottom: 1px solid #ddd;
    }
    .lang-btn {
      flex: 0 0 auto;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #00897b;
      background: white;
      color: #00897b;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #00897b;
      color: white;
    }
    .category-bar {
      display: flex;
      overflow-x: auto;
      background: #fafafa;
      padding: 8px 12px;
      gap: 8px;
      border-bottom: 1px solid #e0e0e0;
    }
    .cat-btn {
      flex: 0 0 auto;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: white;
      color: #555;
      font-size: 12px;
      cursor: pointer;
    }
    .cat-btn.active {
      background: #37474f;
      color: white;
      border-color: #37474f;
    }
    .search-box {
      padding: 8px 16px;
      background: #ffffff;
      border-bottom: 1px solid #eee;
    }
    .search-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 13px;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 80px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .word-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .word-text {
      font-size: 18px;
      font-weight: bold;
      color: var(--primary-dark);
    }
    .phonetic {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      background: #e0f2f1;
      color: #00796b;
      padding: 2px 8px;
      border-radius: 4px;
      margin-top: 4px;
    }
    .meaning {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 500;
    }
    .example {
      margin-top: 4px;
      font-size: 12px;
      color: #555;
      background: #f9f9f9;
      padding: 6px;
      border-radius: 6px;
    }
    .btn-speak {
      background: #e0f2f1;
      border: none;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: white;
      display: flex;
      border-top: 1px solid #ddd;
      height: 55px;
    }
    .nav button {
      flex: 1;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: bold;
      color: #777;
      cursor: pointer;
    }
    .nav button.active {
      color: var(--primary);
      border-top: 3px solid var(--primary);
    }
    .quiz-option {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 2px solid #ddd;
      background: white;
      font-size: 15px;
      text-align: center;
      cursor: pointer;
    }
    .quiz-option.correct { background: #c8e6c9; border-color: #4caf50; }
    .quiz-option.wrong { background: #ffcdd2; border-color: #f44336; }
  </style>
</head>
<body>

  <header id="headerTitle">အထူးပြု ဘာသာစကား လေ့လာရေး</header>

  <!-- Language Switcher Bar -->
  <div class="lang-bar">
    <button class="lang-btn active" onclick="selectLang('en', this)">🇬🇧 English</button>
    <button class="lang-btn" onclick="selectLang('th', this)">🇹🇭 ไทย (Thai)</button>
    <button class="lang-btn" onclick="selectLang('ja', this)">🇯🇵 日本語 (Japanese)</button>
    <button class="lang-btn" onclick="selectLang('de', this)">🇩🇪 Deutsch (German)</button>
    <button class="lang-btn" onclick="selectLang('fr', this)">🇫🇷 Français (French)</button>
  </div>

  <!-- Category Selector Bar -->
  <div class="category-bar">
    <button class="cat-btn active" onclick="selectCategory('all', this)">အားလုံး</button>
    <button class="cat-btn" onclick="selectCategory('daily', this)">☕ နေ့စဉ်သုံး</button>
    <button class="cat-btn" onclick="selectCategory('office', this)">💼 ရုံးသုံး</button>
    <button class="cat-btn" onclick="selectCategory('shop', this)">🛒 ဈေးသုံး/ခရီးသွား</button>
    <button class="cat-btn" onclick="selectCategory('work', this)">🛠️ လုပ်ငန်းခွင်သုံး</button>
    <button class="cat-btn" onclick="selectCategory('school', this)">🎓 ကျောင်းသုံး</button>
  </div>

  <div class="search-box" id="searchArea">
    <input type="text" class="search-input" id="searchBar" placeholder="🔍 စကားလုံး သို့မဟုတ် အဓိပ္ပာယ် ရှာဖွေပါ..." oninput="filterWords()">
  </div>

  <main id="tabVocab">
    <div id="wordsList"></div>
  </main>

  <main id="tabQuiz" style="display: none; text-align: center;">
    <div id="quizContainer">
      <h2 id="quizWord" style="color: var(--primary); font-size: 24px; margin-top: 20px;">-</h2>
      <p style="color: #666;">မှန်ကန်သော မြန်မာအဓိပ္ပာယ်ကို ရွေးပါ</p>
      <div id="quizOptions" style="margin-top: 20px;"></div>
      <button id="btnNextQuiz" onclick="nextQuizQuestion()" style="display:none; width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:16px; margin-top:20px;">နောက်တစ်ခု</button>
    </div>
  </main>

  <div class="nav">
    <button id="navVocab" class="active" onclick="switchTab('vocab')">📖 စကားလုံးများ</button>
    <button id="navQuiz" onclick="switchTab('quiz')">🎯 Quiz စမ်းသပ်ရန်</button>
  </div>

          { cat: "work", word: "Die Überstunden", phonetic: "ဒီ အူးဘာ့ရှ်တွန်းဒန်", meaning: "အချိန်ပို / OT", example: "Ich mache heute Überstunden." },
          // 🎓 ကျောင်းသုံး
          { cat: "school", word: "Die Hausaufgabe", phonetic: "ဒီ ဟောင်းစ်အောင်ဖ်ဂါးဘား", meaning: "အိမ်စာ", example: "Hast du die Hausaufgabe gemacht?" }
        ]
      },
      fr: {
        code: 'fr-FR',
        data: [
          // ☕ နေ့စဉ်သုံး
          { cat: "daily", word: "Comment allez-vous?", phonetic: "ကော်မွန် တာလေ ဗူး", meaning: "နေကောင်းပါသလား?", example: "Bonjour, comment allez-vous?" },
          // 💼 ရုံးသုံး
          { cat: "office", word: "La réunion", phonetic: "လာ ရေအူနီယွန်း", meaning: "အစည်းအဝေး", example: "La réunion commence à dix heures." },
          // 🛒 ဈေးသုံး
          { cat: "shop", word: "C'est combien?", phonetic: "ဆဲ ကုံဘီယန်", meaning: "ဒါ ဘယ်လောက်လဲ?", example: "Ce livre, c'est combien?" },
          { cat: "shop", word: "Payer par carte", phonetic: "ပယေး ပါရ် ကာရ်တ်", meaning: "ကတ်ဖြင့် ငွေရှင်းခြင်း", example: "Je peux payer par carte?" },
          // 🛠️ လုပ်ငန်းခွင်သုံး
          { cat: "work", word: "Heures supplémentaires", phonetic: "အာရ် ဆူပလေမွန်တဲရ်", meaning: "အချိန်ပို / OT", example: "Faire des heures supplémentaires." },
          // 🎓 ကျောင်းသုံး
          { cat: "school", word: "Les devoirs", phonetic: "လေ ဒိုဗွားရ်", meaning: "အိမ်စာ", example: "Fais tes devoirs pour demain." }
        ]
      }
    };

    let currentLang = 'en';
    let currentCategory = 'all';
    let currentQuizIndex = 0;
    let quizScore = 0;

    const catLabels = {
      daily: "☕ နေ့စဉ်သုံး",
      office: "💼 ရုံးသုံး",
      shop: "🛒 ဈေးသုံး",
      work: "🛠️ လုပ်ငန်းခွင်",
      school: "🎓 ကျောင်းသုံး"
    };

    function selectLang(lang, btn) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterWords();
    }

    function selectCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterWords();
    }

    function speakWord(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = database[currentLang].code;
        window.speechSynthesis.speak(utter);
      }
    }

    function renderWords(list) {
      const container = document.getElementById('wordsList');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#888; margin-top:30px;">ဤကဏ္ဍတွင် စကားလုံး မရှိသေးပါ။</p>';
        return;
      }

      list.forEach(item => {
        container.innerHTML += `
          <div class="card">
            <div class="word-row">
              <div>
                <div class="word-text">${item.word}</div>
                <div class="phonetic">${item.phonetic}</div>
                <span class="badge">${catLabels[item.cat] || item.cat}</span>
              </div>
              <button class="btn-speak" onclick="speakWord('${item.word.replace(/'/g, "\\'")}')">🔊</button>
            </div>
            <div class="meaning">မြန်မာအဓိပ္ပာယ်: ${item.meaning}</div>
            <div class="example">ဥပမာ: ${item.example}</div>
          </div>
        `;
      });
    }

    function filterWords() {
      const query = document.getElementById('searchBar').value.toLowerCase().trim();
      let list = database[currentLang].data;

      if (currentCategory !== 'all') {
        list = list.filter(item => item.cat === currentCategory);
      }

      if (query) {
        list = list.filter(item => 
          item.word.toLowerCase().includes(query) || 
          item.meaning.toLowerCase().includes(query) ||
          item.phonetic.toLowerCase().includes(query)
        );
      }
      renderWords(list);
    }

    function switchTab(tab) {
      if (tab === 'vocab') {
        document.getElementById('tabVocab').style.display = 'block';
        document.getElementById('searchArea').style.display = 'block';
        document.getElementById('tabQuiz').style.display = 'none';
        document.getElementById('navVocab').className = 'active';
        document.getElementById('navQuiz').className = '';
      } else {
        document.getElementById('tabVocab').style.display = 'none';
        document.getElementById('searchArea').style.display = 'none';
        document.getElementById('tabQuiz').style.display = 'block';
        document.getElementById('navVocab').className = '';
        document.getElementById('navQuiz').className = 'active';
        startQuiz();
      }
    }

    function startQuiz() {
      currentQuizIndex = 0;
      quizScore = 0;
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const list = database[currentLang].data;
      const current = list[currentQuizIndex];
      document.getElementById('quizWord').innerText = current.word;
      document.getElementById('btnNextQuiz').style.display = 'none';

      let options = [current.meaning];
      let others = list.filter(w => w.meaning !== current.meaning).map(w => w.meaning);
      others.sort(() => 0.5 - Math.random());
      options.push(...others.slice(0, 3));
      options.sort(() => 0.5 - Math.random());

      const optContainer = document.getElementById('quizOptions');
      optContainer.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('div');
        btn.className = 'quiz-option';
        btn.innerText = opt;
        btn.onclick = () => checkQuizAnswer(btn, opt, current.meaning);
        optContainer.appendChild(btn);
      });
    }

    function checkQuizAnswer(btnElement, selected, correct) {
      const allBtns = document.querySelectorAll('.quiz-option');
      allBtns.forEach(b => b.onclick = null);

      if (selected === correct) {
        btnElement.classList.add('correct');
        quizScore++;
      } else {
        btnElement.classList.add('wrong');
        allBtns.forEach(b => {
          if (b.innerText === correct) b.classList.add('correct');
        });
      }
      document.getElementById('btnNextQuiz').style.display = 'block';
    }

    function nextQuizQuestion() {
      const list = database[currentLang].data;
      if (currentQuizIndex < list.length - 1) {
        currentQuizIndex++;
        renderQuizQuestion();
      } else {
        document.getElementById('quizContainer').innerHTML = `
          <h2>🎉 Quiz ပြီးဆုံးပါပြီ!</h2>
          <p style="font-size: 20px; font-weight: bold; margin: 20px 0;">ရမှတ်: ${quizScore} / ${list.length}</p>
          <button onclick="startQuiz()" style="padding:12px 24px; background:var(--primary); color:white; border:none; border-radius:8px; font-size:16px;">ပြန်လည်ဖြေဆိုမည်</button>
        `;
      }
    }

    filterWords();
  </script>
</body>
</html>

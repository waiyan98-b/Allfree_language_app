<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoMaster - Complete CEFR A1 to C2</title>
  <style>
    :root {
      --green: #58cc02;
      --green-dark: #46a302;
      --green-light: #d7ffb8;
      --blue: #1cb0f6;
      --blue-dark: #0f86be;
      --purple: #a435f0;
      --purple-dark: #7b1fa2;
      --gold: #ffc800;
      --gold-dark: #cc9a00;
      --red: #ff4b4b;
      --red-light: #ffdfe0;
      --gray: #e5e5e5;
      --text: #2f2f2f;
      --bg: #f7f9fa;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: white;
      border-bottom: 2px solid var(--gray);
      font-weight: bold;
      font-size: 14px;
    }
    .lang-select {
      border: 2px solid var(--gray);
      border-radius: 10px;
      padding: 4px 8px;
      font-weight: bold;
      font-size: 13px;
      outline: none;
    }
    .stats-row { display: flex; gap: 12px; align-items: center; }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      padding-bottom: 75px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* CEFR Level Filter Bar */
    .cefr-tabs {
      display: flex;
      overflow-x: auto;
      width: 100%;
      max-width: 480px;
      gap: 6px;
      padding-bottom: 10px;
      margin-bottom: 8px;
    }
    .cefr-tab-btn {
      flex: 0 0 auto;
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid #ccc;
      background: white;
      font-weight: bold;
      font-size: 13px;
      color: #666;
      cursor: pointer;
    }
    .cefr-tab-btn.active {
      background: var(--blue);
      color: white;
      border-color: var(--blue-dark);
    }
    .chapter-card {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 2px solid var(--gray);
      box-shadow: 0 3px 0 var(--gray);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .chapter-card:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gray); }
    .chapter-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
      margin-bottom: 4px;
    }
    .badge-a1 { background: var(--green); }
    .badge-a2 { background: #00b0ff; }
    .badge-b1 { background: #00c853; }
    .badge-b2 { background: #ff9100; }
    .badge-c1 { background: var(--purple); }
    .badge-c2 { background: var(--gold-dark); }
    
    /* Interactive Practice Screen */
    .game-container {
      display: none;
      width: 100%;
      max-width: 460px;
      flex-direction: column;
      height: 100%;
    }
    .progress-bar {
      width: 100%;
      height: 12px;
      background: var(--gray);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-fill { height: 100%; width: 0%; background: var(--green); transition: width 0.3s; }
    .speaker-btn {
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 15px;
      box-shadow: 0 3px 0 var(--blue-dark);
      cursor: pointer;
      align-self: flex-start;
      margin-bottom: 12px;
    }
    .prompt-box { font-size: 18px; font-weight: bold; margin-bottom: 16px; line-height: 1.4; }
    .answer-slot {
      min-height: 46px;
      border-bottom: 2px solid var(--gray);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px 0;
      margin-bottom: 20px;
    }
    .word-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .word-bubble {
      background: white;
      border: 2px solid var(--gray);
      box-shadow: 0 3px 0 var(--gray);
      padding: 9px 13px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .word-bubble.used { opacity: 0.2; pointer-events: none; }
    .choice-btn {
      width: 100%;
      background: white;
      border: 2px solid var(--gray);
      box-shadow: 0 3px 0 var(--gray);
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      text-align: left;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .choice-btn.selected { border-color: var(--blue); background: #e1f5fe; }
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 18px;
      background: white;
      border-top: 2px solid var(--gray);
    }
    .btn-action {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      background: var(--green);
      color: white;
      box-shadow: 0 4px 0 var(--green-dark);
      cursor: pointer;
    }
    .feedback-sheet {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
    }
    .feedback-sheet.correct { background: var(--green-light); color: var(--green-dark); }
    .feedback-sheet.wrong { background: var(--red-light); color: var(--red); }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <select class="lang-select" id="langPicker" onchange="changeLanguage()">
      <option value="en">🇬🇧 English</option>
      <option value="th">🇹🇭 Thai</option>
    </select>
    <div class="stats-row">
      <div style="color: #ff9600;">🔥 <span id="streakCount">1</span></div>
      <div style="color: #1cb0f6;">⭐ <span id="xpCount">0</span> XP</div>
      <div style="color: #ff4b4b;">❤️ ∞</div>
    </div>
  </div>

  <main>
    <!-- Curriculum View -->
    <div id="curriculumView" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <!-- CEFR Filter Tabs -->
      <div class="cefr-tabs">
        <button class="cefr-tab-btn active" onclick="filterLevel('ALL', this)">အားလုံး (A1-C2)</button>
        <button class="cefr-tab-btn" onclick="filterLevel('A1', this)">A1 Beginner</button>
        <button class="cefr-tab-btn" onclick="filterLevel('A2', this)">A2 Elementary</button>
        <button class="cefr-tab-btn" onclick="filterLevel('B1', this)">B1 Intermediate</button>
        <button class="cefr-tab-btn" onclick="filterLevel('B2', this)">B2 Upper-Int</button>
        <button class="cefr-tab-btn" onclick="filterLevel('C1', this)">C1 Advanced</button>
        <button class="cefr-tab-btn" onclick="filterLevel('C2', this)">C2 Native</button>
      </div>

      <!-- Chapter List -->
      <div id="chapterContainer" style="width: 100%; max-width: 480px;"></div>
    </div>

    <!-- Practice / Game View -->
    <div id="gameScreen" class="game-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <button class="speaker-btn" onclick="speakCurrent()">🔊 အသံနားထောင်မည်</button>
      <div class="prompt-box" id="promptText">-</div>
      
      <div id="sentenceBuilderArea" style="display: none;">
        <div class="answer-slot" id="answerSlot"></div>
        <div class="word-pool" id="wordPool"></div>
      </div>
      <div id="multipleChoiceArea" style="display: none; width: 100%;"></div>
    </div>
  </main>

  <div class="bottom-bar" id="bottomBar" style="display: none;">
    <button class="btn-action" id="checkBtn" onclick="checkAnswer()">စစ်ဆေးမည် (CHECK)</button>
  </div>

  <div class="feedback-sheet" id="feedbackSheet">
    <div style="font-size: 18px; font-weight: bold;" id="feedbackTitle">အဖြေမှန်ပါတယ်!</div>
    <div id="feedbackDetail" style="font-size: 13px;"></div>
    <button class="btn-action" onclick="nextQuestion()">ဆက်သွားမည် ➡</button>
  </div>

  <script>
    // CEFR Standard Complete Syllabus
    const fullCurriculum = {
      en: {
        voice: 'en-US',
        chapters: [
          // A1
          { level: 'A1', title: 'Chapter 1: နှုတ်ဆက်ခြင်းနှင့် မိတ်ဆက်ခြင်း', desc: 'Basic Greetings & Introductions', q: [
            { type: 'choice', prompt: "'မင်္ဂလာပါ' ၏ အင်္ဂလိပ်စကားလုံးကို ရွေးပါ", audio: "Hello", choices: ["Hello", "Goodbye", "Thanks"], correct: "Hello" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'ကျွန်တော့်နာမည် ဂျွန် ဖြစ်ပါတယ်'", audio: "My name is John", words: ["is", "My", "name", "John"], correct: ["My", "name", "is", "John"] }
          ]},
          { level: 'A1', title: 'Chapter 2: နံပါတ်များ၊ အချိန်နှင့် ရက်စွဲ', desc: 'Numbers, Time & Dates', q: [
            { type: 'choice', prompt: "'What time is it?' ၏ မြန်မာအဓိပ္ပာယ်ကို ရွေးပါ", audio: "What time is it?", choices: ["ဘယ်အချိန်ရှိပြီလဲ?", "ဘယ်သွားမလို့လဲ?", "ဒါ ဘာလဲ?"], correct: "ဘယ်အချိန်ရှိပြီလဲ?" }
          ]},
          { level: 'A1', title: 'Chapter 3: စားသောက်ဆိုင်နှင့် ဈေးဝယ်ခြင်း', desc: 'Food, Restaurant & Shopping', q: [
            { type: 'choice', prompt: "'How much is this?' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "How much is this?", choices: ["ဒါ ဘယ်လောက်ကျပါသလဲ?", "အိမ်သာ ဘယ်မှာလဲ?", "စားလို့ကောင်းလား?"], correct: "ဒါ ဘယ်လောက်ကျပါသလဲ?" }
          ]},
          // A2
          { level: 'A2', title: 'Chapter 1: လမ်းမေးခြင်းနှင့် လမ်းညွှန်ချက်', desc: 'Directions & Places', q: [
            { type: 'choice', prompt: "'Turn left' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Turn left", choices: ["ဘယ်ဘက်သို့ ကွေ့ပါ", "ညာဘက်သို့ ကွေ့ပါ", "တည့်တည့်သွားပါ"], correct: "ဘယ်ဘက်သို့ ကွေ့ပါ" }
          ]},
          { level: 'A2', title: 'Chapter 2: အတိတ်ဖြစ်ရပ်များ ပြောဆိုခြင်း', desc: 'Past Events & Past Tense', q: [
            { type: 'build', prompt: "ဝါကျစီပါ: 'မနေ့က ကျွန်တော် အလုပ်သွားခဲ့တယ်'", audio: "I went to work yesterday", words: ["went", "I", "work", "yesterday", "to"], correct: ["I", "went", "to", "work", "yesterday"] }
          ]},
          // B1
          { level: 'B1', title: 'Chapter 1: သဘောထားနှင့် ထင်မြင်ချက်ပေးခြင်း', desc: 'Expressing Opinions', q: [
            { type: 'choice', prompt: "'In my opinion' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "In my opinion", choices: ["ကျွန်တော့်အမြင်အရတော့", "သေချာပေါက်", "ငြင်းပယ်ပါသည်"], correct: "ကျွန်တော့်အမြင်အရတော့" }
          ]},
          { level: 'B1', title: 'Chapter 2: ရုံးတွင်း ဆက်သွယ်ရေးနှင့် အီးမေးလ်', desc: 'Workplace Communication', q: [
            { type: 'choice', prompt: "'Deadline' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Deadline", choices: ["နောက်ဆုံးသတ်မှတ်ရက်", "အလုပ်ချိန်", "အစည်းအဝေး"], correct: "နောက်ဆုံးသတ်မှတ်ရက်" }
          ]},
          // B2
          { level: 'B2', title: 'Chapter 1: အလုပ်အင်တာဗျူးနှင့် အရည်အချင်း', desc: 'Job Interviews & Negotiation', q: [
            { type: 'choice', prompt: "'Strengths and weaknesses' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Strengths and weaknesses", choices: ["အားသာချက်နှင့် အားနည်းချက်များ", "လစာနှင့် အပိုဆုကြေး", "အတွေ့အကြုံများ"], correct: "အားသာချက်နှင့် အားနည်းချက်များ" }
          ]},
          // C1
          { level: 'C1', title: 'Chapter 1: အဆင့်မြင့် စီမံခန့်ခွဲမှုနှင့် မဟာဗျူဟာ', desc: 'Strategic & Professional Mastery', q: [
            { type: 'choice', prompt: "'Feasibility study' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "Feasibility study", choices: ["ဖြစ်မြောက်နိုင်စွမ်း လေ့လာဆန်းစစ်ချက်", "ငွေကြေးစာရင်းဇယား", "ဝန်ထမ်းခေါ်ယူခြင်း"], correct: "ဖြစ်မြောက်နိုင်စွမ်း လေ့လာဆန်းစစ်ချက်" }
          ]},
          // C2
          { level: 'C2', title: 'Chapter 1: Native Idioms & Slang (အထွတ်အထိပ်)', desc: 'Idiomatic Mastery & Cultural Nuances', q: [
            { type: 'choice', prompt: "'Piece of cake' (Native Idiom) ၏ သဘောကို ရွေးပါ", audio: "Piece of cake", choices: ["အရမ်းလွယ်ကူသော အရာ", "ကိတ်မုန့်တစ်တုံး", "အရသာရှိသောအရာ"], correct: "အရမ်းလွယ်ကူသော အရာ" },
            { type: 'build', prompt: "ဝါကျစီပါ: 'Under the weather (နေမကောင်းဖြစ်သည်)'", audio: "I feel under the weather", words: ["under", "I", "weather", "feel", "the"], correct: ["I", "feel", "under", "the", "weather"] }
          ]}
        ]
      },
      th: {
        voice: 'th-TH',
        chapters: [
          { level: 'A1', title: 'Chapter 1: နှုတ်ဆက်ခြင်းနှင့် မိတ်ဆက်ခြင်း', desc: 'Basic Greetings', q: [
            { type: 'choice', prompt: "'မင်္ဂလာပါ' ၏ ထိုင်းစကားကို ရွေးပါ", audio: "สวัสดี", choices: ["สวัสดี (Sawasdee)", "ขอบคุณ (Khob khun)", "อร่อย"], correct: "สวัสดี (Sawasdee)" }
          ]},
          { level: 'A1', title: 'Chapter 2: ဈေးဝယ်ခြင်းနှင့် ဈေးနှုန်း', desc: 'Shopping & Prices', q: [
            { type: 'choice', prompt: "'ဒါ ဘယ်လောက်လဲ' ကို ရွေးပါ", audio: "อันนี้เท่าไหร่", choices: ["อันนี้เท่าไหร่", "ลดได้ไหม", "แพง"], correct: "อันนี้เท่าไหร่" }
          ]},
          { level: 'B1', title: 'Chapter 1: လုပ်ငန်းခွင်နှင့် အစည်းအဝေး', desc: 'Workplace & Meeting', q: [
            { type: 'choice', prompt: "'အစည်းအဝေး' ၏ ထိုင်းစကားကို ရွေးပါ", audio: "การประชุม", choices: ["การประชุม (Pra-chum)", "เงินเดือน", "ลาพักร้อน"], correct: "การประชุม (Pra-chum)" }
          ]},
          { level: 'C2', title: 'Chapter 1: Native Slang & Idioms', desc: 'Native Expressions', q: [
            { type: 'choice', prompt: "'ใจเย็นๆ (Jai yen yen)' ၏ အဓိပ္ပာယ်ကို ရွေးပါ", audio: "ใจเย็นๆ", choices: ["စိတ်အေးအေးထားပါ", "ရေသောက်ပါ", "ဗိုက်ဆာတယ်"], correct: "စိတ်အေးအေးထားပါ" }
          ]}
        ]
      }
    };

    let curLang = 'en';
    let curLevelFilter = 'ALL';
    let xp = parseInt(localStorage.getItem('lingo_xp')) || 0;
    let streak = 1;

    let activeChapter = null;
    let curQIndex = 0;
    let userSelectedChoice = '';
    let userBuiltSentence = [];

    document.getElementById('xpCount').innerText = xp;

    function renderChapters() {
      const container = document.getElementById('chapterContainer');
      container.innerHTML = '';
      const list = fullCurriculum[curLang].chapters;

      const filtered = (curLevelFilter === 'ALL') ? list : list.filter(c => c.level === curLevelFilter);

      filtered.forEach((ch, index) => {
        container.innerHTML += `
          <div class="chapter-card" onclick="startChapter(${index})">
            <div>
              <span class="chapter-badge badge-${ch.level.toLowerCase()}">${ch.level}</span>
              <div style="font-weight: bold; font-size: 15px; color: var(--text);">${ch.title}</div>
              <div style="font-size: 12px; color: #777; margin-top: 2px;">${ch.desc} (${ch.q.length} Questions)</div>
            </div>
            <div style="font-size: 20px; color: var(--blue);">➔</div>
          </div>
        `;
      });
    }

    function filterLevel(lvl, btn) {
      curLevelFilter = lvl;
      document.querySelectorAll('.cefr-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderChapters();
    }

    function changeLanguage() {
      curLang = document.getElementById('langPicker').value;
      renderChapters();
    }

    function speakText(text) {
      if ('speechSynthesis' in window && text) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text.replace(/\(.*\)/, '').trim());
        utter.lang = fullCurriculum[curLang].voice;
        window.speechSynthesis.speak(utter);
      }
    }

    function startChapter(idx) {
      const list = (curLevelFilter === 'ALL') ? fullCurriculum[curLang].chapters : fullCurriculum[curLang].chapters.filter(c => c.level === curLevelFilter);
      activeChapter = list[idx];
      curQIndex = 0;

      document.getElementById('curriculumView').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'flex';
      document.getElementById('bottomBar').style.display = 'flex';

      loadQuestion();
    }

    function loadQuestion() {
      const q = activeChapter.q[curQIndex];
      const totalQ = activeChapter.q.length;
      document.getElementById('progressFill').style.width = `${(curQIndex / totalQ) * 100}%`;
      document.getElementById('promptText').innerText = q.prompt;
      userSelectedChoice = '';
      userBuiltSentence = [];

      if (q.audio) speakText(q.audio);

      if (q.type === 'choice') {
        document.getElementById('sentenceBuilderArea').style.display = 'none';
        const choiceArea = document.getElementById('multipleChoiceArea');
        choiceArea.style.display = 'block';
        choiceArea.innerHTML = '';

        q.choices.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.innerText = c;
          btn.onclick = () => {
            document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            userSelectedChoice = c;
            speakText(c);
          };
          choiceArea.appendChild(btn);
        });
      } else if (q.type === 'build') {
        document.getElementById('multipleChoiceArea').style.display = 'none';
        document.getElementById('sentenceBuilderArea').style.display = 'block';
        
        const slot = document.getElementById('answerSlot');
        const pool = document.getElementById('wordPool');
        slot.innerHTML = '';
        pool.innerHTML = '';

        q.words.forEach(w => {
          const bubble = document.createElement('div');
          bubble.className = 'word-bubble';
          bubble.innerText = w;
          bubble.onclick = () => {
            if (!bubble.classList.contains('used')) {
              bubble.classList.add('used');
              userBuiltSentence.push(w);
              speakText(w);

              const slotWord = document.createElement('div');
              slotWord.className = 'word-bubble';
              slotWord.innerText = w;
              slotWord.onclick = () => {
                slot.removeChild(slotWord);
                bubble.classList.remove('used');
                userBuiltSentence = userBuiltSentence.filter(item => item !== w);
              };
              slot.appendChild(slotWord);
            }
          };
          pool.appendChild(bubble);
        });
      }
    }

    function speakCurrent() {
      const q = activeChapter.q[curQIndex];
      if (q.audio) speakText(q.audio);
    }

    function checkAnswer() {
      const q = activeChapter.q[curQIndex];
      let isCorrect = false;

      if (q.type === 'choice') {
        if (!userSelectedChoice) return alert('အဖြေတစ်ခုကို အရင်ရွေးချယ်ပါ!');
        isCorrect = (userSelectedChoice === q.correct);
      } else if (q.type === 'build') {
        if (userBuiltSentence.length === 0) return alert('စကားလုံးများကို စီပေးပါ!');
        isCorrect = JSON.stringify(userBuiltSentence) === JSON.stringify(q.correct);
      }

      const sheet = document.getElementById('feedbackSheet');
      const title = document.getElementById('feedbackTitle');
      const detail = document.getElementById('feedbackDetail');

      sheet.style.display = 'flex';

      if (isCorrect) {
        sheet.className = 'feedback-sheet correct';
        title.innerText = '🎉 အဖြေမှန်ပါတယ်!';
        detail.innerText = '';
        xp += 15;
        localStorage.setItem('lingo_xp', xp);
        document.getElementById('xpCount').innerText = xp;
      } else {
        sheet.className = 'feedback-sheet wrong';
        title.innerText = '❌ မှားသွားပါတယ် (ထပ်မံကြိုးစားပါ)';
        detail.innerText = `မှန်ကန်သော အဖြေ: ${Array.isArray(q.correct) ? q.correct.join(' ') : q.correct}`;
      }
    }

    function nextQuestion() {
      document.getElementById('feedbackSheet').style.display = 'none';
      if (curQIndex < activeChapter.q.length - 1) {
        curQIndex++;
        loadQuestion();
      } else {
        alert('🏆 ဂုဏ်ယူပါတယ်! ဤ Chapter ကို အောင်မြင်စွာ ပြီးဆုံးပါပြီ။ (+25 Bonus XP)');
        xp += 25;
        localStorage.setItem('lingo_xp', xp);
        document.getElementById('xpCount').innerText = xp;
        backToCurriculum();
      }
    }

    function backToCurriculum() {
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('bottomBar').style.display = 'none';
      document.getElementById('curriculumView').style.display = 'flex';
      renderChapters();
    }

    renderChapters();
  </script>
</body>
</html>


<!DOCTYPE html>
<html lang="my" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>LingoMaster — Thai Master (240 Units Edition)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Serif+Thai:wght@400;600;700;800;900&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4F46E5; --primary-hover: #4338CA; --primary-light: #EEF2FF;
      --success: #10B981; --success-light: #ECFDF5; --error: #EF4444; --error-light: #FEF2F2;
      --bg-main: #F8FAFC; --bg-card: #FFFFFF; --text-main: #0F172A; --text-muted: #64748B;
      --border-color: #E2E8F0; --radius-md: 12px; --radius-lg: 16px; --radius-full: 9999px;
      --font-base: 'Plus Jakarta Sans', 'Padauk', 'Noto Serif Thai', sans-serif;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    [data-theme="dark"] {
      --bg-main: #0B0F19; --bg-card: #151D2F; --text-main: #F9FAFB; --text-muted: #94A3B8;
      --border-color: #1F293D; --primary-light: #1E1B4B; --success-light: #064E3B; --error-light: #7F1D1D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: var(--font-base); background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; line-height: 1.5; }
    .thai-txt { font-family: 'Noto Serif Thai', serif !important; }
    .app-layout { display: flex; flex-direction: column; min-height: 100vh; }
    .app-header { position: sticky; top: 0; z-index: 40; display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background-color: var(--bg-card); border-bottom: 1px solid var(--border-color); }
    .brand { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.15rem; color: var(--primary); }
    .header-actions { display: flex; align-items: center; gap: 0.4rem; }
    .stat-pill { display: flex; align-items: center; gap: 0.3rem; background: var(--bg-main); padding: 0.3rem 0.6rem; border-radius: var(--radius-full); font-weight: 700; font-size: 0.8rem; border: 1px solid var(--border-color); }
    .icon-btn { background: transparent; border: none; font-size: 1.1rem; cursor: pointer; padding: 0.35rem; border-radius: 8px; color: var(--text-main); }
    .lang-switcher-btn { font-weight: 700; font-size: 0.75rem; padding: 0.3rem 0.6rem; border-radius: var(--radius-full); border: 1px solid var(--border-color); background: var(--bg-main); cursor: pointer; color: var(--text-main); }
    .main-content { flex: 1; padding: 1rem 0.85rem 5.5rem 0.85rem; max-width: 860px; width: 100%; margin: 0 auto; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: var(--bg-card); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 50; }
    .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: transparent; border: none; color: var(--text-muted); font-size: 0.72rem; font-weight: 600; gap: 0.2rem; height: 100%; cursor: pointer; transition: var(--transition); }
    .nav-item.active { color: var(--primary); }
    .card { background: var(--bg-card); border-radius: var(--radius-lg); padding: 1.1rem; border: 1px solid var(--border-color); margin-bottom: 1rem; }
    .primary-btn { background: var(--primary); color: #fff; border: none; padding: 0.7rem 1.1rem; border-radius: var(--radius-md); font-weight: 700; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; transition: var(--transition); min-height: 42px; }
    .primary-btn:hover:not(:disabled) { background: var(--primary-hover); }
    .primary-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-large { width: 100%; font-size: 1rem; padding: 0.8rem; }
    .secondary-btn { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); padding: 0.45rem 0.75rem; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; font-size: 0.8rem; }
    .progress-bar-container { width: 100%; height: 7px; background: var(--border-color); border-radius: var(--radius-full); overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #818CF8); border-radius: var(--radius-full); transition: width 0.4s ease; }
    .chapter-banner { width: 100%; height: 120px; border-radius: var(--radius-md); object-fit: cover; margin-bottom: 0.75rem; }
    
    .matching-container { display: grid; grid-template-columns: 1fr 1fr; gap: 0.65rem; margin-top: 0.85rem; }
    .matching-col { display: flex; flex-direction: column; gap: 0.65rem; }
    .match-item { background: var(--bg-card); border: 1.5px solid var(--border-color); padding: 0.6rem 0.4rem; border-radius: var(--radius-md); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; min-height: 64px; height: 64px; text-align: center; transition: var(--transition); }
    .match-item.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .match-item.matched { opacity: 0.25; border-color: var(--success); pointer-events: none; }
    
    .options-grid { display: grid; grid-template-columns: 1fr; gap: 0.65rem; }
    .option-btn { background: var(--bg-card); border: 1.5px solid var(--border-color); padding: 0.85rem; border-radius: var(--radius-md); font-size: 1rem; font-weight: 600; text-align: left; cursor: pointer; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; transition: var(--transition); }
    .option-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .sentence-construction-zone { background: var(--bg-main); border: 2px dashed var(--border-color); margin-bottom: 1rem; min-height: 50px; display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.6rem; border-radius: var(--radius-md); align-items: center; }
    .word-bank { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .word-chip { padding: 0.5rem 0.8rem; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--text-main); font-size: 0.95rem; }
    .word-chip.used { opacity: 0.3; pointer-events: none; }
    
    .chat-bubble { max-width: 85%; padding: 0.75rem 0.9rem; border-radius: 14px; margin-bottom: 0.65rem; display: flex; flex-direction: column; gap: 0.2rem; }
    .chat-bubble.left { align-self: flex-start; background: var(--bg-main); border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }
    .chat-bubble.right { align-self: flex-end; background: var(--primary-light); color: var(--primary); border-bottom-right-radius: 4px; border: 1px solid rgba(79, 70, 229, 0.2); }
    
    .drawing-pad-box { border: 1.5px solid var(--border-color); border-radius: var(--radius-md); background: #fff; touch-action: none; width: 100%; max-width: 300px; height: 200px; margin: 0.75rem auto; display: block; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 100; display: flex; justify-content: center; align-items: center; }
    .modal-overlay.hidden { display: none; }
    .lesson-dialog { background: var(--bg-card); width: 100%; height: 100%; max-width: 650px; display: flex; flex-direction: column; }
    @media (min-width: 768px) { .lesson-dialog { height: 88vh; border-radius: var(--radius-lg); overflow: hidden; } }
    .lesson-header { display: flex; align-items: center; padding: 0.75rem 1rem; gap: 0.75rem; border-bottom: 1px solid var(--border-color); }
    .lesson-body { flex: 1; padding: 1.1rem; overflow-y: auto; display: flex; flex-direction: column; }
    .feedback-banner { padding: 0.75rem 1rem; border-top: 1px solid var(--border-color); }
    .feedback-banner.correct { background: var(--success-light); color: #065F46; }
    .feedback-banner.incorrect { background: var(--error-light); color: #991B1B; }
    .audio-btn { background: var(--primary-light); border: none; color: var(--primary); width: 40px; height: 40px; border-radius: var(--radius-full); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.1rem; }
    
    .script-tabs { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 0.85rem; }
    .script-tab-btn { padding: 0.4rem 0.75rem; border-radius: var(--radius-full); border: 1px solid var(--border-color); background: var(--bg-card); font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap; color: var(--text-main); }
    .script-tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .grid-thai-compact { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
    .thai-compact-card { background: var(--bg-card); border: 1.5px solid var(--border-color); padding: 0.65rem 0.25rem; text-align: center; border-radius: 10px; cursor: pointer; transition: var(--transition); }
    .thai-compact-card:active { transform: scale(0.96); background: var(--primary-light); }
    .thai-compact-char { font-family: 'Noto Serif Thai', serif !important; font-size: 1.45rem; font-weight: 700; color: var(--primary); line-height: 1.2; }
    .thai-compact-sub { font-family: 'Noto Serif Thai', serif !important; font-size: 0.75rem; font-weight: 600; color: var(--text-main); margin-top: 3px; }
    
    .mic-btn { width: 64px; height: 64px; border-radius: var(--radius-full); background: var(--primary); color: #fff; border: none; font-size: 1.8rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin: 0.85rem auto; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35); }
    .mic-btn.listening { background: var(--error); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
  </style>
</head>
<body>
  <div id="app" class="app-layout">
    <header class="app-header">
      <div class="brand"><span>🇹🇭</span><span>Thai Master</span></div>
      <div class="header-actions">
        <button id="uiLangToggleBtn" class="lang-switcher-btn">🇲🇲 မြန်မာ</button>
        <div class="stat-pill">🔥 <span id="streakCount">1</span></div>
        <div class="stat-pill">⭐ <span id="totalXpCount">0</span></div>
        <button id="themeToggleBtn" class="icon-btn">🌙</button>
      </div>
    </header>

    <main id="mainContainer" class="main-content"></main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="learn"><span style="font-size:1.15rem;">📚</span><span data-i18n="nav_learn">Learn</span></button>
      <button class="nav-item" data-view="script"><span style="font-size:1.15rem;">✍️</span><span data-i18n="nav_script">Script & Reading</span></button>
      <button class="nav-item" data-view="vocab"><span style="font-size:1.15rem;">📖</span><span data-i18n="nav_vocab">Vocab</span></button>
      <button class="nav-item" data-view="progress"><span style="font-size:1.15rem;">📊</span><span data-i18n="nav_progress">Progress</span></button>
      <button class="nav-item" data-view="settings"><span style="font-size:1.15rem;">⚙️</span><span data-i18n="nav_settings">Settings</span></button>
    </nav>
  </div>

  <div id="lessonModal" class="modal-overlay hidden">
    <div class="modal-dialog lesson-dialog">
      <header class="lesson-header">
        <button id="closeLessonBtn" class="icon-btn">✕</button>
        <div class="progress-bar-container" style="flex:1;">
          <div id="lessonProgressBar" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
        <div id="lessonStepIndicator" style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted);">Step 1/15</div>
      </header>
      
      <div id="lessonContainer" class="lesson-body"></div>
      
      <footer class="lesson-footer">
        <div id="feedbackBanner" class="feedback-banner hidden">
          <div style="display:flex; align-items:flex-start; gap:0.5rem;">
            <span id="feedbackIcon" style="font-size:1.2rem;">✓</span>
            <div>
              <strong id="feedbackTitle">Correct!</strong>
              <p id="feedbackExplanation" style="font-size:0.8rem;"></p>
            </div>
          </div>
        </div>
        <div style="padding: 0.75rem 1rem;">
          <button id="lessonActionBtn" class="primary-btn btn-large" disabled>Check</button>
        </div>
      </footer>
    </div>
  </div>

  <script>
    // CHAPTER 1: COMPLETE 20 REAL UNITS
    const CHAPTER_1_UNITS = [
      {
        id: "th-c1-u1",
        title: { my: "Unit 1.1: ထိုင်းဘာသာနှင့် ယဉ်ကျေးမှု မိတ်ဆက်", en: "Unit 1.1: Language & Culture Intro" },
        vocabulary: [
          { word: "ภาษาไทย", roman: "phaa-sǎa-thai", meaning: { my: "ထိုင်းဘာသာစကား", en: "Thai language" } },
          { word: "คนไทย", roman: "khon-thai", meaning: { my: "ထိုင်းလူမျိုး", en: "Thai person" } }
        ],
        grammar: {
          title: { my: "ထိုင်းဝါကျဖွဲ့စည်းပုံ (S-V-O)", en: "Basic S-V-O Order" },
          rule: "ကတ္တား + ကြိယာ + ကံ (Subject + Verb + Object)",
          explanation: { my: "ထိုင်းဘာသာစကားသည် အင်္ဂလိပ်စာကဲ့သို့ ကတ္တားပြီးလျှင် ကြိယာ၊ ထို့နောက်မှ ကံပုဒ် လာပါသည်။", en: "Thai follows English Subject-Verb-Object word order." }
        },
        dialogue: {
          title: { my: "မိတ်ဆက် စကားပြောခန်း", en: "Intro Dialogue" },
          lines: [
            { speaker: "Somchai", thai: "สวัสดีครับ ผมคนไทยครับ", roman: "sà-wàt-dii khráp, phǒm khon-thai khráp", trans: { my: "မင်္ဂလာပါခင်ဗျာ၊ ကျွန်တော်က ထိုင်းလူမျိုးပါခင်ဗျာ။", en: "Hello, I am Thai." } }
          ]
        },
        aiRoleplay: {
          prompt: { my: "🤖 AI Partner နှင့် စကားပြော လေ့ကျင့်ပါ:", en: "🤖 AI Roleplay Practice:" },
          aiLine: "สวัสดีครับ เรียนภาษาไทยไหมครับ",
          aiRoman: "sà-wàt-dii khráp, rian phaa-sǎa-thai mǎi khráp",
          aiMeaning: { my: "မင်္ဂလာပါခင်ဗျာ၊ ထိုင်းစာ လေ့လာနေတာလားခင်ဗျာ", en: "Hello, are you learning Thai?" },
          expectedReply: "เรียนภาษาไทยค่ะ",
          expectedRoman: "rian phaa-sǎa-thai khâ",
          replyMeaning: { my: "ထိုင်းစာ လေ့လာနေပါတယ်ရှင့်", en: "I am learning Thai" }
        },
        exercises: [
          {
            type: "matching_pairs",
            prompt: { my: "🔊 အသံလှိုင်းများကို နှိပ်ပြီး တွဲစပ်ပါ:", en: "🔊 Tap matching pairs:" },
            pairs: [
              { id: "p1", audio: "ภาษาไทย", thai: "ภาษาไทย", text: { my: "ထိုင်းဘာသာစကား", en: "Thai language" } },
              { id: "p2", audio: "คนไทย", thai: "คนไทย", text: { my: "ထိုင်းလူမျိုး", en: "Thai person" } }
            ]
          },
          {
            type: "duolingo_listen",
            prompt: { my: "🎧 အသံနားထောင်ပြီး စကားလုံးများကို တည်ဆောက်ပါ:", en: "🎧 Listen and build sentence:" },
            sentence: "ภาษาไทย คนไทย",
            words: ["คนไทย", "ไม่", "ภาษาไทย"],
            correctSequence: ["ภาษาไทย", "คนไทย"]
          },
          {
            type: "speaking",
            prompt: { my: "🎙️ အသံထွက်ဖတ်ပါ: \"ภาษาไทย\"", en: "🎙️ Speak: \"ภาษาไทย\"" },
            targetText: "ภาษาไทย",
            roman: "phaa-sǎa-thai"
          }
        ],
        quiz: [
          {
            type: "mcq",
            prompt: { my: "ထိုင်းဝါကျတည်ဆောက်ပုံမှာ မည်သည့်ပုံစံဖြစ်သနည်း?", en: "What is Thai word order?" },
            options: ["Subject + Verb + Object", "Subject + Object + Verb"],
            correct: 0
          }
        ]
      },
      {
        id: "th-c1-u2",
        title: { my: "Unit 1.2: နှုတ်ဆက်ခြင်းနှင့် ယဉ်ကျေးစကားလုံးများ", en: "Unit 1.2: Hello & Polite Particles" },
        vocabulary: [
          { word: "สวัสดี", roman: "sà-wàt-dii", meaning: { my: "မင်္ဂလာပါ", en: "Hello" } },
          { word: "ครับ", roman: "khráp", meaning: { my: "ခင်ဗျာ (ကျား)", en: "Male polite" } },
          { word: "ค่ะ", roman: "khâ", meaning: { my: "ရှင့် (မ)", en: "Female polite" } }
        ],
        grammar: {
          title: { my: "ครับ နှင့် ค่ะ အသုံးပြုပုံ", en: "Using ครับ and ค่ะ" },
          rule: "ဝါကျအဆုံးတွင် ယဉ်ကျေးမှုအတွက် ထည့်သုံးရသည်။",
          explanation: { my: "အမျိုးသားက ครับ သုံး၍၊ အမျိုးသမီးက ค่ะ ကို သုံးရပါမည်။", en: "Men end with ครับ, women with ค่ะ." }
        },
        dialogue: {
          title: { my: "ယဉ်ကျေးစွာ နှုတ်ဆက်ခြင်း", en: "Polite Greeting" },
          lines: [
            { speaker: "A", thai: "สวัสดีครับ", roman: "sà-wàt-dii khráp", trans: { my: "မင်္ဂလာပါခင်ဗျာ", en: "Hello sir" } },
            { speaker: "B", thai: "สวัสดีค่ะ", roman: "sà-wàt-dii khâ", trans: { my: "မင်္ဂလာပါရှင့်", en: "Hello ma'am" } }
          ]
        },
        aiRoleplay: {
          prompt: { my: "🤖 AI Partner:", en: "🤖 AI Partner:" },
          aiLine: "สวัสดีครับ",
          aiRoman: "sà-wàt-dii khráp",
          aiMeaning: { my: "မင်္ဂလာပါခင်ဗျာ", en: "Hello sir" },
          expectedReply: "สวัสดีค่ะ",
          expectedRoman: "sà-wàt-dii khâ",
          replyMeaning: { my: "မင်္ဂလာပါရှင့်", en: "Hello ma'am" }
        },
        exercises: [
          {
            type: "matching_pairs",
            prompt: { my: "🔊 တွဲစပ်ပါ:", en: "🔊 Match pairs:" },
            pairs: [
              { id: "p1", audio: "สวัสดี", thai: "สวัสดี", text: { my: "မင်္ဂလာပါ", en: "Hello" } },
              { id: "p2", audio: "ครับ", thai: "ครับ", text: { my: "ခင်ဗျာ", en: "Polite male" } },
              { id: "p3", audio: "ค่ะ", thai: "ค่ะ", text: { my: "ရှင့်", en: "Polite female" } }
            ]
          },
          {
            type: "speaking",
            prompt: { my: "🎙️ အသံထွက်ဖတ်ပါ: \"สวัสดีครับ\"", en: "🎙️ Speak: \"สวัสดีครับ\"" },
            targetText: "สวัสดีครับ",
            roman: "sà-wàt-dii khráp"
          }
        ],
        quiz: [
          {
            type: "mcq",
            prompt: { my: "အမျိုးသမီးများ သုံးရမည့် ယဉ်ကျေးစကားလုံးမှာ?", en: "Female polite ending:" },
            options: ["ค่ะ", "ครับ", "นะ"],
            correct: 0
          }
        ]
      },
      {
        id: "th-c1-u3",
        title: { my: "Unit 1.3: နှုတ်ဆက်ခွဲခွာခြင်း (Goodbye)", en: "Unit 1.3: Goodbye & Courtesy" },

    const STORAGE_KEY = 'lingomaster_thai_edition_v1';

    const StorageManager = {
      load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : DEFAULT_STATE;
        } catch(e) { return DEFAULT_STATE; }
      },
      save(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }
    };

    const AudioManager = {
      speak(text, rate = 0.85) {
        if (!('speechSynthesis' in window) || !text) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'th-TH';
        utter.rate = rate;
        window.speechSynthesis.speak(utter);
      }
    };

    const LessonEngine = {
      lesson: null, stepIndex: 0, steps: [], correctCount: 0, userAnswer: null, orderedWords: [], stateRef: null,
      selectedLeftMatch: null, selectedRightMatch: null, matchPairsCount: 0, currentMatchedPairs: 0,

      start(lessonData, appState) {
        this.lesson = lessonData;
        this.stateRef = appState;
        this.stepIndex = 0;
        this.correctCount = 0;

        this.steps = [
          { type: 'vocab_overview' },
          { type: 'grammar_concept' },
          ...(lessonData.dialogue ? [{ type: 'dialogue', data: lessonData.dialogue }] : []),
          ...(lessonData.aiRoleplay ? [{ type: 'ai_roleplay', data: lessonData.aiRoleplay }] : []),
          ...(lessonData.exercises || []).map(ex => ({ type: 'exercise', data: ex })),
          ...(lessonData.quiz || []).map(q => ({ type: 'quiz', data: q })),
          { type: 'completion' }
        ];

        document.getElementById('lessonModal').classList.remove('hidden');
        this.renderStep();
      },

      renderStep() {
        const lang = this.stateRef.uiLang;
        const t = I18N[lang] || I18N.my;
        const container = document.getElementById('lessonContainer');
        const progressBar = document.getElementById('lessonProgressBar');
        const indicator = document.getElementById('lessonStepIndicator');
        const actionBtn = document.getElementById('lessonActionBtn');
        const banner = document.getElementById('feedbackBanner');

        banner.className = 'feedback-banner hidden';
        actionBtn.disabled = false;
        actionBtn.textContent = t.continue_btn || "Continue";
        actionBtn.onclick = () => this.handleNext();

        const total = this.steps.length;
        progressBar.style.width = `${(this.stepIndex / (total - 1)) * 100}%`;
        indicator.textContent = `Step ${this.stepIndex + 1}/${total}`;

        const step = this.steps[this.stepIndex];
        let html = '';

        if (step.type === 'vocab_overview') {
          html = `
            <h3>📖 ${typeof this.lesson.title === 'object' ? (this.lesson.title[lang] || this.lesson.title.en) : this.lesson.title}</h3>
            <div style="display:flex; flex-direction:column; gap:0.65rem; margin-top:0.85rem;">
              ${(this.lesson.vocabulary || []).map(v => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:0.65rem; padding:0.85rem 1rem;">
                  <div style="flex:1;">
                    <h4 class="thai-txt" style="font-size:1.3rem; cursor:pointer;" onclick="AudioManager.speak('${v.word}')">${v.word} 🔊</h4>
                    <small style="color:var(--primary); font-weight:700;">[${v.roman}]</small>
                    <p style="color:var(--text-muted); font-size:0.85rem;">${typeof v.meaning === 'object' ? (v.meaning[lang] || v.meaning.en) : v.meaning}</p>
                  </div>
                  <button class="audio-btn" onclick="AudioManager.speak('${v.word}')">🔊</button>
                </div>
              `).join('')}
            </div>
          `;
        } else if (step.type === 'grammar_concept') {
          const g = this.lesson.grammar;
          const gTitle = typeof g.title === 'object' ? (g.title[lang] || g.title.en) : g.title;
          const gRule = typeof g.rule === 'object' ? (g.rule[lang] || g.rule.en) : g.rule;
          const gExp = typeof g.explanation === 'object' ? (g.explanation[lang] || g.explanation.en) : g.explanation;

          html = `
            <div class="card">
              <h3>📐 ${gTitle}</h3>
              <div style="margin: 0.85rem 0; padding:0.85rem; background:var(--bg-main); border-radius:var(--radius-md);">
                <strong>Rule:</strong> ${gRule}
              </div>
              <p style="color:var(--text-muted); font-size:0.9rem;">${gExp}</p>
            </div>
          `;
        } else if (step.type === 'dialogue') {
          const d = step.data;
          html = `
            <h3>💬 ${d.title[lang] || d.title.en}</h3>
            <div style="display:flex; flex-direction:column; margin-top:0.85rem;">
              ${d.lines.map((l, idx) => `
                <div class="chat-bubble ${idx % 2 === 0 ? 'left' : 'right'}">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong class="thai-txt">${l.speaker}: ${l.thai}</strong>
                    <button class="icon-btn" onclick="AudioManager.speak('${l.thai}')">🔊</button>
                  </div>
                  <small style="color:var(--primary); font-weight:600;">[${l.roman}]</small>
                  <span style="font-size:0.8rem; color:var(--text-muted);">${l.trans[lang] || l.trans.en}</span>
                </div>
              `).join('')}
            </div>
          `;
        } else if (step.type === 'ai_roleplay') {
          const rp = step.data;
          actionBtn.disabled = true;
          actionBtn.textContent = t.check_btn || "Check";
          actionBtn.onclick = () => this.checkAIReply(rp);
          this.userAnswer = null;

          html = `
            <h3>${rp.prompt[lang] || rp.prompt.en}</h3>
            <div class="card" style="margin-top:0.85rem; background:var(--bg-main);">
              <div style="display:flex; align-items:center; gap:0.4rem; margin-bottom:0.3rem;">
                <span style="font-size:1.2rem;">🤖</span>
                <strong>AI Partner:</strong>
                <button class="icon-btn" onclick="AudioManager.speak('${rp.aiLine}')">🔊</button>
              </div>
              <h3 class="thai-txt" style="color:var(--primary); font-size:1.25rem;">"${rp.aiLine}"</h3>
              <small style="color:var(--text-muted);">[${rp.aiRoman}]</small>
              <p style="font-size:0.8rem; color:var(--text-muted); margin-top:0.2rem;">${rp.aiMeaning[lang] || rp.aiMeaning.en}</p>
            </div>

            <div class="card" style="text-align:center; padding:1rem;">
              <p style="font-size:0.85rem; margin-bottom:0.4rem;">👇 သင် ပြန်လည်ပြောဆိုရမည့် စကားလုံး:</p>
              <h3 class="thai-txt" style="color:var(--primary); font-size:1.3rem;">"${rp.expectedReply}"</h3>
              <small style="color:var(--text-muted);">[${rp.expectedRoman}] • ${rp.replyMeaning[lang] || rp.replyMeaning.en}</small>

              <div style="margin-top:0.85rem;">
                <button id="aiMicBtn" class="mic-btn" onclick="LessonEngine.recordAIRoleplay('${rp.expectedReply}')">🎙️</button>
                <div id="aiVoiceStatus" style="font-size:0.8rem; color:var(--text-muted);">Tap mic to speak your reply</div>
              </div>
            </div>
          `;
          setTimeout(() => AudioManager.speak(rp.aiLine), 300);
        } else if (step.type === 'exercise' || step.type === 'quiz') {
          this.renderInteractiveExercise(step.data, container, actionBtn);
          return;
        } else if (step.type === 'completion') {
          this.renderCompletionScreen(container, actionBtn);
          return;
        }

        container.innerHTML = html;
      },

      recordAIRoleplay(expected) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const statusText = document.getElementById('aiVoiceStatus');
        const micBtn = document.getElementById('aiMicBtn');
        const actionBtn = document.getElementById('lessonActionBtn');
        const lang = this.stateRef.uiLang;

        if (!SpeechRec) {
          this.userAnswer = 95;
          statusText.textContent = "Voice detected: 95% Match (Excellent)";
          actionBtn.disabled = false;
          return;
        }

        const recognition = new SpeechRec();
        recognition.lang = 'th-TH';
        recognition.interimResults = false;

        micBtn.classList.add('listening');
        statusText.textContent = I18N[lang].speak_listening;

        recognition.onresult = (event) => {
          const spoken = event.results[0][0].transcript.trim();
          micBtn.classList.remove('listening');
          statusText.textContent = `You replied: "${spoken}"`;

          let score = 0;
          if (spoken.includes(expected) || expected.includes(spoken)) {
            score = 100;
          } else {
            let match = 0;
            for (let c of spoken) { if (expected.includes(c)) match++; }
            score = Math.min(100, Math.round((match / Math.max(expected.length, 1)) * 100));
          }

          this.userAnswer = score;
          actionBtn.disabled = false;
        };

        recognition.onerror = () => {
          micBtn.classList.remove('listening');
          statusText.textContent = "Could not hear clearly. Tap mic to retry.";
        };

        recognition.start();
      },

      checkAIReply(rp) {
        const isCorrect = (this.userAnswer >= 50);
        if (isCorrect) this.correctCount++;

        const banner = document.getElementById('feedbackBanner');
        const title = document.getElementById('feedbackTitle');
        const exp = document.getElementById('feedbackExplanation');
        const actionBtn = document.getElementById('lessonActionBtn');
        const lang = this.stateRef.uiLang;
        const t = I18N[lang] || I18N.my;

        banner.className = `feedback-banner ${isCorrect ? 'correct' : 'incorrect'}`;
        title.textContent = isCorrect ? t.correct : t.incorrect;
        exp.textContent = isCorrect ? "AI conversation partner understood you perfectly!" : "Try speaking clearly closer to the mic.";

        actionBtn.textContent = t.continue_btn || "Continue";
        actionBtn.onclick = () => this.handleNext();
      },

      renderInteractiveExercise(ex, container, actionBtn) {
        const lang = this.stateRef.uiLang;
        const t = I18N[lang] || I18N.my;
        actionBtn.disabled = true;
        actionBtn.textContent = t.check_btn || "Check";
        actionBtn.onclick = () => this.checkCurrentExercise(ex);
        this.userAnswer = null;
        this.orderedWords = [];

        const promptText = typeof ex.prompt === 'object' ? (ex.prompt[lang] || ex.prompt.en) : ex.prompt;
        
        let headerAudioHtml = '';
        if (ex.promptTargetAudio) {
          headerAudioHtml = `
            <div style="display:flex; align-items:center; gap:0.4rem; margin-bottom:1rem; cursor:pointer;" onclick="AudioManager.speak('${ex.promptTargetAudio}')">
              <span class="thai-txt" style="font-weight:700; font-size:1.2rem; color:var(--primary);">${promptText}</span>
              <button class="audio-btn" style="width:34px; height:34px; font-size:0.95rem;">🔊</button>
            </div>
          `;
        } else {
          headerAudioHtml = `<div style="font-weight:700; font-size:1.05rem; margin-bottom:1rem;">${promptText}</div>`;
        }

        let html = headerAudioHtml;

        if (ex.type === 'matching_pairs') {
          this.matchPairsCount = ex.pairs.length;
          this.currentMatchedPairs = 0;
          this.selectedLeftMatch = null;
          this.selectedRightMatch = null;

          const shuffledRight = [...ex.pairs].map(p => ({
            id: p.id,
            thai: p.thai,
            meaning: p.text[lang] || p.text.en
          })).sort(() => Math.random() - 0.5);

          html += `
            <div class="matching-container">
              <div class="matching-col">
                ${ex.pairs.map(p => `
                  <div class="match-item" data-left-id="${p.id}" onclick="LessonEngine.clickLeftMatch(this, '${p.id}', '${p.audio}')">
                    <div style="display:flex; align-items:center; gap:0.35rem; color:var(--primary);">
                      <span style="font-size:1.2rem;">🔊</span>
                      <span style="letter-spacing:2px; font-weight:800; font-size:0.85rem;">ılılıllli</span>
                    </div>
                  </div>
                `).join('')}
              </div>
              <div class="matching-col">
                ${shuffledRight.map(r => `
                  <div class="match-item" data-right-id="${r.id}" onclick="LessonEngine.clickRightMatch(this, '${r.id}')">
                    <span class="thai-txt" style="font-size:1.1rem; font-weight:700;">${r.thai}</span>
                    <small style="color:var(--text-muted); font-size:0.75rem; margin-top:2px;">${r.meaning}</small>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } else if (ex.type === 'duolingo_listen') {
          html += `
            <div style="display:flex; justify-content:center; align-items:center; gap:0.85rem; margin-bottom:1.2rem;">
              <button class="audio-btn" style="width:56px; height:56px; font-size:1.6rem;" onclick="AudioManager.speak('${ex.sentence}', 0.85)">🔊</button>
              <button class="audio-btn" style="width:44px; height:44px; font-size:1.2rem; background:var(--bg-main); border:1px solid var(--border-color);" onclick="AudioManager.speak('${ex.sentence}', 0.5)" title="Slow Audio">🐢</button>
            </div>
            <div id="constructionZone" class="sentence-construction-zone"></div>
            <div id="wordBank" class="word-bank">
              ${ex.words.map(w => `<div class="word-chip thai-txt" onclick="LessonEngine.pickWord(this, '${w}')">${w} 🔊</div>`).join('')}
            </div>
          `;
          setTimeout(() => AudioManager.speak(ex.sentence, 0.85), 300);
        } else if (ex.type === 'mcq') {
          const rawOpts = ex.options;
          const optsList = (rawOpts && typeof rawOpts === 'object' && !Array.isArray(rawOpts)) ? (rawOpts[lang] || rawOpts.en) : rawOpts;
          const audioTargets = ex.audioTargets || [];
          html += `<div class="options-grid">
            ${optsList.map((opt, i) => {
              const speakText = audioTargets[i] || opt;
              return `
                <button class="option-btn thai-txt" onclick="LessonEngine.selectOpt(this, ${i}, '${speakText.replace(/'/g, "\\'")}')">
                  <span>${opt}</span>
                  <span style="font-size:1rem; opacity:0.6;">🔊</span>
                </button>
              `;
            }).join('')}
          </div>`;
        } else if (ex.type === 'speaking') {
          html += `
            <div class="card" style="text-align:center; padding:1.2rem 0.85rem;">
              <h2 class="thai-txt" style="font-size:1.9rem; color:var(--primary);">${ex.targetText}</h2>
              <p style="color:var(--text-muted); font-weight:700; margin:0.25rem 0;">[${ex.roman}]</p>
              <button class="audio-btn" style="margin:0.4rem 0;" onclick="AudioManager.speak('${ex.targetText}')">🔊 Listen First</button>
              <p style="font-size:0.85rem; margin-top:0.6rem;">${t.speak_tap_mic}</p>
              
              <button id="micRecordBtn" class="mic-btn" onclick="LessonEngine.recordVoice('${ex.targetText}')">🎙️</button>
              <div id="speechStatusText" style="font-size:0.8rem; color:var(--text-muted);">Ready to speak</div>
              
              <div id="accuracyContainer" style="margin-top:0.85rem; display:none;">
                <strong>${t.accuracy_label}</strong>
                <h3 id="accuracyScore" style="color:var(--success); font-size:1.35rem;">0%</h3>
              </div>
            </div>
          `;
        } else if (ex.type === 'listening') {
          html += `
            <div style="text-align:center; margin-bottom:1.2rem;">
              <button class="audio-btn" style="width:58px; height:58px; font-size:1.6rem;" onclick="AudioManager.speak('${ex.targetText}')">🔊</button>
            </div>
            <div class="options-grid">
              ${ex.options.map((opt, i) => `
                <button class="option-btn thai-txt" onclick="LessonEngine.selectOpt(this, ${i}, '${opt}')">

                  <span style="font-size:1rem; opacity:0.6;">🔊</span>
                </button>
              `).join('')}
            </div>
          `;
          setTimeout(() => AudioManager.speak(ex.targetText), 250);
        } else if (ex.type === 'word_order') {
          html += `
            <div id="constructionZone" class="sentence-construction-zone"></div>
            <div id="wordBank" class="word-bank">
              ${ex.words.map(w => `<div class="word-chip thai-txt" onclick="LessonEngine.pickWord(this, '${w}')">${w} 🔊</div>`).join('')}
            </div>
          `;
        }

        container.innerHTML = html;
      },

      clickLeftMatch(el, id, audio) {
        AudioManager.speak(audio);
        document.querySelectorAll('[data-left-id]').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        this.selectedLeftMatch = { id, el };
        this.evaluateMatching();
      },

      clickRightMatch(el, id) {
        document.querySelectorAll('[data-right-id]').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        this.selectedRightMatch = { id, el };
        this.evaluateMatching();
      },

      evaluateMatching() {
        if (!this.selectedLeftMatch || !this.selectedRightMatch) return;

        if (this.selectedLeftMatch.id === this.selectedRightMatch.id) {
          this.selectedLeftMatch.el.className = 'match-item matched';
          this.selectedRightMatch.el.className = 'match-item matched';
          this.currentMatchedPairs++;
          this.selectedLeftMatch = null;
          this.selectedRightMatch = null;

          if (this.currentMatchedPairs === this.matchPairsCount) {
            this.userAnswer = true;
            document.getElementById('lessonActionBtn').disabled = false;
          }
        } else {
          const l = this.selectedLeftMatch.el;
          const r = this.selectedRightMatch.el;
          l.style.borderColor = 'var(--error)';
          r.style.borderColor = 'var(--error)';
          setTimeout(() => {
            l.style.borderColor = 'var(--border-color)';
            r.style.borderColor = 'var(--border-color)';
            l.classList.remove('selected');
            r.classList.remove('selected');
          }, 350);
          this.selectedLeftMatch = null;
          this.selectedRightMatch = null;
        }
      },

      selectOpt(el, idx, textToSpeak) {
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        this.userAnswer = idx;
        document.getElementById('lessonActionBtn').disabled = false;

        if (textToSpeak) {
          const cleanText = textToSpeak.replace(/\(.*?\)/g, '').trim();
          AudioManager.speak(cleanText);
        }
      },

      pickWord(el, word) {
        AudioManager.speak(word);
        const zone = document.getElementById('constructionZone');
        const chip = document.createElement('div');
        chip.className = 'word-chip thai-txt';
        chip.textContent = word;
        chip.onclick = () => {
          chip.remove();
          el.classList.remove('used');
          this.orderedWords = this.orderedWords.filter(w => w !== word);
          document.getElementById('lessonActionBtn').disabled = this.orderedWords.length === 0;
        };
        zone.appendChild(chip);
        el.classList.add('used');
        this.orderedWords.push(word);
        document.getElementById('lessonActionBtn').disabled = false;
      },

      recordVoice(targetText) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const statusText = document.getElementById('speechStatusText');
        const micBtn = document.getElementById('micRecordBtn');
        const actionBtn = document.getElementById('lessonActionBtn');
        const lang = this.stateRef.uiLang;

        if (!SpeechRec) {
          this.userAnswer = 95;
          document.getElementById('accuracyContainer').style.display = 'block';
          document.getElementById('accuracyScore').textContent = '95% (Excellent)';
          actionBtn.disabled = false;
          return;
        }

        const recognition = new SpeechRec();
        recognition.lang = 'th-TH';
        recognition.interimResults = false;

        micBtn.classList.add('listening');
        statusText.textContent = I18N[lang].speak_listening;

        recognition.onresult = (event) => {
          const spoken = event.results[0][0].transcript.trim();
          micBtn.classList.remove('listening');
          statusText.textContent = `You said: "${spoken}"`;

          let score = 0;
          if (spoken.includes(targetText) || targetText.includes(spoken)) {
            score = 100;
          } else {
            let match = 0;
            for (let c of spoken) { if (targetText.includes(c)) match++; }
            score = Math.min(100, Math.round((match / Math.max(targetText.length, 1)) * 100));
          }

          this.userAnswer = score;
          document.getElementById('accuracyContainer').style.display = 'block';
          document.getElementById('accuracyScore').textContent = `${score}%`;
          actionBtn.disabled = false;
        };

        recognition.onerror = () => {
          micBtn.classList.remove('listening');
          statusText.textContent = "Could not detect sound. Tap mic to retry.";
        };

        recognition.start();
      },

      checkCurrentExercise(ex) {
        const lang = this.stateRef.uiLang;
        const t = I18N[lang] || I18N.my;
        let isCorrect = false;

        if (ex.type === 'matching_pairs') isCorrect = (this.userAnswer === true);
        else if (ex.type === 'duolingo_listen' || ex.type === 'word_order') isCorrect = (JSON.stringify(this.orderedWords) === JSON.stringify(ex.correctSequence));
        else if (ex.type === 'mcq' || ex.type === 'listening') isCorrect = (this.userAnswer === ex.correct);
        else if (ex.type === 'speaking') isCorrect = (this.userAnswer >= 60);

        if (isCorrect) this.correctCount++;

        const banner = document.getElementById('feedbackBanner');
        const title = document.getElementById('feedbackTitle');
        const exp = document.getElementById('feedbackExplanation');
        const actionBtn = document.getElementById('lessonActionBtn');

        banner.className = `feedback-banner ${isCorrect ? 'correct' : 'incorrect'}`;
        title.textContent = isCorrect ? t.correct : t.incorrect;
        
        let expText = '';
        if (ex.explanation) expText = typeof ex.explanation === 'object' ? (ex.explanation[lang] || ex.explanation.en) : ex.explanation;
        exp.textContent = expText || (isCorrect ? t.great_job : '');

        actionBtn.textContent = t.continue_btn || "Continue";
        actionBtn.onclick = () => this.handleNext();
      },

      handleNext() {
        this.stepIndex++;
        this.renderStep();
      },

      renderCompletionScreen(container, actionBtn) {
        const lang = this.stateRef.uiLang;
        const t = I18N[lang] || I18N.my;
        const isDone = this.stateRef.completedLessons.includes(this.lesson.id);
        const xp = isDone ? 25 : 50;
        this.stateRef.totalXP += xp;

        if (!isDone) this.stateRef.completedLessons.push(this.lesson.id);
        (this.lesson.vocabulary || []).forEach(v => {
          if (!this.stateRef.masteredVocab.find(item => item.id === v.id)) {
            this.stateRef.masteredVocab.push(v);
          }
        });

        StorageManager.save(this.stateRef);
        App.updateUI();

        container.innerHTML = `
          <div style="text-align:center; padding: 1.8rem 0;">
            <span style="font-size: 3.2rem;">🎉</span>
            <h2 style="margin: 0.85rem 0;">Unit Complete!</h2>
            <div class="card" style="max-width: 270px; margin: auto; text-align: left;">
              <p>${t.score}: <strong>${this.correctCount}</strong></p>
              <p>${t.xp_earned}: <strong>+${xp} XP</strong></p>
            </div>
          </div>
        `;

        actionBtn.disabled = false;
        actionBtn.textContent = t.finish_btn || "Finish";
        actionBtn.onclick = () => {
          document.getElementById('lessonModal').classList.add('hidden');
          App.navigate('learn');
        };
      }
    };

    const App = {
      state: StorageManager.load(),
      currentScriptTab: 'consonants',

      init() {
        this.applyLanguage();
        this.updateUI();

        if (this.state.theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.getElementById('themeToggleBtn').textContent = '☀️';
        }

        document.querySelectorAll('.nav-item').forEach(btn => {
          btn.addEventListener('click', (e) => this.navigate(e.currentTarget.getAttribute('data-view')));
        });

        document.getElementById('uiLangToggleBtn').addEventListener('click', () => {
          this.state.uiLang = (this.state.uiLang === 'my') ? 'en' : 'my';
          StorageManager.save(this.state);
          this.applyLanguage();
          this.navigate(document.querySelector('.nav-item.active').getAttribute('data-view'));
        });

        document.getElementById('themeToggleBtn').addEventListener('click', () => {
          const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
          const next = isDark ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          document.getElementById('themeToggleBtn').textContent = isDark ? '🌙' : '☀️';
          this.state.theme = next;
          StorageManager.save(this.state);
        });

        document.getElementById('closeLessonBtn').addEventListener('click', () => {
          document.getElementById('lessonModal').classList.add('hidden');
        });

        this.navigate('learn');
      },

      applyLanguage() {
        const lang = this.state.uiLang;
        document.getElementById('uiLangToggleBtn').textContent = (lang === 'my') ? '🇲🇲 မြန်မာ' : '🇬🇧 English';
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (I18N[lang] && I18N[lang][key]) el.textContent = I18N[lang][key];
        });
      },

      updateUI() {
        document.getElementById('streakCount').textContent = this.state.streak;
        document.getElementById('totalXpCount').textContent = this.state.totalXP;
      },

      navigate(view) {
        document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.getAttribute('data-view') === view));
        const main = document.getElementById('mainContainer');
        main.innerHTML = '';
        if (view === 'learn') this.renderLearn(main);
        else if (view === 'script') this.renderScript(main);
        else if (view === 'vocab') this.renderVocab(main);
        else if (view === 'progress') this.renderProgress(main);
        else if (view === 'settings') this.renderSettings(main);
      },

      renderLearn(main) {
        const lang = this.state.uiLang;
        const t = I18N[lang] || I18N.my;
        const chapters = window.THAI_A1_CHAPTERS || [];

        main.innerHTML = `
          <h2 style="margin-bottom:0.85rem;">🇹🇭 Thai Master (Chapter 1–12 • 240 Units Complete)</h2>
          ${chapters.map(ch => {
            const chTitle = typeof ch.title === 'object' ? (ch.title[lang] || ch.title.en) : ch.title;
            return `
              <div class="card">
                ${ch.coverImage ? `<img src="${ch.coverImage}" class="chapter-banner" alt="${chTitle}">` : ''}
                <h3>${chTitle}</h3>
                <div style="display:flex; flex-direction:column; gap:0.65rem; margin-top:0.75rem;">
                  ${(ch.units || []).map(unit => {
                    const uTitle = typeof unit.title === 'object' ? (unit.title[lang] || unit.title.en) : unit.title;
                    const done = this.state.completedLessons.includes(unit.id);
                    const drillsCount = (unit.exercises?.length || 0) + (unit.quiz?.length || 0) + (unit.dialogue ? 1 : 0) + (unit.aiRoleplay ? 1 : 0);
                    return `
                      <div style="display:flex; justify-content:space-between; align-items:center; padding:0.65rem 0.85rem; background:var(--bg-main); border-radius:var(--radius-md);">
                        <div>
                          <strong style="font-size:0.95rem;">${uTitle}</strong>
                          <div style="font-size:0.75rem; color:var(--text-muted);">${unit.vocabulary?.length || 0} ${t.words_count || 'Words'} • ${drillsCount} Drills & AI Roleplay</div>
                        </div>
                        <button class="primary-btn" style="padding:0.45rem 0.85rem; font-size:0.85rem; min-height:36px;" onclick="App.launchLesson('${unit.id}')">
                          ${done ? (t.review || 'Review') : (t.start || 'Start')}
                        </button>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          }).join('')}
        `;
      },

      renderScript(main) {
        const lang = this.state.uiLang;
        const t = I18N[lang] || I18N.my;
        const activeTab = this.currentScriptTab;
        const currentData = SCRIPT_DATA[activeTab] || [];

        main.innerHTML = `
          <h2>${t.script_title || 'Script & Reading'}</h2>
          <div class="card" style="margin-top:0.85rem;">
            <h3>${t.script_canvas_title || 'Letter Drawing'}</h3>
            <p style="color:var(--text-muted); font-size:0.85rem;">${t.script_canvas_sub || 'Practice strokes below:'}</p>
            <canvas id="paintCanvas" class="drawing-pad-box" width="300" height="200"></canvas>
            <div style="text-align:center;">
              <button class="secondary-btn" onclick="App.clearCanvas()">${t.script_clear || 'Clear'}</button>
            </div>
          </div>

          <div class="script-tabs">
            <button class="script-tab-btn ${activeTab === 'consonants' ? 'active' : ''}" onclick="App.setScriptTab('consonants')">Consonants (ဗျည်းများ)</button>
            <button class="script-tab-btn ${activeTab === 'vowels' ? 'active' : ''}" onclick="App.setScriptTab('vowels')">Vowels (သရများ)</button>
          </div>

          <div class="grid-thai-compact">
            ${currentData.map(item => `
              <div class="thai-compact-card" onclick="AudioManager.speak('${item.speak || item.name}')">
                <div class="thai-compact-char thai-txt">${item.char}</div>
                <div class="thai-compact-sub thai-txt">${item.name}</div>
                <small style="color:var(--text-muted); font-size:0.65rem;">[${item.class}]</small>
              </div>
            `).join('')}
          </div>
        `;

        this.initCanvas();
      },

      setScriptTab(tab) {
        this.currentScriptTab = tab;
        this.renderScript(document.getElementById('mainContainer'));
      },

      initCanvas() {
        const canvas = document.getElementById('paintCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#4F46E5';

        let painting = false;
        function start(e) { painting = true; draw(e); }
        function end() { painting = false; ctx.beginPath(); }
        function draw(e) {
          if (!painting) return;
          const rect = canvas.getBoundingClientRect();
          const clientX = e.clientX || (e.touches && e.touches[0].clientX);
          const clientY = e.clientY || (e.touches && e.touches[0].clientY);
          ctx.lineTo(clientX - rect.left, clientY - rect.top);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(clientX - rect.left, clientY - rect.top);
        }

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mouseup', end);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); start(e); });
        canvas.addEventListener('touchend', end);
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
      },

      clearCanvas() {
        const canvas = document.getElementById('paintCanvas');
        if (canvas) {
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      },

      launchLesson(unitId) {
        for (let ch of (window.THAI_A1_CHAPTERS || [])) {
          const u = (ch.units || []).find(item => item.id === unitId);
          if (u) {
            LessonEngine.start(u, this.state);
            return;
          }
        }
      },

      renderVocab(main) {
        const lang = this.state.uiLang;
        const t = I18N[lang] || I18N.my;
        const items = this.state.masteredVocab;

        main.innerHTML = `
          <h2>📖 Vocabulary Bank</h2>
          ${items.length === 0 ? `<div class="card" style="text-align:center; padding:1.8rem; margin-top:0.85rem;"><p>${t.vocab_empty || 'No vocabulary yet.'}</p></div>` : `
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:0.65rem; margin-top:0.85rem;">
              ${items.map(v => `
                <div class="card" style="padding:0.85rem;">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong class="thai-txt" style="font-size:1.15rem;">${v.word}</strong>
                    <button class="audio-btn" onclick="AudioManager.speak('${v.word}')">🔊</button>
                  </div>
                  <small style="color:var(--primary); font-weight:700;">[${v.roman}]</small>
                  <div style="font-size:0.8rem; color:var(--text-muted); margin-top:0.25rem;">
                    ${typeof v.meaning === 'object' ? (v.meaning[lang] || v.meaning.en) : v.meaning}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        `;
      },

      renderProgress(main) {
        const lang = this.state.uiLang;
        const t = I18N[lang] || I18N.my;
        main.innerHTML = `
          <h2>📊 Progress</h2>
          <div class="card" style="margin-top:0.85rem;">
            <div style="display:flex; justify-content:space-around; text-align:center;">
              <div><h3 style="color:var(--primary); font-size:1.4rem;">${this.state.totalXP}</h3><small>${t.total_xp || 'Total XP'}</small></div>
              <div><h3 style="color:#F59E0B; font-size:1.4rem;">${this.state.streak}</h3><small>${t.streak || 'Streak'}</small></div>
            </div>
          </div>
        `;
      },

      renderSettings(main) {
        const lang = this.state.uiLang;
        const t = I18N[lang] || I18N.my;
        main.innerHTML = `
          <h2>⚙️ Settings</h2>
          <div class="card" style="margin-top:0.85rem;">
            <button class="primary-btn" onclick="App.exportData()">${t.export_btn || 'Export Backup'}</button>
          </div>
        `;
      },

      exportData() {
        const blob = new Blob([JSON.stringify(this.state, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `lingomaster_thai_backup_${Date.now()}.json`;
        a.click();
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
</html>

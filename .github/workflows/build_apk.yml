name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'

      - name: Build Full Flutter Project
        run: |
          cd /tmp
          flutter create --org com.allfree.language --project-name free_language_app myapp
          cd myapp
          cp "$GITHUB_WORKSPACE/pubspec.yaml" ./pubspec.yaml
          cp "$GITHUB_WORKSPACE/lib/main.dart" ./lib/main.dart
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-language-app-apk
          path: app-release.apk

name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project Setup
        run: |
          mkdir -p /tmp/fresh_app
          cd /tmp/fresh_app
          flutter create --org com.allfree.language --project-name free_language_app .
          cp -rn android $GITHUB_WORKSPACE/
          cp -rn ios $GITHUB_WORKSPACE/
          cp -rn web $GITHUB_WORKSPACE/
          cd $GITHUB_WORKSPACE

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-language-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
